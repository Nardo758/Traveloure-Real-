<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #FAFAF8; color: #1F2733; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1F2733; text-decoration: none; } a:hover { color: #E85D55; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 600px; padding: 24px; background: rgba(31,39,51,0.35);"><div style="background: #FAFAF8; border: 1px solid #E8E8E2; border-radius: 12px; box-shadow: 0 20px 60px rgba(31,39,51,0.25); padding: 28px; display: flex; flex-direction: column; gap: 20px;">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.14em; color: #E85D55;">Your plan</span>
      <h3 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 600; color: #1E3A5F;">When is it?</h3>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; border-radius: 999px; background: rgba(46,139,139,0.10); border: 1px solid #226B6B; font-size: 13px; font-weight: 600; color: #226B6B;">Date night <span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 400; color: #6A7480;">change</span></span>
  </div>
  <div style="display: flex; gap: 18px; flex-wrap: wrap;">
    <span style="display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: #226B6B;"><i style="display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #226B6B;"></i>Occasion</span> <span style="display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: #226B6B;"><i style="display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #226B6B;"></i>Where</span> <span style="display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: #1F2733; font-weight: 500;"><i style="display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #E85D55; background: #FFFFFF;"></i>When</span> <span style="display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: #B0AAA0;"><i style="display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #D5D0C8; background: #FFFFFF;"></i>Who</span> <span style="display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: #B0AAA0;"><i style="display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #D5D0C8; background: #FFFFFF;"></i>What's happening</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: #1F2733;">Date
      <span style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 1px solid #E8E8E2; border-radius: 8px; background: #FFFFFF; font-size: 15px; font-weight: 400; color: #1F2733;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6A7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        Fri, Oct 10, 2026
      </span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: #1F2733;">Time
      <span style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 1px solid #E8E8E2; border-radius: 8px; background: #FFFFFF; font-size: 15px; font-weight: 400; color: #1F2733;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6A7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
        19:00
      </span>
    </label>
  </div>
  <span style="font-size: 13px; color: #6A7480;">Your own city, one evening. No stops, no range.</span>
  <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 6px; border-top: 1px solid #E8E8E2;">
    <span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #9AA1A9;">Occasions that last a day ask for a date and a time, never a range.</span>
    <span style="display: inline-flex; align-items: center; padding: 11px 18px; border-radius: 10px; background: #E85D55; color: #FFFFFF; font-size: 14px; font-weight: 600;">Next: Who</span>
  </div>
</div></div>
</x-dc>
</body>
</html>
