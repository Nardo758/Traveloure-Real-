<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #FAFAF8; color: #1F2733; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1F2733; text-decoration: none; } a:hover { color: #E85D55; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 600px; padding: 24px; background: rgba(31,39,51,0.35);"><div style="background: #FAFAF8; border: 1px solid #E8E8E2; border-radius: 12px; box-shadow: 0 20px 60px rgba(31,39,51,0.25); padding: 28px; display: flex; flex-direction: column; gap: 18px;">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #E7E4DD; border-radius: 10px; background: #FFFFFF;">
    <span style="width: 56px; height: 56px; border-radius: 8px; background: #DCD6C8; flex-shrink: 0;"></span>
    <div style="display: flex; flex-direction: column; gap: 3px; flex: 1;">
      <span style="font-size: 15px; font-weight: 600; color: #1F2733;">Hanamizuki Florals</span>
      <span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #6A7480;">Florist · Kyoto · from $420</span>
    </div>
    <span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #6A7480; padding: 4px 9px; border-radius: 999px; border: 1px solid #E7E4DD; background: #F6F5F1; white-space: nowrap;">ceremony &amp; reception</span>
  </div>
  <h3 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 600; color: #1E3A5F;">Which event?</h3>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #E7E4DD; border-radius: 10px; background: #FFFFFF;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D5D0C8" stroke-width="2"><circle cx="12" cy="12" r="9"></circle></svg>
      <span style="font-size: 14px; font-weight: 500; color: #1F2733;">Rehearsal dinner</span>
      <span style="margin-left: auto; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #6A7480;">Fri 19:00</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #E85D55; border-radius: 10px; background: #FFFFFF;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E85D55" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4" fill="#E85D55" stroke="none"></circle></svg>
      <span style="font-size: 14px; font-weight: 500; color: #1F2733;">Ceremony</span>
      <span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: #226B6B;">suggested for florists</span>
      <span style="margin-left: auto; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #6A7480;">Sat 15:00 · Nanzen-ji</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #E7E4DD; border-radius: 10px; background: #FFFFFF;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D5D0C8" stroke-width="2"><circle cx="12" cy="12" r="9"></circle></svg>
      <span style="font-size: 14px; font-weight: 500; color: #1F2733;">Reception</span>
      <span style="margin-left: auto; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #6A7480;">Sat 18:00</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #E7E4DD; border-radius: 10px; background: #FFFFFF;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D5D0C8" stroke-width="2"><circle cx="12" cy="12" r="9"></circle></svg>
      <span style="font-size: 14px; font-weight: 500; color: #1F2733;">Farewell brunch</span>
      <span style="margin-left: auto; font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #6A7480;">Sun 10:30</span>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 6px; border-top: 1px solid #E8E8E2;">
    <span style="font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #9AA1A9;">A plan with one event skips this question.</span>
    <span style="display: inline-flex; align-items: center; padding: 11px 18px; border-radius: 10px; background: #E85D55; color: #FFFFFF; font-size: 14px; font-weight: 600;">Add to Ceremony</span>
  </div>
</div></div>
</x-dc>

</html>
