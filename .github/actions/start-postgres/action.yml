name: Start PostgreSQL (runner-installed)
description: >
  Starts the PostgreSQL server that GitHub's ubuntu-24.04 runner image already
  ships, and gives it exactly the shape the old `services: postgres:` containers
  had: role postgres / password postgres, database traveloure (UTF8, en_US.UTF-8),
  on localhost:5432. Nothing is pulled from any registry.

# WHY THIS EXISTS (ledger 2026-09-25-ci-postgres-runner-local).
# Every DB-backed job used to declare a `services: postgres:` container pulled
# anonymously from public.ecr.aws. With 64 such jobs and several PRs in CI at
# once, the anonymous quota ran out ("toomanyrequests: Rate exceeded" / "Data
# limit exceeded") and jobs died in "Initialize containers" before any test ran.
# The runner already has PostgreSQL installed, so no pull is needed at all.
#
# THE VERSION IS CHOSEN AND ASSERTED, NEVER ASSUMED (ledger 2026-10-30-row253b-ci-postgres-16). CI
# tests production's major, PostgreSQL 16 (production is 16.15). The runner image may ship another
# major (GitHub's ubuntu-24.04 image moved from 16 to 18 on Oct 27, 2026), so this step installs
# postgresql-16 from the PGDG apt repository when it is missing (major pinned, patch floats), moves
# every other cluster off port 5432 and puts 16/main on it. The assert then accepts 16 only; any other
# major fails loudly naming both. This reverses the '16 18' acceptance of 2026-10-27-ci-postgres-18-runner.
#
# USAGE: put it immediately after actions/checkout, before anything that touches
# the database. DB setup (migrations, sessions table, CI users) stays in
# ./.github/actions/ci-db-setup — this action only provides the server.

inputs:
  expected-major:
    description: Space-separated PostgreSQL major versions CI accepts (fails on any other). Production is 16.
    required: false
    default: '18'

runs:
  using: composite
  steps:
    - name: Start the runner's PostgreSQL and create role/database
      shell: bash
      env:
        EXPECTED_MAJOR: ${{ inputs.expected-major }}
      run: |
        set -euo pipefail
        cd /tmp  # sudo -u postgres cannot read the workspace; avoids a harmless-but-noisy warning

        PG_USER=postgres
        PG_PASSWORD=postgres
        PG_DB=traveloure
        # The old container ran initdb with en_US.utf8. Collation decides text
        # ORDER BY results, so the database keeps that locale rather than the
        # runner cluster's default (C.UTF-8).
        PG_LOCALE=en_US.UTF-8

        # Production's major, from the PGDG apt repository: major pinned, patch floats. Skipped when the
        # runner already has it. apt.postgresql.org.sh (shipped by postgresql-common) adds the repository
        # only when the runner's own sources do not already offer postgresql-16.
        PG_MAJOR=16
        if [ ! -x "/usr/lib/postgresql/${PG_MAJOR}/bin/postgres" ]; then
          echo "Installing PostgreSQL ${PG_MAJOR} from the PGDG apt repository..."
          sudo apt-get update -qq
          if ! apt-cache policy "postgresql-${PG_MAJOR}" | grep -q 'Candidate: [0-9]'; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "postgresql-${PG_MAJOR}" >/dev/null
        fi

        # Only 16/main may hold port 5432 or start with the service: every other cluster is stopped,
        # moved to another port and set to start manually, so the default connection is PostgreSQL 16.
        sudo systemctl stop postgresql.service || true
        while read -r ver name port _; do
          if [ "${ver}" != "${PG_MAJOR}" ] || [ "${name}" != "main" ]; then
            sudo pg_ctlcluster "${ver}" "${name}" stop >/dev/null 2>&1 || true
            echo manual | sudo tee "/etc/postgresql/${ver}/${name}/start.conf" >/dev/null
            sudo pg_conftool "${ver}" "${name}" set port "$(( 5500 + ver ))"
          fi
        done < <(pg_lsclusters --no-header)
        if ! pg_lsclusters --no-header | awk '{print $1"/"$2}' | grep -qx "${PG_MAJOR}/main"; then
          sudo pg_createcluster "${PG_MAJOR}" main --port 5432 >/dev/null
        fi
        sudo pg_conftool "${PG_MAJOR}" main set port 5432
        echo auto | sudo tee "/etc/postgresql/${PG_MAJOR}/main/start.conf" >/dev/null
        # postgresql-common's systemd generator reads start.conf only on a daemon reload.
        sudo systemctl daemon-reload

        if ! command -v pg_isready >/dev/null 2>&1 || ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
          echo "::error::No PostgreSQL installation found on this runner, and installing postgresql-16 from the PGDG apt repository did not provide one."
          exit 1
        fi

        if ! locale -a | grep -qiE '^en_US\.utf-?8$'; then
          echo "Generating the ${PG_LOCALE} locale (not present on this runner)..."
          sudo locale-gen "${PG_LOCALE}" >/dev/null
        fi

        sudo systemctl start postgresql.service

        for i in $(seq 1 30); do
          if pg_isready -h localhost -p 5432 -q; then break; fi
          if [ "$i" -eq 30 ]; then
            echo "::error::PostgreSQL did not accept connections on localhost:5432 within 30s."
            sudo systemctl status postgresql.service --no-pager || true
            exit 1
          fi
          sleep 1
        done

        ACTUAL_MAJOR=$(( $(sudo -u postgres psql -tAc "SHOW server_version_num") / 10000 ))
        if [[ " ${EXPECTED_MAJOR} " != *" ${ACTUAL_MAJOR} "* ]]; then
          echo "::error::The server on localhost:5432 is PostgreSQL ${ACTUAL_MAJOR}, but CI accepts only PostgreSQL ${EXPECTED_MAJOR// / or } (production's major). Check the PGDG install and cluster steps in .github/actions/start-postgres/action.yml."
          exit 1
        fi
        echo "PostgreSQL ${ACTUAL_MAJOR} accepted (CI accepts ${EXPECTED_MAJOR// / or })."

        sudo -u postgres psql -v ON_ERROR_STOP=1 -qc "ALTER ROLE ${PG_USER} WITH PASSWORD '${PG_PASSWORD}';"

        if [ "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${PG_DB}'")" != "1" ]; then
          sudo -u postgres createdb -T template0 -E UTF8 --locale="${PG_LOCALE}" "${PG_DB}"
        fi

        # Prove the exact connection every job uses: TCP + password, not the peer socket.
        PGPASSWORD="${PG_PASSWORD}" psql -h localhost -p 5432 -U "${PG_USER}" -d "${PG_DB}" -v ON_ERROR_STOP=1 -tAc \
          "SELECT 'PostgreSQL ' || current_setting('server_version') || ' ready: ' || current_database() || ' (' || datcollate || ')' FROM pg_database WHERE datname = current_database();"
