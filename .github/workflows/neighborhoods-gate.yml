name: Neighborhoods Gate

on:
  # Merge queue (ledger `2026-10-18-merge-queue-triggers`): the queue's run is always a full run.
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Cancel superseded PR runs. A new push to a PR makes the previous run's jobs
# dead work that still holds runner slots, so the new run queues behind its own
# predecessor. cancel-in-progress is scoped to `pull_request` ONLY: a push to
# main must keep its run, because a cancelled main run leaves a merged commit
# with no green record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

jobs:
  # CI-1b (c)+(d) (scripts/ci/ci-skip-rules.cjs): decides whether this PR push runs the heavy jobs. A draft or
  # a docs-only / other-workflow-only push skips them; a job skipped by its `if:` reports success, so every
  # required check still reports on the merge head. Only an explicit run=false skips: any other event, a file
  # list it cannot read, or this job failing outright leaves the suites running (fail open).
  changes:
    name: changes (skip suites on drafts and docs-only pushes)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          sparse-checkout: scripts/ci
      - name: Skip rules self-test
        run: node scripts/ci/ci-skip-rules.cjs --self-test
      - id: decide
        name: Decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node scripts/ci/ci-skip-rules.cjs --decide

  verify-neighborhoods:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    name: verify-neighborhoods (logic gate, no DB)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Assert spec file exists (neighborhoods)
        # Guard: if playwright/tests/neighborhoods.spec.ts is renamed or deleted,
        # `npx playwright test neighborhoods` silently reports "0 passed" and exits 0
        # — the gate goes green with no assertions actually run.  This step fails
        # fast before the Playwright invocation so the breakage is explicit.
        #
        # Fix when this fails:
        #   Either restore playwright/tests/neighborhoods.spec.ts to that path, OR
        #   update the path in this check AND in the "Neighborhoods spec integrity"
        #   step below to match the new location.
        run: |
          if [ ! -f "playwright/tests/neighborhoods.spec.ts" ]; then
            echo "::error file=.github/workflows/neighborhoods-gate.yml::Spec file not found: playwright/tests/neighborhoods.spec.ts — rename or restore it before re-running this gate."
            exit 1
          fi
          echo "Spec file present ✅"
      - name: Neighborhoods spec integrity (static analysis, no browser or DB)
        # Runs playwright/tests/neighborhoods.spec.ts — a pure static-analysis suite
        # that verifies scripts/verify-neighborhoods.ts has the correct 16 checks and
        # all three guard-rule sections.  No browser, server, or database required.
        run: npx playwright test neighborhoods
        env:
          CI: 'true'
      - name: Assert script file exists (verify-neighborhoods)
        # Guards against scripts/verify-neighborhoods.ts being renamed or deleted.
        # If missing, the "Phase 8.3 pure-logic gate" step below would fail with a
        # cryptic "file not found" error.  This step surfaces the breakage immediately.
        run: |
          if [ ! -f "scripts/verify-neighborhoods.ts" ]; then
            echo "::error file=.github/workflows/neighborhoods-gate.yml::Script not found: scripts/verify-neighborhoods.ts — rename or restore it before re-running this gate."
            exit 1
          fi
          echo "✅  scripts/verify-neighborhoods.ts exists"
      - name: Phase 8.3 pure-logic gate (16 checks)
        run: npx tsx scripts/verify-neighborhoods.ts

  lockfile-purity:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    name: lockfile-purity (no replit.local)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Fail if package-lock.json points at Replit firewall
        run: |
          if grep -n "replit.local" package-lock.json; then
            echo "::error::replit.local in package-lock.json breaks npm ci on GitHub runners."
            exit 1
          fi
          echo "lockfile clean"

  report:
    name: report (PR comment)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    needs: [changes, verify-neighborhoods, lockfile-purity]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && (always() && github.event_name == 'pull_request') }}
    steps:
      - name: Post pass/fail summary
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = r => r === 'success' ? 'OK' : r === 'skipped' ? 'SKIP' : 'FAIL';
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` - ${d.result}`);
            const allGreen = Object.values(needs).every(d => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [`## Neighborhoods Gate - ${allGreen ? 'all green' : 'attention needed'}`, '', ...rows, '', `[Run details](${runUrl})`].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
