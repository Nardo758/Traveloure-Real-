name: Neighborhoods Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-neighborhoods:
    name: verify-neighborhoods (logic gate, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Assert spec file exists (verify-neighborhoods)
        # Guards against scripts/verify-neighborhoods.ts being renamed or deleted.
        # If the file no longer exists at this path the "Phase 8.3 pure-logic gate"
        # step below fails with a cryptic "file not found" error that gives no hint
        # about where to update the path reference.  This step surfaces the breakage
        # immediately with a clear ::error:: annotation pointing at this workflow file.
        #
        # Fix when this fails:
        #   Either restore scripts/verify-neighborhoods.ts to its expected path, OR
        #   update the path in the "Phase 8.3 pure-logic gate" step below AND in
        #   this check to match the new location.
        run: |
          if [ ! -f "scripts/verify-neighborhoods.ts" ]; then
            echo "::error file=.github/workflows/neighborhoods-gate.yml::Spec file not found: scripts/verify-neighborhoods.ts — rename or restore it before re-running this gate."
            exit 1
          fi
          echo "✅  scripts/verify-neighborhoods.ts exists"
      - name: Phase 8.3 pure-logic gate (16 checks)
        run: npx tsx scripts/verify-neighborhoods.ts

  lockfile-purity:
    name: lockfile-purity (no replit.local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if package-lock.json points at Replit firewall
        run: |
          if grep -n "replit.local" package-lock.json; then
            echo "::error::replit.local in package-lock.json breaks npm ci on GitHub runners."
            exit 1
          fi
          echo "lockfile clean"

  report:
    name: report (PR comment)
    runs-on: ubuntu-latest
    needs: [verify-neighborhoods, lockfile-purity]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post pass/fail summary
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = r => r === 'success' ? 'OK' : r === 'skipped' ? 'SKIP' : 'FAIL';
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` - ${d.result}`);
            const allGreen = Object.values(needs).every(d => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [`## Neighborhoods Gate - ${allGreen ? 'all green' : 'attention needed'}`, '', ...rows, '', `[Run details](${runUrl})`].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
