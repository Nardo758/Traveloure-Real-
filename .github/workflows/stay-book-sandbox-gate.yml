name: Stay Book Sandbox Gate (LiteAPI book then immediate cancel)

# S1-d-3b (ledger `2026-10-11-s1-d3b-stay-book-ui`; S1-d-3 rulings): re-proves in CI the LiteAPI field
# names verified by the founder's Oct 9 sandbox run. SANDBOX ONLY, QA-domain account only, the booking is
# cancelled IMMEDIATELY. It needs the repository secret `LITEAPI_SANDBOX_API_KEY`.
#
# STATED, NOT HIDDEN (§18d): when that secret is not configured the job prints a warning naming it and
# runs NOTHING — a green run without the secret proves nothing about LiteAPI, and the warning says so.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    # CI-1b (c): docs-only and other-workflow-only changes do not trigger this workflow
    # (scripts/ci/ci-skip-rules.cjs canonicalPaths; later entries win).
    paths:
      - '**'
      - '!**/*.md'
      - 'CLAUDE.md'
      - 'generated/**'
      - 'client/public/.well-known/**'
      - '!.github/workflows/**'
      - '.github/workflows/stay-book-sandbox-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

jobs:
  stay-book-sandbox:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: stay-book-sandbox (LiteAPI sandbox book + immediate cancel)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.LITEAPI_SANDBOX_API_KEY != '' }}
    steps:
      - name: Sandbox key present?
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning file=.github/workflows/stay-book-sandbox-gate.yml::NOT RUN — repository secret LITEAPI_SANDBOX_API_KEY is not configured. Nothing about LiteAPI was proven by this job."
          fi

      - uses: actions/checkout@v5.1.0
        if: env.HAS_KEY == 'true'

      - name: Start PostgreSQL (runner-installed; no registry pull)
        if: env.HAS_KEY == 'true'
        uses: ./.github/actions/start-postgres

      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
        if: env.HAS_KEY == 'true'

      - name: Install Playwright (chromium)
        if: env.HAS_KEY == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        if: env.HAS_KEY == 'true'
        run: npm run build

      - name: Set up CI database (migrations + sessions table)
        if: env.HAS_KEY == 'true'
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'false'

      - name: Start production server (LiteAPI sandbox)
        if: env.HAS_KEY == 'true'
        run: node dist/index.cjs > /tmp/server.log 2>&1 &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET_TEST: whsec_ci_stub_no_real_calls
          STRIPE_CONNECT_WEBHOOK_SECRET_TEST: whsec_ci_stub_no_real_calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          ALLOW_TEST_ACCOUNTS: '1'
          # Set and ignored: a production boot never serves the canned draft.
          # j-stay-book-sandbox.spec.ts never calls a draft route, so this job has no draft assertion.
          E2E_AI_STUB: '1'
          PORT: 5000
          SESSION_COOKIE_INSECURE: '1'
          RATE_LIMIT_LOOPBACK_SKIP: '1'
          INTERNAL_JOB_SECRET: ci-internal-secret
          QA_ACCOUNT_EMAIL_DOMAIN: traveloure-qa.test
          LITEAPI_API_KEY: ${{ secrets.LITEAPI_SANDBOX_API_KEY }}
          LITEAPI_ENV: sandbox
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server
        if: env.HAS_KEY == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:5000/api/ready | grep -q '"ready":true'; then echo "Server ready"; exit 0; fi
            sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"; tail -80 /tmp/server.log; exit 1

      - name: Kyoto LiteAPI static sync (sandbox)
        if: env.HAS_KEY == 'true'
        run: |
          curl -sf -X POST -H "x-internal-secret: ci-internal-secret" http://localhost:5000/internal/jobs/liteapi-sync --max-time 900 | tee /tmp/sync.json
          echo

      - name: Book then cancel (sandbox, QA account)
        if: env.HAS_KEY == 'true'
        # ONE attempt (--retries=0): retrying a book-and-cancel after a hang could leave a second sandbox booking
        # uncancelled. The JSON report is what the spec-arming gate reads: a skipped book-and-cancel is refused there with the
        # spec's own reason (ledger 2026-10-11-spec-arming-verified), so this run's success alone proves nothing.
        run: npx playwright test playwright/tests/journeys/j-stay-book-sandbox.spec.ts --project=chromium --workers=1 --retries=0 --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-json/results.json
          # The spec's setup sets hotel_margin_public to migration 366's seeded rate on this disposable database.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          JOURNEY_DB_WRITES_OK: '1'
          BASE_URL: http://localhost:5000
          CI: 'true'
          LITEAPI_SANDBOX_E2E: '1'
          QA_ACCOUNT_EMAIL_DOMAIN: traveloure-qa.test
          # The spec names each hotel's rates error from the server's own log when it skips (ledger
          # 2026-10-15-sandbox-rates-unavailable-skip).
          STAY_SANDBOX_SERVER_LOG: /tmp/server.log

      - name: Raise a notice for each skipped test (a skip is never silent on main)
        if: always() && env.HAS_KEY == 'true'
        run: node scripts/report-playwright-skips.cjs playwright-json/results.json "stay-book-sandbox skipped"

      - name: Server's LiteAPI lines (the re-quote, the floor margin, each prebook refusal)
        if: always() && env.HAS_KEY == 'true'
        run: grep -E "liteapi-booking|liteapi-rates" /tmp/server.log || echo "no LiteAPI lines in the server log"

      - name: Cancel any live sandbox booking this run left (always)
        # S1-d-3c: a run cancelled or timed out between book and cancel can leave a live SANDBOX booking at LiteAPI.
        # Every live row in this run's own disposable database is found at LiteAPI (stored id, else our client
        # reference) and cancelled. Sandbox key and localhost database only; it refuses anything else.
        if: always() && env.HAS_KEY == 'true'
        run: npx tsx scripts/liteapi-sandbox-cleanup.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          LITEAPI_API_KEY: ${{ secrets.LITEAPI_SANDBOX_API_KEY }}
          LITEAPI_ENV: sandbox

      - name: Upload the Playwright JSON report (read by the spec-arming gate)
        if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json
          path: playwright-json/
          if-no-files-found: error
