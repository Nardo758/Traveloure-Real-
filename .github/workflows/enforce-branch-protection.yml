name: Enforce Branch Protection

# Reads .github/branch-protection.json and applies the required status checks
# to the main branch as a REPOSITORY RULESET via the GitHub REST API. This makes
# the Tier 1 gate list in CI_GATES.md machine-enforced rather than
# documentation-only.
#
# CI-1 Phase 1 (decision-maker ruling 1, Oct 12, 2026; ledger
# `2026-10-12-ci1-post-merge-stamp`): classic branch protection moves to a
# ruleset whose SOLE bypass actor is the Ledger Stamp GitHub App (repository
# variable LEDGER_STAMP_APP_ID), so the post-merge stamp (ledger-stamp.yml) can
# push its docs-only commit without the merge-main push. All 39 contexts are
# preserved. The classic required-status-checks are retired ONLY by a manual
# dispatch with `retire_classic_status_checks: true`, after the ruleset has
# been verified — never as a side effect of a push.
#
# THREE ACTIVE RULESETS ON MAIN, SPLIT BY WHO MAY BYPASS (decision-maker, Oct 14, 2026; ledger
# `2026-10-14-ci1-ruleset-split`), each declared in .github/branch-protection.json:
#   - "main — required status checks" (`ruleset`): the 39 contexts; APPLIED and verified here; sole
#     bypass = the Ledger Stamp App.
#   - "Protect main (review + checks …)" (`review_ruleset`, id 21765961): pull_request + checks; bypass =
#     admins in pull-request mode + the App. Only require_last_push_approval is written; the run REFUSES
#     before writing if it carries deletion/non_fast_forward.
#   - "main — no force-push/delete" (`no_force_push_ruleset`, id 25037632): deletion + non_fast_forward
#     with NO bypass. READ ONLY here: asserted to exist, be active, carry exactly those rules and an
#     empty bypass list. Those two rules live only there and are never re-added to the review ruleset.
#
# Trigger: every push to main that touches CI_GATES.md or this file itself,
# plus manual dispatch so an admin can re-apply after any manual UI change.
#
# Permissions/token: updating branch protection needs repo *administration*
# rights, which is NOT a grantable GITHUB_TOKEN permission scope — there is no
# `administration:` key in a workflow `permissions:` block (declaring one fails
# workflow-file validation with zero jobs), and the installation token never
# receives that right regardless of Settings → Actions → Workflow permissions.
# So this workflow authenticates with a repo-scoped PAT stored under the
# exact repository secret name `BRANCH_PROTECTION_PAT`. A fine-grained token
# for this workflow must be scoped to Nardo758/Traveloure-Real- and grant
# repository Administration: Read and write. Since Oct 14, 2026 it is the
# fine-grained "Traveloure enforcer" token (expires 2026-11-13 — rotate before). The GH_TOKEN expressions below
# prefer BRANCH_PROTECTION_PAT and fall back to secrets.GITHUB_TOKEN only so
# the failure mode without the PAT is a clear branch-protection API error
# rather than a missing-env crash.
#
# Status context (for branch-protection required checks):
#   This workflow APPLIES required checks; it does not itself need to be
#   a required check. Do not add it to the Tier 1 table in CI_GATES.md.

on:
  push:
    branches: [main]
    paths:
      - '.github/branch-protection.json'
      - '.github/CI_GATES.md'
      - '.github/workflows/enforce-branch-protection.yml'
  workflow_dispatch:
    inputs:
      retire_classic_status_checks:
        description: "After the ruleset is verified, delete the classic required-status-checks on main (the ruleset then enforces them alone)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enforce-branch-protection:
    name: enforce-required-status-checks
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Check branch-protection token configuration
        env:
          BRANCH_PROTECTION_PAT: ${{ secrets.BRANCH_PROTECTION_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${BRANCH_PROTECTION_PAT:-}" ]; then
            echo "::warning::Repository secret BRANCH_PROTECTION_PAT is missing or empty."
            echo "::warning::Use the exact repository secret name BRANCH_PROTECTION_PAT. A secret stored under any other name (for example Nardo758) will not be read by this workflow."
            echo "::warning::This job will fall back to GITHUB_TOKEN for legibility, but ruleset and branch-protection requests will still fail unless BRANCH_PROTECTION_PAT is configured with repository Administration: Read and write."
          else
            echo "BRANCH_PROTECTION_PAT is configured."
          fi

      - name: Apply the ruleset from branch-protection.json
        env:
          # Exact secret name required: BRANCH_PROTECTION_PAT
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STAMP_APP_ID: ${{ vars.LEDGER_STAMP_APP_ID }}
        run: |
          set -euo pipefail

          NAME=$(jq -r '.ruleset.name' .github/branch-protection.json)
          BRANCH=$(jq -r '.branch' .github/branch-protection.json)
          # The sole bypass actor is the Ledger Stamp App; with no app id configured the ruleset has none.
          jq --arg branch "$BRANCH" --arg app "${STAMP_APP_ID:-}" '{
              name: .ruleset.name,
              target: "branch",
              enforcement: "active",
              conditions: { ref_name: { include: ["refs/heads/" + $branch], exclude: [] } },
              rules: [ { type: "required_status_checks", parameters: {
                strict_required_status_checks_policy: .required_status_checks.strict,
                required_status_checks: [ .required_status_checks.contexts[] | { context: . } ] } } ],
              bypass_actors: (if $app == "" then [] else [ { actor_id: ($app | tonumber), actor_type: "Integration", bypass_mode: "always" } ] end)
            }' .github/branch-protection.json > /tmp/ruleset.json

          ID=$(gh api "repos/$REPO/rulesets?includes_parents=false" --paginate --jq ".[] | select(.name == \"$NAME\") | .id" | head -1)
          if [ -n "$ID" ]; then
            echo "Updating ruleset $ID ($NAME)"
            gh api --method PUT "repos/$REPO/rulesets/$ID" --input /tmp/ruleset.json > /dev/null
          else
            echo "Creating ruleset ($NAME)"
            gh api --method POST "repos/$REPO/rulesets" --input /tmp/ruleset.json > /dev/null
          fi
          if [ -z "${STAMP_APP_ID:-}" ]; then
            echo "::warning::Repository variable LEDGER_STAMP_APP_ID is not set — the ruleset has NO bypass actor and the ledger stamp cannot push."
          fi

      - name: Verify the ruleset matches the declaration
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STAMP_APP_ID: ${{ vars.LEDGER_STAMP_APP_ID }}
        run: |
          set -euo pipefail

          NAME=$(jq -r '.ruleset.name' .github/branch-protection.json)
          ID=$(gh api "repos/$REPO/rulesets?includes_parents=false" --paginate --jq ".[] | select(.name == \"$NAME\") | .id" | head -1)
          gh api "repos/$REPO/rulesets/$ID" > /tmp/live.json

          DECLARED=$(jq -r '.required_status_checks.contexts[]' .github/branch-protection.json | sort)
          LIVE=$(jq -r '.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' /tmp/live.json | sort)
          MISSING=$(comm -23 <(echo "$DECLARED") <(echo "$LIVE"))
          EXTRA=$(comm -13 <(echo "$DECLARED") <(echo "$LIVE"))
          if [ -n "$MISSING$EXTRA" ]; then
            echo "ERROR: ruleset contexts differ from the declaration."
            echo "Missing: $MISSING"
            echo "Extra: $EXTRA"
            exit 1
          fi
          [ "$(jq -r .enforcement /tmp/live.json)" = "active" ] || { echo "ERROR: ruleset is not active"; exit 1; }

          ACTORS=$(jq -c '[.bypass_actors[]? | {actor_id, actor_type}]' /tmp/live.json)
          if [ -n "${STAMP_APP_ID:-}" ]; then
            WANT=$(jq -nc --arg app "$STAMP_APP_ID" '[{actor_id: ($app | tonumber), actor_type: "Integration"}]')
          else
            WANT='[]'
          fi
          if [ "$ACTORS" != "$WANT" ]; then
            echo "ERROR: bypass actors are $ACTORS, expected $WANT (the Ledger Stamp App only)."
            exit 1
          fi
          echo "✓ Ruleset '$NAME' is active with all $(echo "$DECLARED" | wc -l) declared contexts; bypass actors: $ACTORS"

      - name: Set require_last_push_approval on the review ruleset
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Matched by ID (a rename must not lose it); the declared name is only a label checked below.
          ID=$(jq -r '.review_ruleset.id' .github/branch-protection.json)
          NAME=$(jq -r '.review_ruleset.name' .github/branch-protection.json)
          WANT=$(jq -r '.review_ruleset.require_last_push_approval' .github/branch-protection.json)
          if ! gh api "repos/$REPO/rulesets/$ID" > /tmp/review.json; then
            echo "::error::Review ruleset $ID ('$NAME') could not be read."
            exit 1
          fi
          LIVE_NAME=$(jq -r .name /tmp/review.json)
          if [ "$LIVE_NAME" != "$NAME" ]; then
            echo "::warning::Ruleset $ID is named '$LIVE_NAME' live but '$NAME' in branch-protection.json — update the declaration."
          fi
          # Force-push/deletion live ONLY in the no-bypass ruleset. Refuse before any write if they are here:
          # a PUT of this ruleset would otherwise carry them (and its bypass actors) back.
          STRAY=$(jq -r '[.rules[].type | select(. == "deletion" or . == "non_fast_forward")] | join(", ")' /tmp/review.json)
          if [ -n "$STRAY" ]; then
            echo "::error::Ruleset $ID ('$LIVE_NAME') carries $STRAY; those rules belong only to the no-bypass ruleset. Nothing written — remove them in Settings → Rules."
            exit 1
          fi
          HAVE=$(jq -r '.rules[] | select(.type == "pull_request") | .parameters.require_last_push_approval' /tmp/review.json)
          if [ "$HAVE" = "$WANT" ]; then
            echo "✓ '$LIVE_NAME' already has require_last_push_approval=$WANT."
            exit 0
          fi
          # Only this one parameter changes; name, target, enforcement, conditions, every other rule and the
          # bypass actors are sent back exactly as read.
          jq --argjson v "$WANT" '{name, target, enforcement, conditions, bypass_actors,
              rules: [ .rules[] | if .type == "pull_request" then .parameters.require_last_push_approval = $v else . end ]}' \
            /tmp/review.json > /tmp/review-put.json
          gh api --method PUT "repos/$REPO/rulesets/$ID" --input /tmp/review-put.json > /dev/null
          AFTER=$(gh api "repos/$REPO/rulesets/$ID" --jq '.rules[] | select(.type == "pull_request") | .parameters.require_last_push_approval')
          [ "$AFTER" = "$WANT" ] || { echo "ERROR: '$LIVE_NAME' require_last_push_approval is $AFTER, expected $WANT"; exit 1; }
          echo "✓ '$LIVE_NAME' require_last_push_approval: $HAVE → $AFTER (nothing else changed)."

      # READ ONLY. This step never writes the no-force-push ruleset; a failed assertion is fixed by a human
      # in Settings → Rules (decision-maker, Oct 14, 2026).
      - name: Assert the no-force-push ruleset (read only)
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ID=$(jq -r '.no_force_push_ruleset.id' .github/branch-protection.json)
          NAME=$(jq -r '.no_force_push_ruleset.name' .github/branch-protection.json)
          if ! gh api "repos/$REPO/rulesets/$ID" > /tmp/nofp.json; then
            echo "::error::No-force-push ruleset $ID ('$NAME') does not exist or could not be read."
            exit 1
          fi
          FAIL=0
          LIVE_NAME=$(jq -r .name /tmp/nofp.json)
          [ "$LIVE_NAME" = "$NAME" ] || echo "::warning::Ruleset $ID is named '$LIVE_NAME' live but '$NAME' in branch-protection.json."
          ENF=$(jq -r .enforcement /tmp/nofp.json)
          [ "$ENF" = "active" ] || { echo "::error::Ruleset $ID enforcement is '$ENF', expected 'active'."; FAIL=1; }
          ACTORS=$(jq -c '.bypass_actors // []' /tmp/nofp.json)
          [ "$ACTORS" = "[]" ] || { echo "::error::Ruleset $ID has bypass actors $ACTORS; it must have none."; FAIL=1; }
          WANT_RULES=$(jq -c '.no_force_push_ruleset.rules | sort' .github/branch-protection.json)
          LIVE_RULES=$(jq -c '[.rules[].type] | sort' /tmp/nofp.json)
          [ "$LIVE_RULES" = "$WANT_RULES" ] || { echo "::error::Ruleset $ID rules are $LIVE_RULES, expected $WANT_RULES."; FAIL=1; }
          TARGET=$(jq -r '.target + " " + (.conditions.ref_name.include | join(","))' /tmp/nofp.json)
          case "$TARGET" in
            "branch ~DEFAULT_BRANCH"|"branch refs/heads/main") ;;
            *) echo "::error::Ruleset $ID targets '$TARGET', expected the default branch (main)."; FAIL=1 ;;
          esac
          [ "$FAIL" = 0 ] || exit 1
          echo "✓ Ruleset $ID '$LIVE_NAME' is active on main with $LIVE_RULES and no bypass actors."

      - name: Retire the classic required status checks (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.retire_classic_status_checks
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH=$(jq -r '.branch' .github/branch-protection.json)
          # Runs only after the verify step above passed in this same job. Removes ONLY the classic
          # required-status-checks sub-resource; any other classic setting is left for a human.
          if gh api "repos/$REPO/branches/$BRANCH/protection/required_status_checks" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$REPO/branches/$BRANCH/protection/required_status_checks"
            echo "✓ Classic required status checks removed from $BRANCH; the ruleset enforces them."
          else
            echo "No classic required status checks on $BRANCH — nothing to retire."
          fi
