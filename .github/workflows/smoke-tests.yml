name: Smoke Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smoke:
    name: Playwright Smoke Tests (35 suites)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traveloure
          POSTGRES_PASSWORD: traveloure
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://traveloure:traveloure@localhost:5432/traveloure
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret-placeholder
      BASE_URL: http://localhost:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Push database schema
        run: npm run db:push

      - name: Seed test accounts
        run: npx tsx server/scripts/seed-test-users.ts
        continue-on-error: true

      - name: Start application server
        run: npm run dev &
        env:
          PORT: 5000

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server on :5000 ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health; then
              echo "Server is up!"
              break
            fi
            sleep 2
          done

      - name: Run smoke tests (batched)
        run: bash playwright/run-smoke.sh --reporter=list
        env:
          BASE_URL: http://localhost:5000
          TIMEOUT: 60000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
