      # §17's own suite. It proves the daily drift job DETECTS and does not REPAIR, across all
      # THREE booking rails — cart checkout (`service_bookings`), the still-live legacy `bookings`,
      # and, as of the V-3 lane, the store's `ready_made_purchases`. N23 is the new rail: five kinds
      # seeded as real rows against an injected Stripe view, plus the negatives that carry the
      # weight — a healthy purchase raises nothing, a purchase inside the fulfilment grace raises
      # nothing, a buyer-deleted clone raises nothing, a re-detected drift records no second row,
      # and the three rails never indict each other's PaymentIntents.
