      # partition) — so a row a TS seeder invents without one is unreachable from all of them. That
      # produced the `custom-other` dead end (repaired on disk by migrations 189 + 208) and the ten
      # "services-*" bundle rows, whose slugs were ALREADY the bundle-key namespace in
      # shared/constants/providerCategories.ts. R1 keyed-or-declared, R2 no bundle-key collision,
      # R3 every offering's category_key resolves. Node built-ins only — no npm ci, no DB. Predicate
      # fixtures FIRST (§18d).
      - name: Category-reachability guard predicate self-test
        run: node scripts/check-category-reachability.cjs --self-test
      - name: Category-reachability guard
        run: node scripts/check-category-reachability.cjs

