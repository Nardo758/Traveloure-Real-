name: Build Smoke

# Closes the gate hole that let a syntax error reach main looking clean:
# the logic gate tests an isolated module and the e2e never had a green run, so
# nothing actually built or booted the app. This runs the real production build
# (vite client + esbuild server bundle via `npm run build`), which FAILS on
# syntax / bundling errors but does NOT type-check — so it tolerates the
# pre-existing baseline type errors (a `tsc --noEmit`-clean gate is impossible
# against that baseline). Catches the dropped-sort-block class of bug.
#
# The type-error BASELINE is gated separately below (`tsc-baseline`): 197 as of
# 2026-08-05 @ ea0bbc05, and the number only ever moves DOWN.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (vite + esbuild bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Production build (syntax/bundle gate — does NOT run tsc)
        run: npm run build

      # 2026-09-05-well-known-static (CLAUDE.md Locked Decision 43(e)): Stripe verifies an Apple
      # Pay domain by fetching /.well-known/apple-developer-merchantid-domain-association, and the
      # SPA catch-all was answering that fetch with 200-HTML ("404 – Lost at Sea?"), so the domain
      # could not be registered and nothing logged a thing (§9: a dead endpoint returns 200-HTML,
      # NOT 404). O1-O4 pin the ONE thing that makes the fix work — the mount's SOURCE POSITION,
      # above serveStatic()'s pre-bind catch-all and above setupVite()/mountSpaFallback();
      # B1-B4 boot a real express app on loopback (no DB, no Stripe) and pin byte-identical
      # text/plain delivery, an uncached response, a PLAIN 404 for an unknown .well-known path and
      # an honest 404 when the directory is absent entirely, plus the traversal/dotfile refusals.
      # It runs HERE, immediately after the
      # build, because D3 — the dotfile directory surviving Vite's publicDir copy into
      # dist/public — is the half a source-only test cannot see; without a build it says so and
      # skips rather than passing quietly. F1/F2 pin the association file: byte-shape when it is
      # committed, and a documented operator drop-in while it is not.
      - name: Well-known static mount pin (LD 43(e))
        run: npx tsx --test server/__tests__/well-known-static.test.ts

      # 2026-09-06-expert-work-protected (CLAUDE.md Locked Decision 42 D3 + D4): expert work is
      # protected where money is protected — rows carrying expert_note or origin='expert' join
      # the optimizer baseline's constraint set, itineraryItemRebuildDeletable() and BOTH
      # apply-to-trip replace deletes spare them, and the owner may not write expert_note (the
      # PATCH strip + the live create rail's strip/re-admit for WRITE-status advisors). Pure and
      # static pins: the ONE row-level predicate, its WHERE-clause form in the guard, both delete
      # sites carrying the SAME clause, the baseline's fixedCommitments routing, and E7's file-set
      # pin that no third expression of the class exists anywhere under server/.
      - name: Expert-work protection pin (LD 42 D3/D4)
        run: npx tsx --test server/__tests__/expert-work-protected.test.ts

      # 2026-09-06-optimizer-run-predicate (CLAUDE.md Locked Decision 42 D17): the optimizer run —
      # paid, free re-run, or Trip Pass — REWRITES the plan's items, so all four run gates
      # (comparison create, generate, apply-to-trip, optimize-order + its dead twin) are authorized
      # by the item-mutation predicate (getTripWriteRole/canMutateTrip: owner ‖ WRITE-status
      # advisor, NEVER pending, plus the parallel author branch), never the logistics read tier.
      # Pure + static pins: per-handler predicate presence, no authorizeTripLogistics( call in any
      # run gate, pending excluded at the predicate by construction, no second authorization
      # module invented, and the scope-discipline pins (reorder's D1 gate and the READ-shaped
      # preview are untouched).
      - name: Optimizer run predicate pin (LD 42 D17)
        run: npx tsx --test server/__tests__/optimizer-run-predicate.test.ts


      # ── tsc baseline ratchet ──────────────────────────────────────────────────
      # The repo is NOT tsc-clean, so the gate is a CEILING, not zero. THE NUMBER
      # ONLY EVER MOVES DOWN: a lane that removes errors lowers TSC_BASELINE in the
      # same PR so the improvement is locked in and cannot be spent as headroom by
      # the next lane. Coming in UNDER the ceiling therefore fails too — with the
      # instruction to lower it here.
      #
      # 194 measured on 2026-08-07 (fix waves 1-2 removed three errors; was 197
      # @ ea0bbc05, 199 before PR #430). Before this step existed the discipline
      # had no machine enforcement at all — every "baseline" in the repo was a
      # stale prose number (191/209/254/~137, none of them current).
      # 183 measured 2026-08-10 on PR #451 (down from 190) — the ratchet fired
      # exactly as designed: this lane's work removed 7 errors and the gate
      # refused to let the headroom survive. Locked in here, same PR.
      # 170 measured 2026-08-12 — POST-RECONCILIATION baseline (ledger 80): merging
      # the replit line into main net-removed 13 errors (their storage/routes/schema
      # edits replaced error-bearing code); the scheduler-unification / merge changes
      # introduced ZERO new type errors (none in any touched file). Locked in here.
      # 164 measured 2026-08-17 on lane/partner-demand-data (2A.3 party-size de-masking):
      # dropping the fabricated numberOfTravelers/adults defaults net-removed 4 errors
      # (the default-related type narrowings on the trip-creation path); ZERO new type
      # errors in any touched file. Ratchet fired as designed — locked in here, same PR.
      # 157 measured 2026-08-21 after the Distribution parity pass; ZERO new type
      # errors in the touched server/client paths. Locked in here, same PR.
      # 156 measured 2026-08-25 while landing the Ready-Made completeness gate.
      # The ratchet detected the reduction and requires it to be locked in.
      # 136 measured 2026-09-04 (ledger `2026-09-04-contract-stats-column`): fixing
      # getContractStats to read `contractStatus` — the column that actually exists on
      # vendor_contracts — removed the two TS2339 `Property 'status' does not exist`
      # errors that had been sitting inside this baseline since it was first taken.
      # Note the shape of that: the compiler KNEW the dashboard's "N active" tile could
      # never be right, and a ceiling that only forbids the number going UP is why the
      # two errors could live here indefinitely. Locked in, same PR.
      # 133 measured 2026-09-05 (analytics-events rescue): the trackEvent refactor widened
      # sendAnalyticsEvent's parameter from `Record<string, unknown>` to `object`, which cleared
      # the three TS2345 errors its own three callers had been contributing to this baseline
      # (trackSearchEvent / trackItineraryGenerated / trackBookingEvent — an interface with
      # optional members is not assignable to an index-signature type). The ratchet detected the
      # reduction and requires it to be locked in. Locked in, same PR.
      # 132 measured 2026-09-05 (ledger `2026-09-05-build-id-and-map-fallback`): the mobile
      # full-screen `ExperienceMap` mount in experience-template.tsx passed a `cart` prop the
      # component has never declared or read — a dead prop carrying that mount's only TS2322.
      # Deleting it removed the error; ZERO new type errors in any file this lane touched.
      # Locked in, same PR.
      # 131 measured 2026-09-07 (ledger `2026-09-07-orphan-sweep`): deleting the six
      # importerless dashboard components under §18c removed one error that lived in
      # one of them. ZERO new type errors in any file batch 3 touched. Locked in, same PR.
      # 130 measured 2026-09-08 (ledger `2026-09-08-recorded-cleanups`): `GET /api/service-bookings`
      # hand-composed its provider object and read `provider.profileImage`, which is not a `users`
      # column — one TS2339 that had shipped as an always-`undefined` key for the route's whole
      # life. Routing it through the shared `toBookingProvider` allowlist removed the error.
      # ZERO new type errors in any file batch 4 touched. Locked in, same PR.
      - name: tsc baseline ratchet (down-only)
        env:
          TSC_BASELINE: '130'
        run: |
          count=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "tsc --noEmit: $count error(s); baseline ceiling: $TSC_BASELINE"
          if [ "$count" -gt "$TSC_BASELINE" ]; then
            echo "::error::tsc errors went UP: $count > baseline $TSC_BASELINE. Fix the net-new type errors in this change."
            npx tsc --noEmit 2>&1 | grep "error TS" | head -40
            exit 1
          fi
          if [ "$count" -lt "$TSC_BASELINE" ]; then
            echo "::error::tsc errors went DOWN to $count (baseline $TSC_BASELINE) — good! Now LOCK IT IN: set TSC_BASELINE to $count in .github/workflows/build.yml in this same PR. The baseline only ever moves down; leftover headroom is how it creeps back up."
            exit 1
          fi
          echo "tsc baseline holds at $count ✅"

  money-endpoint-guard:
    name: money-endpoint-guard (CLAUDE.md §14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Operation-scoped guard: fails if a money-operation handler (or a money-named file) sources
      # amount/price/userId from req.body. Node built-ins only — no npm ci needed. See §14.
      # Predicate fixtures FIRST (ruling 42/43): a guard with a wrong predicate passes truthfully,
      # so the predicate itself is proven before its verdict is trusted.
      - name: Money-guard predicate self-test
        run: node scripts/check-money-endpoints.cjs --self-test
      - name: Client-trusted amount/identity/rate guard
        run: node scripts/check-money-endpoints.cjs

  item-removed-logging-guard:
    name: item-removed-logging-guard (R15 removal-signal coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if an itinerary_items hard-delete path lacks an item-removed:<kind> annotation, or a
      # `logged` site has no same-transaction `item_removed` write. Node built-ins only — no npm ci
      # needed. See ledger 2026-08-17-partner-demand-r15-transition-log. Predicate fixtures FIRST
      # (§18d): a guard with a wrong predicate passes truthfully.
      - name: Item-removed guard predicate self-test
        run: node scripts/check-item-removed-logging.cjs --self-test
      - name: Item-removed logging coverage guard
        run: node scripts/check-item-removed-logging.cjs

  itinerary-rebuild-guard:
    name: itinerary-rebuild-guard (D-1 rebuild-delete money-safety coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a trip-scoped itinerary_items rebuild-delete lacks `itineraryItemRebuildDeletable()`
      # and no `// rebuild-guard-exempt:<reason>`. Closes the D-1 class (origin is never a money guard;
      # a rebuild delete keys on routing_status + booking presence). Node built-ins only — no npm ci.
      # See ledger 2026-08-31-rebuild-delete-money-guard. Predicate fixtures FIRST (§18d).
      - name: Rebuild-guard predicate self-test
        run: node scripts/check-itinerary-rebuild-guard.cjs --self-test
      - name: Itinerary rebuild-delete coverage guard
        run: node scripts/check-itinerary-rebuild-guard.cjs

  traveler-fee-coverage:
    name: traveler-fee-coverage (ruling 2026-09-02 — every charge path bills + ledgers the fee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a known traveler-charging path stops resolving the fee via resolveTravelerServiceFee
      # or stops writing it to fee_ledger via a shared writer. Node built-ins only — no npm ci.
      # See ruling 2026-09-02-traveler-fee-applies-everywhere. Predicate fixtures FIRST (§18d).
      - name: Traveler-fee coverage predicate self-test
        run: node scripts/check-traveler-fee-coverage.cjs --self-test
      - name: Traveler-fee coverage gate
        run: node scripts/check-traveler-fee-coverage.cjs

  traveler-charge-composition:
    name: traveler-charge-composition (docs/ROADMAP.md §A A3 — the commission is never billed to the buyer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # 2026-09-08-cart-fee-line: `service_bookings.platform_fee` is the provider's WITHHELD share,
      # and the cart charge added the same number to the traveler's bill — so the platform collected
      # the commission twice, with the ruled traveler service fee on top; /api/cart and the fee
      # preview quoted the same line, so the surfaces agreed with each other and all three were
      # wrong. P1-P12 pin the ONE composition (price + concierge + surcharge + traveler fee) and the
      # ledger identity: provider earnings and the platform's own revenue are UNCHANGED, only the
      # second collection disappears; a PRE-A3 row still reads back the way it was actually charged,
      # because there is no backfill and a re-read the new way would indict every historical booking
      # (§13). S1-S12 read the shipped source, because a composition is worth what its call sites
      # are: the charge, the deposit base, the claim's snapshot, /api/cart, the fee preview, the
      # client summary, the re-drive, all three reconciliation sites, the refund ceiling and the
      # cancellation basis, plus §15's untouched idempotency key, atomic stamp and pre-flight marker.
      - name: Traveler-charge composition pin (A3)
        run: npx tsx --test server/__tests__/traveler-charge-composition.test.ts

  offering-activation-gate:
    name: offering-activation-gate (2026-09-11-offering-activation-validation)
    runs-on: ubuntu-latest
    env:
      # NO DATABASE IS REACHED. The suite tests the gate's pure halves (its seller-facing refusal
      # map) and the STATIC placement of its call sites; this var exists only because
      # `server/services/offering-activation-gate.service.ts` imports `server/db.ts`, which throws
      # at IMPORT time when it is unset. Same posture as legacy-rail-traveler-charge below.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/unused-no-connection-is-opened
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # The transition scoping is the RULING, not a softening: production's 61 demo listings are
      # KEPT (2026-09-11-oc-a1-ratified) and resolve as unclassified, so a gate that ran on an
      # ordinary edit of an already-active row would refuse the corpus the platform is being tested
      # with. T1/T2 pin that from the FILE (comments stripped), never from a literal call count;
      # T3 pins the single caller module; R1/R2 pin that every refusal the resolver can produce has
      # a seller-facing sentence naming a fix, with the reason set DERIVED by driving the resolver.
      - name: Offering activation gate pin
        run: npx tsx --test server/__tests__/offering-activation-gate.test.ts
      # 2026-09-12-offering-contract-snapshot (lane OC-B1): the terms a booking was committed under,
      # recorded on `service_bookings.offering_contract_snapshot` (migration 291). B1 RECORDS and
      # OC-B2/D3 DECIDE, so the lane's largest claim is a negative one — no checkout behaviour moved
      # — and K1/K2 pin it by DERIVING the Stripe idempotency-key template set and the claim
      # predicates from the file set with comments stripped, never from a literal call count. S1-S6
      # pin that a resolvable listing round-trips the ONE resolver's answer verbatim and an
      # unresolvable one (the 61 kept demo listings) records the REFUSAL with no archetype anywhere
      # in the blob; L1-L2 pin the pre-lane row's untouched era discriminator and the additive,
      # CHECK-free, backfill-free migration; W1-W3 pin one write / one author / one classification;
      # A1 pins the §19 allowlist posture on a freshly-added privileged column.
      # (Pure — no query is issued — but it imports `shared/schema.ts`, so it belongs in an `npm ci`
      # job and never a Node-built-ins guard job. DATABASE_URL is the job env above.)
      - name: Offering contract snapshot pin
        run: npx tsx --test server/__tests__/offering-contract-snapshot.test.ts

  legacy-rail-traveler-charge:
    name: legacy-rail-traveler-charge (2026-09-08-legacy-rail-fee — the same fix on the legacy rail)
    runs-on: ubuntu-latest
    env:
      # NO DATABASE IS REACHED. Both suites replace `db.execute` / `db.transaction` before any call
      # and assert on the SQL they were handed; these two vars exist only because `server/db.ts` and
      # `server/services/stripe.service.ts` throw at IMPORT time when they are unset.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/unused-no-connection-is-opened
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_no_call_is_made
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # 2026-09-08-legacy-rail-fee: `POST /api/bookings/process-cart` charged the traveler
      # `price + platform_fee` while paying the provider `price − platform_fee` — the same
      # double-collection the cart rail's A3 lane closed, on the rail it deliberately left alone.
      # P1-P6 pin the charge (price + the band-driven traveler fee, composed by the SHARED
      # `composeTravelerCharge`), the two numbers that must NOT move (`platform_fee`,
      # `provider_payout`), the row identity that only now holds, the A3 presence-discriminator and
      # the absence of any backfill, and the deposit split.
      - name: Legacy-rail traveler charge pin
        run: npx tsx --test server/__tests__/legacy-rail-traveler-charge.test.ts
      # The §14 price-provenance pin for the same handler. It had been RED since the traveler fee
      # landed on this rail (its count-ordered mock answered the fee_bands read with no row, so
      # every item was refused) and RED since the variant-price provenance ruling (its variant row
      # carried no catalog link) — invisible because the file was in no workflow. Repaired and
      # wired, never deleted; its total-amount assertion is repaired to the ruled composition.
      - name: AI-item price provenance pin (§14)
        run: npx tsx --test server/__tests__/booking-ai-price-guard.test.ts

  claims-only-lookup-guard:
    name: claims-only-lookup-guard (session-user extraction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a server/ file reads a session user id via claims.sub without an `.id`
      # fallback (or the shared getUserId helper). Email-login sessions only carry
      # claims.sub; OAuth sessions may only carry .id — a claims-only read causes false
      # 403s (~120 routes were fixed for this once). Node built-ins only — no npm ci needed.
      - name: Guard self-tests (fixture cases)
        run: node scripts/check-claims-only-user-lookups.cjs --self-test
      - name: Claims-only session-user lookup guard
        run: node scripts/check-claims-only-user-lookups.cjs

  unmounted-router-guard:
    name: unmounted-router-guard (CLAUDE.md §9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a server/routes/*.ts router is imported into routes.ts but never app.use()d
      # (dead → 200-HTML). Node built-ins only — no npm ci needed. See §9.
      - name: Unmounted-router guard
        run: node scripts/check-unmounted-routers.cjs

  trip-mint-owner-guard:
    name: trip-mint-owner-guard (CLAUDE.md §13 L10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a trips-INSERT site doesn't mint the owner's trip_collaborators row (or carry a
      # trip-mint-owner-ok annotation for deliberate NULL-owner authoring builds). getTripRole
      # resolves access by assignment only, so an owner-less mint locks the owner out of their own
      # trip. Node built-ins only — no npm ci needed. See §13 L10.
      - name: Trip-mint owner-access guard
        run: node scripts/check-trip-mint-owner-access.cjs

  fee-literal-guard:
    name: fee-literal-guard (phase2-fee-gate — DECISIONS.md ruling 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Grep gate: no optimize/coordination fee literals in LOGIC code (fee_bands seed /
      # migrations / config rows excluded; `// fee-literal-ok: <reason>` exempts a line).
      # Predicate fixtures FIRST (ruling 42/43) — this gate was blind to every SCREAMING_SNAKE fee
      # constant for its whole life while reporting PASS.
      - name: Fee-gate predicate self-test
        run: bash scripts/phase2-fee-gate.sh --self-test
      - name: Fee-literal grep (scripts/phase2-fee-gate.sh)
        run: bash scripts/phase2-fee-gate.sh

  migration-chain-integrity:
    name: migration-chain-integrity (DECISIONS.md rulings 19, 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Ruling 19: migration numbering re-verified at merge — the chain-integrity test is arbiter.
      - name: chain-integrity test
        run: npx tsx --test server/migrations/__tests__/chain-integrity.test.ts

  walkthrough-pins:
    name: walkthrough-pins (EX-1 logout endpoint + EX-2 price floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Pure-unit pins from docs/testing/EXPERT_UX_WALKTHROUGH.md — no DB, no browser.
      # EX-1: no client file may navigate to the Replit-only GET /api/logout (session survived
      # the click off-Replit); the shared logout must POST /api/auth/logout.
      - name: EX-1 logout endpoint pin
        run: npx tsx --test client/src/lib/__tests__/logout-endpoint-pin.test.ts
      # EX-2: insertProviderServiceSchema rejects negative/non-numeric prices on the create AND
      # .partial() (PATCH) shapes; zero stays parseable (draft state — publish gate is route-level).
      - name: EX-2 service price-floor pin
        run: npx tsx --test server/__tests__/service-price-floor.test.ts
      # Ready-Made listings must pass the same completeness gate at submit and approval.
      - name: Ready-Made completeness gate
        run: npx tsx --test server/routes/__tests__/ready-made-completeness-gate.test.ts
      # Thin gem detail (2026-08-29-replit-gem-audit ruling 3): the discover teaser
      # ships EXACTLY the ruled key set — address / popularity ratios / mainstream
      # forecast / discovery status stay removed, attribution ships only resolved.
      - name: Gem teaser projection gate
        run: npx tsx --test server/services/__tests__/gem-teaser.test.ts
      # F-1: trip DATE columns reach the client as "YYYY-MM-DD"; `new Date()` reads those as
      # UTC midnight, so a viewer west of UTC rendered the PREVIOUS day. The pin only reproduces
      # west of UTC, so it runs under three timezones — a UTC-only run would pass on the bug.
      - name: F-1 trip-date local-parse pin (3 timezones)
        run: |
          for tz in America/New_York Asia/Tokyo UTC; do
            echo "--- TZ=$tz ---"
            TZ="$tz" npx tsx --test client/src/lib/__tests__/trip-date-local-parse.test.ts
          done
      # QA F3: the SAME date-only defect on the Guest Invites caption — `user_experiences.event_date`
      # is a DATE column, so `new Date("2026-10-10")` showed every viewer west of UTC the 9th, a
      # day that can fall outside the plan's own range. Three timezones for the same reason.
      - name: QA F3 guest-invite caption local-parse pin (3 timezones)
        run: |
          for tz in America/New_York Asia/Tokyo UTC; do
            echo "--- TZ=$tz ---"
            TZ="$tz" npx tsx --test client/src/lib/__tests__/guest-invite-meta.test.ts
          done
      # QA F13: the SAME date-only class one boundary further out. The occasion workstation holds
      # its dates as the UTC-midnight instants `new Date("YYYY-MM-DD")` produces and handed the
      # hero card `date.toISOString()` — an INSTANT, which `parseTripDate` is right to read as one
      # — so the card said "13 Nov-15 Nov" for a plan stored Nov 14-16 while the Trip Strip beside
      # it said "Nov 14 -> Nov 16". Three timezones for the same reason as F-1/F3.
      - name: QA F13 hero-card date-range local-parse pin (3 timezones)
        run: |
          for tz in America/New_York Asia/Tokyo UTC; do
            echo "--- TZ=$tz ---"
            TZ="$tz" npx tsx --test client/src/lib/__tests__/hero-card-date-range.test.ts
          done
      # QA F10: the Experiences dropdown shipped a footer leaf whose i18nKey no locale file
      # carried, so production rendered the literal "browseAllOccasions". The parity spec diffs
      # the locales against EACH OTHER and was correctly green — a key missing from en AND ja is
      # at perfect parity. This pin asks the other question: does every key nav-config DECLARES
      # exist in every locale on disk.
      - name: Nav i18n key pin
        run: npx tsx --test client/src/lib/__tests__/nav-i18n-keys.test.ts
      # F-2: ONE trip-target resolver for the /services grid and the service-detail page — the
