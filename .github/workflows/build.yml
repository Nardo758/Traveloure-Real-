      # claim's composer births one `booking_component_states` row per component WITH the
      # server-derived snapshot price (C1); the client-facing birth rail births none (C1b); a component
      # flip is ONE row under a concurrent double call (C2); `partially_completed` is reached exactly
      # when every component has an answer, at least one delivered and at least one failed (C3/C3b),
      # and NEVER when nothing delivered (C3c); the flip mints ONCE over the REDUCED pro-rata figures
      # and a second run mints nothing (C4); an unpriced component refuses the flip and rolls it back
      # (C4b); a legacy jsonb bundle is still read with its source NAMED and can never become partial
      # (C5); the lists that learned the status, and the ones that deliberately did not (C6).
      - name: The bundle component rails (C1-C6)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/bundle-component-states.db.test.ts
      # The PURE layer beside it: the ONE parent derivation and the pro-rata reduction. No DB — wired in
      # this `npm ci` job because it imports `@shared/` (the #812 lesson).
      - name: The one bundle derivation (B-P1-B-P6)
        run: npx tsx --test --test-force-exit shared/__tests__/bundle-component-states.test.ts
      # D-51 PARTIAL SETTLEMENT (ledger 2026-09-16-bundle-partial-settlement; migration 307). The
      # composer births `allocation_cents` that sum EXACTLY to total_amount (S1); the settlement is ONE
      # reduced mint + ONE Stripe refund at the undelivered allocation plus the same share of every
      # traveler-paid fee, under the `bundle-settle-<id>` key, ONE refunds row, and the booking STAYS
      # partially_completed with no reversal rows (S2); a retry is alreadySettled (S3); two concurrent
      # callers produce one Stripe call (S4); a Stripe failure leaves a reclaimable claim that the sweep
      # re-drives past the TTL and nobody re-drives inside it (S5); the charge.refunded webhook promotes
      # once and a redelivery matches zero rows (S6); repricing after purchase moves nothing (S7); no
      # PaymentIntent ⇒ custody unknown ⇒ refused (S8); a `cancelled` row with NO pinned policy outcome
      # refuses by name while failed settles (S9); a pre-307 row mints by snapshot pro-rata and cannot
      # settle (S10). Stripe.refunds.create is stubbed.
      # LD 50 SECOND HALF — THE TRAVELER-CANCELLED COMPONENT (ledger
      # 2026-09-16-bundle-component-traveler-cancel; migration 309): the cancel is ONE flip under a
      # concurrent double call, pins `cancel_refund_percent`, and refuses a non-pending component, a
      # non-traveler and an unknown component by name (S11); a flexible cancel before the deadline
      # refunds 100% of the allocation + fee share (S12); a moderate cancel inside the window refunds 50%
      # and the seller keeps the rest, minted and NAMED in the basis (S13); a strict late cancel refunds
      # 0 and settles with NO Stripe call and a NULL refund id (S14); mixed failed + cancelled settles
      # once with the right sum (S15); no purchase-time policy snapshot ⇒ the cancel is refused and
      # nothing moves (S16); a policy edit or a reschedule after purchase moves nothing (S17).
      # LD 50 REMAINDER (ledger 2026-09-17-ld50-remainder-and-artifact-refund): `refunded` finally has its
      # ONE writer — the promote stamps every component it refunded in the same statement as the refund
      # columns, exactly once, and a retry is answered from the settled row instead of re-derived (S18/S19);
      # and a component outcome releases NO capacity, says so, and names what the BOOKING reserved, because
      # nothing reserves capacity per component anywhere on main (S20).
      - name: The bundle partial settlement (S1-S20)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/bundle-partial-settlement.db.test.ts
      # The PURE layer beside it: the allocation arithmetic, the basis the mint reads, the ONE settlement
      # derivation, and (SP9) the cancelled component's pinned-percent arithmetic in both the mint and the
      # settlement. No DB — wired in this `npm ci` job because it imports `@shared/` (the #812 lesson).
      - name: The one settlement derivation (SP1-SP9)
        run: npx tsx --test --test-force-exit shared/__tests__/bundle-partial-settlement.test.ts
      # THE ALL-UNDELIVERED PARENT (decision-maker ruling 2026-09-17; ledger
      # 2026-09-17-all-undelivered-parent; NO schema change, NO migration, NO new status value). When the
