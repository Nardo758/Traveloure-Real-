        run: node scripts/check-omit-schema-ratchet.cjs --self-test
      - name: omit-schema-ratchet · Omit-schema-ratchet guard
        if: ${{ !cancelled() }}
        run: node scripts/check-omit-schema-ratchet.cjs
      # 
      - name: demand-rollup-guard · Demand-rollup gate predicate self-test
        if: ${{ !cancelled() }}
        run: node scripts/check-demand-rollup.cjs --self-test
      - name: demand-rollup-guard · Demand-rollup discipline gate
        if: ${{ !cancelled() }}
        run: node scripts/check-demand-rollup.cjs
      - name: demand-rollup-guard · Coords-preservation predicate self-test
