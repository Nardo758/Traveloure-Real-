  duplicate-migration-prefix-guard:
    name: duplicate-migration-prefix-guard (ledger 2026-08-16-ledger-ids — three-way collision history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if two server/migrations/*.sql filenames (or MIGRATION_FILES registry entries)
