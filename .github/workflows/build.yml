      # the script enforce unconditionally, this job goes red instead of every publish going green.
      # Strict mode runs only from `.replit`'s `[deployment] build` → `npm run build:prod`.
      - name: Publish-preflight predicate self-test
        run: node scripts/publish-preflight.cjs --self-test
      - name: Publish-preflight is a no-op outside a deployment build
