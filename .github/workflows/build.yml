      # plan they paid for, and C7 pins the allowlist EXHAUSTIVE against `getTableColumns`, so a
      # column added tomorrow fails here until a human classifies it. No server boot, so no
      # ALLOW_TEST_ACCOUNTS and no reason for its own workflow file.
      - name: A clone carries content, not state (C1-C7)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/ready-made-clone-fields.db.test.ts
      # The pure layer beside it: the builder itself, exercised directly. This file previously
