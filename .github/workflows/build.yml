      # narrow exception on this rail, and it is not a money one: a DELIVERED purchase whose
      # `notified_at` is still NULL past the announce grace is HANDED BACK to the existing shared
      # sender — the job composes no message, sends nothing itself and never writes the column.
      # The negatives carry the weight as always: the grace keeps a fresh delivery out of it, a
      # second pass moves no timestamp (the stamp's WHERE is the guard), a `paid` row is never
      # announced, and a buyer who deleted their own clone trip is not indicted for housekeeping.
      - name: Reconciliation detection + ready-made recovery, retry and announce (N20–N27)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/reconciliation-detection.db.test.ts
