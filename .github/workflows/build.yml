  plan-proposals:
    name: plan-proposals (D-19; ledger 2026-09-15-d19-plan-proposals)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      SESSION_SECRET: ci-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
      NODE_ENV: test
      JOURNEY_DB_WRITES_OK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'false'
      # WHERE AN AI PROPOSAL LIVES (punchlist D-19 = option (b), migration 299). The expert
      # `trip_suggestions` rail cannot carry one — `expert_id` is NOT NULL and the approve path
      # hardcodes `origin:'expert'`, the false attribution Locked Decision 42 D4/D23 forbid by
      # name — so `plan_proposals` is a new child table of `trips`. P1 derives the column
      # expectation from `getTableColumns` so schema.ts and the database cannot drift (the
      # deploy-push durability rule), P2 pins CASCADE on the plan and SET NULL on the thread, P3
      # pins that the expert rail is untouched and no source mints an AI sentinel author, P4 is
      # the atomic discard (§15/§18b) and the refusal to discard an applied row (D18 — there is
      # no undo), P5 is the §19 allowlist pin over the route file SET, and P6/P7 mount the real
      # trips router against this job's Postgres (no server boot) for the §12 WRITE gate and the
      # 404-never-403 posture.
      - name: plan_proposals — the store, its refusals and its two routes (P1-P7)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/plan-proposals.db.test.ts
      # THE APPLY IS THE CHARGE POINT (punchlist D-20 = A, D-21 = A; migration 300; ledger
      # `2026-09-15-d20-d21-proposal-charge`). Same rail, same store, same Postgres — so it rides
      # this job rather than standing up a second database for the other half of one table.
      # D-20: the price is FLAT and comes from the `concierge:ai_task` fee band, never a literal
      # (§8) — C7 asserts the EQUALITY against the row and follows an admin edit. D-21: ONE charge
      # per DISTINCT PROPOSAL APPLIED — C1 fires two concurrent claims and proves exactly one
      # lands (§15b: the statement is the guard, never a check-then-update), C5 proves a second
      # apply is 409 with no second items. C2 proves a Trip-Pass-covered apply creates NO
      # PaymentIntent and takes NO claim (LD 41 (a)), C3 proves an unauthorized apply writes
      # nothing, C4 proves `origin:'ai'` is server-stamped and a `replaces` naming expert work is
      # REFUSED with the reason rather than skipped (LD 42 D3, §13), and C6 pins the ruled answer
      # for a discard after a claim. NO STRIPE CALL is made — every leg here is reachable without
      # one, and the two that are not are proven in the pure suite below.
      - name: the AI-proposal apply charge — claim, basis, band and refusals (C1-C7)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/plan-proposal-charge.db.test.ts
      # The PURE layer beside it: the authorization DECISION, exercised with no database at all.
      # `resolveProposalApplyAuthorization` imports no db, no storage and no Stripe client (A8
      # derives that from the file), which is what lets the bases order — trip pass FIRST, then a
      # verified PaymentIntent — be proven in CI. LD 41 (a) exists because this class of failure is
      # SILENT: a covered traveler answered "payment required" throws nothing and logs nothing.
      - name: the apply authorization predicate, exercised directly (A1-A9)
        run: npx tsx --test --test-force-exit server/__tests__/proposal-apply-authorization.test.ts
      # L16 LANE 1 + LANE 1b — THE CREATE RAIL, COMPLETE (punchlist D-45..D-50, ledgers
      # `2026-09-16-l16-rulings-d45-d50` and `2026-09-16-l16-lane1b-model-call`). Lane 1 built
      # everything that was not the model call and answered an honest 503; lane 1b built the call
      # to the §4 design the decision-maker read first, and RE-PINNED A3 rather than deleting it.
      # The PURE suite covers D-50's sanitiser (no model-produced number is persisted; an unknown
      # listing drops one addition; a protected `replaces` never reaches the row; an unknown key is
      # REFUSED), D-47's model knob, D-50 (c)'s staleness window, D-46 (i)'s in-flight marker,
      # §19's ask body, and — S12/S13 — the PROMPT SCOPE's §13 omissions (an uncaptured party size,
      # zone, occasion, event date or time is omitted; a half coordinate is not a location; a
      # catalog absence is STATED, and "this plan is empty" and "this market lists nothing" are
      # different sentences) plus the one predicate that tells an EMPTY answer from a refusal — all
      # with no database. The DB suite mounts the real trips router against this job's Postgres for
      # the §12 WRITE gate on ASK, D-48's OWNER-ONLY narrowing of PAY and APPLY (an accepted advisor
      # may ask/read/discard and is refused by both), D-48's aiTask read block, D-49's post-commit
      # re-finalize call, and — A8-A13 — the model call itself: D-47's three cost values on the
      # pre-minted id, D-50's input scope in BOTH directions (protected rows arrive as CONSTRAINTS;
      # `trips.expert_notes`, guest PII, another plan's rows, the asker's own `users` row and every
      # fee-band word are absent from the prompt ACTUALLY SENT), the price overwrite and the dropped
      # unknown listing, §4.4's failure table, the 409 that names the in-flight ask, and the
      # paid-vs-free catalog inclusion. **NO REAL MODEL CALL IS EVER MADE** — the transport seam is
      # stubbed for the whole file and its DEFAULT stub FAILS, so no case can pass by omission.
      - name: the AI-ask create rail — sanitiser, knobs, marker, body and prompt scope (S1-S13)
        run: npx tsx --test --test-force-exit server/__tests__/ai-ask-create-rail.test.ts
      - name: the AI-ask create rail's routes, D-48's narrowing and the MODEL CALL (A1-A13)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/ai-ask-create-rail.db.test.ts
      # D-50's RE-VALIDATION, PROVEN, AND OPTION B — REFUND THE FEE ON EXPIRY (decision-maker ruling
      # 2026-09-16; ledger `2026-09-16-l16-lane1-review-fixes`). Same rail, same store, same Postgres.
      # R1 proves PAY refuses a stale proposal BEFORE the §15b claim (no claim, no PaymentIntent);
      # R2 that APPLY on a covered plan refuses it with items untouched and NO refund block (nothing
      # was charged — §13); R3 that the re-validation is BY ID under the ONE liveness predicate (a
      # live listing behind 101 live decoys is found; a paused one is refused by id) — the finding
      # that retired the `.limit(100)` page-membership check; R4 that a PAID proposal refused at
      # apply is refunded ONCE under `ai-task-refund-<proposalId>` for Stripe's own amount, the row
      # flipping to `refunded` with the recorded charge and a booking-less `refunds` audit row; R5
      # that a retry reports the SAME refund with no second Stripe call and the row is terminal; R6
      # that two concurrent applies produce ONE refund (the claim is the status flip); R7 that a
      # failed Stripe call keeps the claim, answers `pending`, and the retry re-drives the SAME key —
      # recording an UNKNOWABLE prior refusal as exactly that (ruling 2026-09-17) rather than `retry`,
      # which named the call and not the reason (§13); and R8 that OPTION B is WIDENED to EVERY apply
      # refusal of a PAID proposal — a `protected_item` refusal (LD 42 D3) refunds through the SAME
      # path under the SAME key, which closes a row that was previously stuck for good (unappliable
      # by D3, undiscardable because discard refuses a row carrying a PaymentIntent).
      # Stripe is stubbed on the shared prototype (the bundle-settlement precedent); the refund stub
      # emulates Stripe's idempotency because that is the property R6 asserts. No network.
      - name: the AI-proposal re-validation and the Option B refund on a refused apply (R1-R8)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/plan-proposal-refund.db.test.ts

