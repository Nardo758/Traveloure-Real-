name: Build Smoke

# Closes the gate hole that let a syntax error reach main looking clean:
# the logic gate tests an isolated module and the e2e never had a green run, so
# nothing actually built or booted the app. This runs the real production build
# (vite client + esbuild server bundle via `npm run build`), which FAILS on
# syntax / bundling errors but does NOT type-check — so it tolerates the ~191
# pre-existing baseline type errors (a `tsc --noEmit`-clean gate is impossible
# against that baseline). Catches the dropped-sort-block class of bug.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (vite + esbuild bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Production build (syntax/bundle gate — does NOT run tsc)
        run: npm run build

  money-endpoint-guard:
    name: money-endpoint-guard (CLAUDE.md §14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Operation-scoped guard: fails if a money-operation handler (or a money-named file) sources
      # amount/price/userId from req.body. Node built-ins only — no npm ci needed. See §14.
      - name: Client-trusted amount/identity guard
        run: node scripts/check-money-endpoints.cjs

  claims-only-lookup-guard:
    name: claims-only-lookup-guard (session-user extraction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a server/ file reads a session user id via claims.sub without an `.id`
      # fallback (or the shared getUserId helper). Email-login sessions only carry
      # claims.sub; OAuth sessions may only carry .id — a claims-only read causes false
      # 403s (~120 routes were fixed for this once). Node built-ins only — no npm ci needed.
      - name: Guard self-tests (fixture cases)
        run: node scripts/check-claims-only-user-lookups.cjs --self-test
      - name: Claims-only session-user lookup guard
        run: node scripts/check-claims-only-user-lookups.cjs

  unmounted-router-guard:
    name: unmounted-router-guard (CLAUDE.md §9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a server/routes/*.ts router is imported into routes.ts but never app.use()d
      # (dead → 200-HTML). Node built-ins only — no npm ci needed. See §9.
      - name: Unmounted-router guard
        run: node scripts/check-unmounted-routers.cjs

  trip-mint-owner-guard:
    name: trip-mint-owner-guard (CLAUDE.md §13 L10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a trips-INSERT site doesn't mint the owner's trip_collaborators row (or carry a
      # trip-mint-owner-ok annotation for deliberate NULL-owner authoring builds). getTripRole
      # resolves access by assignment only, so an owner-less mint locks the owner out of their own
      # trip. Node built-ins only — no npm ci needed. See §13 L10.
      - name: Trip-mint owner-access guard
        run: node scripts/check-trip-mint-owner-access.cjs

  fee-literal-guard:
    name: fee-literal-guard (phase2-fee-gate — DECISIONS.md ruling 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Grep gate: no optimize/coordination fee literals in LOGIC code (fee_bands seed /
      # migrations / config rows excluded; `// fee-literal-ok: <reason>` exempts a line).
      - name: Fee-literal grep (scripts/phase2-fee-gate.sh)
        run: bash scripts/phase2-fee-gate.sh

  migration-chain-integrity:
    name: migration-chain-integrity (DECISIONS.md rulings 19, 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Ruling 19: migration numbering re-verified at merge — the chain-integrity test is arbiter.
      - name: chain-integrity test
        run: npx tsx --test server/migrations/__tests__/chain-integrity.test.ts

  decision-guards-lint:
    name: decision-guards-lint (ledger lint — DECISIONS.md ruling 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Every [guarded: name] ruling in docs/DECISIONS.md must name a guard that runs in CI
      # (script-only = MISSING, ruling 27). deferred:<lane> tags warn until their lane merges.
      - name: Ledger lint self-test
        run: node scripts/check-decision-guards.cjs --self-test
      - name: Ledger lint
        run: node scripts/check-decision-guards.cjs

  linkage-preservation-guard:
    name: linkage-preservation-guard (Trip-Canon Lane G / E2E_ITEM_LIFECYCLE.md §3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if an itinerary-item write site (createItineraryItem / db.insert(itineraryItems) /
      # bulkInsertItineraryItems) references a service-bearing source (cartItem, providerServiceId,
      # variantItems, …) without writing providerServiceId onto the item — the H1/H5 class. Node
      # built-ins only — no npm ci needed. See docs/E2E_ITEM_LIFECYCLE.md §3.
      - name: Linkage-preservation guard
        run: node scripts/check-linkage-preservation.cjs
