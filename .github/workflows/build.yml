  query-userid-reads-guard:
    name: query-userid-reads-guard (CLAUDE.md §14 — 2026-09-05-custom-venues-owner-scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # GET /api/custom-venues was unauthenticated and read `userId` off the QUERY STRING into a
      # storage reader that treated it as an optional filter — so no userId meant no WHERE clause
      # and the response was every custom venue on the table, private addresses included. Found on
      # a production walkthrough, not by a test: nothing errors and the page renders perfectly
      # either way. §14's existing guard (check-money-endpoints) watches BODY-sourced ids on MONEY
      # routes; this is the same class arriving through the query string on a plain read. It knows
      # SIX owner-id names and nothing else — the script header states the rest of its negative
      # space. Node built-ins only — no npm ci, no DB. Predicate fixtures FIRST (§18d).
      - name: Query/param owner-id guard predicate self-test
        run: node scripts/check-query-userid-reads.cjs --self-test
      - name: Query/param owner-id guard
        run: node scripts/check-query-userid-reads.cjs
      # 2026-09-05-ld40-lane2-public-ids (CLAUDE.md Locked Decision 40): a PUBLIC payload names an
      # earner by HANDLE, never by `users.id`. The storefront published `earner.id` under a comment
      # saying it was fine because other surfaces published it too — circular, and exactly how the
      # field spread. Two predicates: a users-shaped public projection allowlist may not name
      # `id`/`userId` (users-shaped is COMPUTED from columns unique to `users`, so a list written
      # before this guard is still checked), and a public route's `res.json` payload — or a
      # `load*`/`build*` payload builder's return — may not carry an identity key. Sibling of
      # check-query-userid-reads: that one watches what a route READS, this one what it RETURNS.
      # Its exemptions PRINT on every run, so LD 40's remaining lane-2 debt stays loud (ruling 32).
      # Node built-ins only — no npm ci, no DB. Predicate fixtures FIRST (§18d).
      - name: Public user-id guard predicate self-test
        run: node scripts/check-public-user-id.cjs --self-test
      - name: Public user-id guard
        run: node scripts/check-public-user-id.cjs
      # 2026-09-05-comparison-map-baseline-compare (LD 41): the review board's map gained "Your
      # plan" as its first tab and a compare toggle that draws it beneath a focused proposal as a
      # second sequence line. The map's honesty boundary already had a pure test; it was never
      # wired into CI, so nothing held it. B1-B4 pin the pure rules — the baseline leads the tab
      # order and keeps its own server-authored name without renumbering the proposals, the board
      # still OPENS on a proposal, the compare toggle is OMITTED (not disabled) wherever there is
      # nothing to compare, each series states its OWN "X of Y located" and the two are never
      # summed, and zero located stops on EVERY drawn series means NO MAP rather than a
      # city-centre fallback. B5 reads the shipped files, because a pure rule a call site can
      # reach past is not a rule: the board hands over the same `userVariant` the baseline column
      # renders, the ratified testids exist, BOTH renderers grew an optional second series rather
      # than a compare-only fork (§18 rule 1), and the surface labels its connectors as sequence
      # while deriving no distance or duration. B6-B7 pin the link BACK: the plancard names the
      # board only when a comparison row exists (the key is OMITTED, never null-filled), the id
      # comes off the same comparison row `lastOptimizedAt` already reads, and both the slip's
      # "See what changed" and PlanCard's "AI Optimized" pill read that DTO field rather than
      # fetching the user's comparisons to work out which board a plan came from.
      - name: Proposal comparison map pin
        run: npx tsx --test client/src/lib/__tests__/proposal-comparison-map.test.ts
      # 2026-09-05-template-card-and-preview-door (LD 39/41, ratified LD 42 D8 + D12): the
      # experience template stopped drawing a plan and stopped inventing dates. Both defects were
      # invisible on happy-path data — the client-assembled `PlanCard` printed zeroes for days,
      # activities, legs and time (counts nobody counted) and passed the CART TOTAL as the plan's
      # budget, while the "Itinerary Preview" ribbon filled a missing start/end with TODAY and
      # TODAY + 7 DAYS, so only a traveler who had NOT answered was given two dates they never
      # gave. C1-C3 pin that the card is gone by import, by mount and by each fabricated prop's
      # name, and that the page inherits Layout's ONE global Trip Strip rather than mounting a
      # second copy; L1-L2 pin the replacement link and that /plans/:tripId is a real route;
      # D1-D3 pin that no invented date survives in the file and that the surviving comparison
      # rail refuses a missing date through the single calendar-day extraction; R1-R4 pin the
      # hand-off — one handler behind all three renderings of the control, the slip when the page
      # is bound and the ONE modal when it is not, quoting no fee and minting no comparison; S1
      # pins the ratified door source shape (a blank passed as ABSENT, never as "").
      - name: Experience-template plan door pin
        run: npx tsx --test client/src/lib/__tests__/template-plan-door.test.ts
      # 2026-09-05-slip-own-your-plan (CLAUDE.md Locked Decision 42 rows 1.6 / S1 / S2 / D16). The
      # owner can finally add, edit, remove and reorder items on their own plan — through the four
      # rails that already existed, with no new route under server/. Every rule here is invisible on
      # happy-path data: D16 is a RENDER rule (a ✕ wrongly drawn for an advisor gives the plan a
      # second, unruled edit surface), §14's rule is about a field that must NOT be sent, and the
      # money rule is about a row that looks completely ordinary — a ✕ on a booked row severs the
      # only plan-side link to a `service_bookings` row and NOTHING in this repo puts it back.
      # T1-T2 pin the owner gate and the artboard's money rules (paid ⇒ no tools, booked ⇒ ↑ ✎ and
      # no ✕, a not-yet-charged checkout row still the traveler's to remove); T3-T4 pin the bodies
      # (the event link rides as an id AND as an explicit null, no money field is emitted, an
      # untouched optional is OMITTED rather than "", a cleared one is null, and `expertNote` never
      # rides — D4); T5 pins that reorder sends the DAY's full list swapped by GROUP neighbour, since
      # a partial list would silently renumber rows nobody touched; T6 pins that a slot with no
      # knowable day says so instead of filing the item on day 1; A1-A3 pin the shipped wiring.
      - name: Slip own-your-plan pin
        run: npx tsx --test client/src/lib/__tests__/slip-own-your-plan.test.ts
      # The server half of the same ruling (review R14), and the half that actually refuses: a
      # hidden button keeps nothing out. P1-P2 pin the ONE row-level "is this row money?" predicate
      # and that everything it refuses a delete for is ALSO spared by the rebuild guard's WHERE
      # clause — the two rails can never end up with one destroying what the other protects (§18
      # rule 1) — while stating why the rebuild set is deliberately WIDER. R1-R3 pin the shipped
      # 409 `item_booked`: read the real row first, refuse before the delete, role-blind, and no
      # second copy of the predicate anywhere under server/. N1 pins that the item CRUD + reorder
      # surface is still exactly the five paths that existed before this lane.
      - name: Booked-item delete refusal pin
        run: npx tsx --test server/__tests__/item-delete-booked-guard.test.ts

  slip-small-additions:
    name: slip-small-additions (CLAUDE.md Locked Decision 42 D18-D22 - 2026-09-06-slip-small-additions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Unlike the node-built-ins-only guard jobs, BOTH suites below import shared/ modules that
      # pull in `zod` (shared/contact-address.ts, shared/schema.ts), so this job installs deps.
      # Appending them to a guard job that skips `npm ci` fails with ERR_MODULE_NOT_FOUND.
      - run: npm ci
      # 2026-09-05-slip-decisions-d18-d22 + 2026-09-06-slip-small-additions (CLAUDE.md Locked
      # Decision 42's D18-D22 addendum, build-order row 1.3). D22 amends Locked Decision 40 with a
      # FOURTH context kind, `advisor`: the client names a PLAN and the server resolves the
      # counterpart from the trip plus its `trip_expert_advisors` row in a §12 access status. Every
      # rule is invisible on happy-path data — a rail that quietly accepted `{ tripId, receiverId }`
      # would work for every honest client and would have put back exactly the addressing that
      # ruling removed; "owner => advisor, advisor => owner" is a two-way rule a one-way
      # implementation passes from the traveler's side; and a plan with NO advisor must be the SAME
      # 404 as a plan that does not exist, because a helpful 403 tells a caller which trip ids are
      # real. V1-V3 pin the vocabulary, the closed address set and that an advisor context is
      # labelled by the plan's TITLE and never leaks the trip id; B1-B3 pin the `.strict()` refusal
      # of a user id, a handle or a second address beside the trip; R1-R5 pin the resolution in both
      # directions, the stranger, the both-roles case and the STATED multi-advisor tie-break; A1-A5
      # pin the shipped resolver (the canonical §12 allow-list rather than a re-typed literal, no
      # body-sourced identity, one refusal reason) and that D22 needed NO migration because
      # `context_kind` deliberately carries no CHECK.
      - name: Advisor conversation-context pin
        run: npx tsx --test server/__tests__/advisor-conversation-context.test.ts
      # The client half of the same lane: the five small things the slip could not say. Every one
      # is an ABSENCE rule and an absence leaves no trace — S5 renders `trips.expert_traveler_note`
      # and its PRIVATE sibling `trips.expert_notes` would render identically if a caller ever
      # reached for it (Locked Decision 21 forbids merging the three by name); S6's fallback to
      # `trips.destination` fires for EVERY legacy plan because `trip_destinations` has no backfill;
      # S7's NULL must render NOTHING, and a `?? "UTC"` added by a future tidy-up is invisible on
      # any plan whose zone is set (Locked Decision 30 forbids that substitution by name); D21 is
      # about two populations that must never merge into one number, whose failure mode is
      # "0 invited" on a roster that has not answered; and S3's line must be ABSENT rather than
      # greyed when no advisor is on the plan. Every static pin reads the slip's FILE SET
      # (SlipView + SlipRail) and asserts over their union, with comments stripped so a pin is
      # about the code rather than the prose explaining it — no literal call-site count, no
      # single-file literal.
      - name: Slip small-additions pin
        run: npx tsx --test client/src/lib/__tests__/slip-small-additions.test.ts

  slip-conformance:
    name: slip-conformance (CLAUDE.md Locked Decision 42 D6/D16 - 2026-09-06-slip-conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # NOT a "Node built-ins only" guard job: the suite imports client modules that resolve
      # `@shared/*` through the tsconfig paths (`../earner-address` -> `@shared/handle`), so it
      # needs the installed tree. Appending it to a guard job that skips `npm ci` fails with
      # ERR_MODULE_NOT_FOUND, which is exactly the mistake that cost a CI cycle on #812.
      - run: npm ci
      # 2026-09-06-slip-conformance: the six ways the shipped slip differed from the ratified
      # "Slip as the Surface" canvas. FIVE of the six are layout and copy, which no server test can
      # see and no type can hold, and every one of them fails SILENTLY:
      #   1 the rail rendered in the flow above the day list still shows every control - nothing
      #     throws, the plan simply starts below the fold - and Build/Finish/Plan/Share reads as a
      #     working rail while putting "Finalize plan" above the plan's own facts;
      #   2 D6's role chips are the failure a restated list causes: a literal
      #     florist/photographer/caterer array looks right on a wedding and is a taxonomy the client
      #     invented, and a NULL `roles_needed` rendered as a claim is what Locked Decision 31
      #     forbids by name ("never this occasion needs nobody");
      #   3 a `/s/<handle>` link for an expert who claimed no handle is indistinguishable from a
      #     live one until it is pressed (Locked Decision 40 - the handle IS the address);
      #   4 `planVersion` (the transition-log ROW COUNT) and `finalVersion` (a real snapshot's)
      #     both render as `v<n>`, so printing the wrong one at the top of a working plan is
      #     invisible unless something pins WHICH surface may print one;
      #   5 the slip's ask line must carry no count - the plancard activity has none, so a number
      #     there could only come from somewhere other than the thread it describes (§13);
      #   6 the Plan card's stops row must be a DOOR of the ONE planning modal, never a second
      #     caller of Locked Decision 34's single replace-list stop writer.
      # Every static pin reads the slip's FILE SET (SlipView + SlipRail) with comments stripped, so
      # a pin is about the code rather than the prose explaining it - no literal call-site count and
      # no single-file literal. Stated negative space: it cannot see whether anything RENDERS,
      # whether a Tailwind class produces the intended geometry, or whether the rail is actually
      # visible beside the list. Those are e2e and mock-audit answers.
      # §18d — the inventory extractor's own committed fixtures run BEFORE the pin that depends on
      # it. A wrong predicate is invisible by construction: an extractor that silently found no
      # controls would compare an empty set to an empty set and report a green relayout.
      - name: Slip action-inventory extractor self-test
        run: node scripts/lib/slip-action-inventory.cjs --self-test
      - name: Slip conformance pin
        run: npx tsx --test client/src/lib/__tests__/slip-conformance.test.ts
      # The rail regroup's own suite runs here too: this lane REPAIRED one of its pins (the
      # "Stops & timezone is a later lane" absence became the row plus its one-writer rule), and a
      # repaired pin is worth nothing if nothing runs it beside the change that repaired it.
      - name: Slip rail pin
        run: npx tsx --test client/src/lib/__tests__/slip-rail.test.ts

  item-origin-chip:
    name: item-origin-chip (CLAUDE.md Locked Decision 12 read-exposure - 2026-09-06-item-origin-chip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Deps are REQUIRED, not optional: `plancard-origin-exposure.test.ts` walks and reads shipped
      # source with node built-ins, but `item-origin.test.ts` IMPORTS the shipped helper, and the
      # client lib graph resolves through the installed toolchain. Appending either suite to one of
