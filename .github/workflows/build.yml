      # cannot be asserted against a hand-copied list — that is the same failure it exists to catch).
      - run: npm ci
      # LD 44 (e) phase 0 — the booking-agent status vocabulary. A2 and A5 are the ones that matter:
      # `researching`/`purchased_by_api` are server-written, and the human allowlist must not drift
      # into them. A3 pins that `purchased_by_*` and `confirmed` are never collapsed — "booked" is
      # said only with a confirmation in hand — and A4 pins that the legacy four stay legal stored
      # values, because there is no backfill and rewriting one would invent a fact (§13).
      - name: Booking-agent vocabulary pins
        run: npx tsx --test shared/__tests__/booking-agent-vocabulary.test.ts
      # LD 45 (1) — `conversations.trip_id`. B1/B2/B3 assert the DECLARATION, not the migration: an
      # object the schema layer does not declare is dropped by Replit's publish-time push and never
      # recreated, because migration 290 is stamped by then. B4 is the §19 negative fixture — under
      # an `.omit()` denylist a freshly-added column is client-settable BY DEFAULT.
      - name: Conversation trip-link pins
        run: npx tsx --test shared/__tests__/conversation-trip-link.test.ts
      # (The buy-action resolver's own 30 pins live in lane L23's job, which landed on `main` while
      # this branch was open — this lane deleted its duplicate resolver rather than adding a second
      # job for it. See the `ld23-buy-action-gap` annotations for what is still un-repointed.)
      # §18c — `upsellSource` was write-only attribution with no reader; the door pin now asserts its
      # ABSENCE, so a lane that puts the string back must give it a reader and amend the assertion.
      - name: Services-browse door pins (upsellSource retired)
        run: npx tsx --test client/src/lib/__tests__/services-browse-doors.test.ts
      # Re-run unchanged: this lane deliberately did NOT move the Catalog preview onto the landed
      # `resolveBuyAction` (see the gap note in that file), so P5's labels must still hold exactly.
      - name: Catalog preview presentation pins
        run: npx tsx --test client/src/lib/__tests__/catalog-preview-presentation.test.ts
      # THE ONE price-unit derivation (ledger `2026-09-14-price-unit-one-derivation`). N1-N5 are
      # the ones that matter: an absent, unrecognized or model-only input derives NOTHING, so no
      # surface can be handed a unit to print for a fact it does not have (§13) — the listing page
      # labelled a `per_person` listing "per service" because its local chain had a catch-all.
      # P6-P9 pin the exact spellings the four surfaces rendered before the module existed.
      - name: Price-unit derivation pins
        run: npx tsx --test client/src/lib/__tests__/price-unit.test.ts

  confirm-honesty:
    name: confirm-honesty (§13/§18c — transport-confirm-timing · confirmation-code-is-the-server-s · transport-status-self-report-gate · delete-dead-transport-status)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Source pins, no DB and no browser. A-series: the transport book handler stamps NO status —
      # a Checkout Session is an intent to pay, and the promotion belongs to the payment signal,
      # which returns early unless `payment_status === "paid"` (a hosted session can complete
      # UNPAID). B-series: the booking modal renders the SERVER's confirmation code or none, and an
      # absent code is said out loud rather than filled with a plausible string. C-series
      # (2026-09-12-transport-status-self-report-gate, punchlist V-7/V-8): both webhook promotions
      # carry a from-state guard IN the statement, so a late paid signal never resurrects a
      # cancelled booking or option (C6-C8). C9/C10 are 2026-09-12-delete-dead-transport-status:
      # the self-report PATCH had zero callers, so §18c deleted it and the orphaned ungated storage
      # writer with it — C9 asserts neither comes back (file-SET scan, comments stripped), and C10
      # keeps the deliberately-retained requireWriteAccess passthrough (LD 12) exercised. C1-C5
      # pinned the gate's shape and went with their subject.
      - name: Confirm-honesty pins
        run: npx tsx --test server/__tests__/confirm-honesty.test.ts

  # ---------------------------------------------------------------------------
  # 2026-09-14-test-files-wired-orphans — DIRECTORY-WIDE unit suites.
  #
  # These three jobs close the CLASS rather than the instances: every existing
  # per-file job stays exactly where it is (each one is a ledger-named record of
  # why that pin exists), and these run the whole directory so a test added to it
  # tomorrow is reachable by construction instead of by somebody remembering to
  # append a job. The selector is a shell glob the reachability inventory
  # understands (`scripts/check-test-files-wired.cjs`), and `.test.ts*` covers
  # both extensions.
  #
  # STATED NEGATIVE SPACE: the glob is one level deep. A test placed in a NEW
  # subdirectory under one of these roots is orphaned again, and the inventory is
  # what says so.
  # ---------------------------------------------------------------------------
  unit-suite-shared:
    name: unit-suite-shared (shared/__tests__ — whole directory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: shared/__tests__ (all)
        run: npx tsx --test shared/__tests__/*.test.ts*

  unit-suite-client-lib:
    name: unit-suite-client-lib (client/src/lib/__tests__ — whole directory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: client/src/lib/__tests__ (all)
        run: npx tsx --test client/src/lib/__tests__/*.test.ts*

  unit-suite-client-components:
    name: unit-suite-client-components (client component __tests__ — whole directories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # react-dom/server renderToString, no jsdom. tsconfig's `jsx: "preserve"`
      # means the classic React.createElement transform, so these files publish
      # React globally for the render — the shim the armed component tests
      # already use, which keeps the components under test unmodified.
      - name: client/src/components/__tests__ (all)
        run: npx tsx --test client/src/components/__tests__/*.test.ts*
      # Landing hero is an API/client lockstep contract. Keep these exact paths named so
      # neither the server composer nor representative-card proof can disappear behind globs.
      - name: landing-hero-contract (server composer + representative component)
        run: npx tsx --test server/services/__tests__/landing-hero.test.ts client/src/components/__tests__/landing-hero-photo-fallback.test.ts client/src/components/__tests__/landing-hero-representative.test.tsx client/src/hooks/__tests__/use-rotation.test.ts
      - name: client/src/components/plancard/__tests__ (all)
        run: npx tsx --test client/src/components/plancard/__tests__/*.test.ts*

  # ---------------------------------------------------------------------------
  # 2026-09-15-orphans-t1-t3-green-directories — T-1/T-2/T-3 of the orphan plan
  # (docs/lane-reports/2026-09-15-orphan-triage.md §7). Forty suites whose
  # assertions no workflow command could reach are run here.
  #
  # STATED NEGATIVE SPACE, and it is the half that will bite first: A DIRECTORY
  # IN THIS REPO IS NOT ONE RUNNER. Five files under these roots import from
  # `vitest` and `tsx --test` CANNOT LOAD THEM (it dies in @vitest/runner before
  # a single assertion runs), while `vitest` in turn cannot run a `node:test`
  # file. So each mixed directory is covered by TWO steps, one per runner, and
  # the split is by NAME, not by glob — a new file added to such a directory is
  # orphaned until somebody names it, and `scripts/check-test-files-wired.cjs`
  # is what says so. Where a directory has ONE runner (T-1, and
  # server/routes/__tests__) the selector IS a whole-directory glob and the
  # directory is closed by construction.
  #
  # ONE SUITE IN THESE DIRECTORIES IS DELIBERATELY LEFT ORPHANED:
  # `server/services/__tests__/content-matching.test.ts` fetches
  # http://localhost:5000 and needs the built app, which none of these jobs
  # boots. Wiring it here would put a red in a green job; it stays on
  # `scripts/test-orphan-baseline.txt` and is owed an app-backed lane.
  # ---------------------------------------------------------------------------
  unit-suite-server-units:
    name: unit-suite-server-units (server utils · seeds · travelpayouts · trend-engine __tests__ — whole directories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # T-1: four single-purpose directories, each holding ONLY these files, so
      # one glob closes each exactly. No database and no app — these are pure.
      - name: server/utils/__tests__ (all)
        run: npx tsx --test server/utils/__tests__/*.test.ts*
      - name: server/seeds/__tests__ (all)
        run: npx tsx --test server/seeds/__tests__/*.test.ts*
      - name: server/services/travelpayouts/__tests__ (all)
        run: npx tsx --test server/services/travelpayouts/__tests__/*.test.ts*
      - name: server/services/trend-engine/__tests__ (all)
        run: npx tsx --test server/services/trend-engine/__tests__/*.test.ts*

  suite-server-services:
    name: suite-server-services (server/services/__tests__ — DB-backed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      SESSION_SECRET: ci-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
      NODE_ENV: test
      JOURNEY_DB_WRITES_OK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'false'
      # T-2. The directory mixes pure and DB suites, so one database is cheaper
      # than a split; seven of these files were already reachable through their
      # own per-file jobs and are re-run here, which is the 2026-09-14 precedent
      # (a per-file job is a ledger-named record of why that pin exists and stays
      # exactly where it is).
      - name: server/services/__tests__ (node:test suites)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/services/__tests__/activity-schedule.test.ts server/services/__tests__/background-job-runner.test.ts server/services/__tests__/booking-verification.db.test.ts server/services/__tests__/booking-verification.test.ts server/services/__tests__/cancellation-policy.test.ts server/services/__tests__/commission-phase1.test.ts server/services/__tests__/experience-cart-band.db.test.ts server/services/__tests__/expert-split-band.db.test.ts server/services/__tests__/expertise-scoring.test.ts server/services/__tests__/gem-teaser.test.ts server/services/__tests__/golf-presets.test.ts server/services/__tests__/landing-hero.test.ts server/services/__tests__/landing-moments-photo-selection.test.ts server/services/__tests__/location-view-neighbourhood-match.test.ts server/services/__tests__/occasion-schedule.test.ts server/services/__tests__/provider-health.test.ts server/services/__tests__/ready-made-clone-routing.test.ts server/services/__tests__/startup-delay.test.ts server/services/__tests__/trailhead-crosswalk.test.ts server/services/__tests__/trailhead-derived-targets.test.ts server/services/__tests__/transport-leg-calculator.test.ts server/services/__tests__/traveler-profile.service.test.ts server/services/__tests__/upcoming.test.ts server/services/__tests__/upsell-engine.test.ts server/services/__tests__/upsell-query-any-array.test.ts server/services/__tests__/wedding-presets.test.ts
      # The two vitest suites in the same directory. `anchor-*` is their whole
      # set, so this selector IS a glob and cannot silently drop one.
      - name: server/services/__tests__ (vitest suites)
        run: npx vitest run --root . server/services/__tests__/anchor-*.test.ts

  suite-server-routes-migrations:
    name: suite-server-routes-migrations (server/routes/__tests__ + server/migrations/__tests__ — DB-backed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      SESSION_SECRET: ci-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
      NODE_ENV: test
      JOURNEY_DB_WRITES_OK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'false'
      # T-3a. Every file in this directory is a node:test suite, so the selector
      # is the whole-directory glob and a file added tomorrow is reachable by
      # construction. `booking-idor-guard` was the directory's one red and is
      # repaired in this lane — its FIXTURE was, not its assertions: the auth
      # layer's account-status check is FAIL-CLOSED (503) and the mock did not
      # answer the `users` reads it makes.
      - name: server/routes/__tests__ (all)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/routes/__tests__/*.test.ts
      # T-3b. server/migrations/__tests__ holds three vitest suites beside
      # chain-integrity.test.ts, which is a node:test file already run by the
      # migration-chain-integrity job. Named, not globbed, for the reason in the
      # block comment above.
      # These three run in PARALLEL vitest workers and each one's first genuine
      # insertPlatformRevenueOnce rolled TODAY's daily_revenue_summary row up
      # through a check-then-insert — the §15 race that turned this job red
      # (`daily_revenue_summary_date_unique`). The writer is now one atomic
      # upsert and the fourth file is its deterministic concurrent proof, run
      # in the same parallel shape (ledger `2026-09-16-ci-main-red-repairs`,
      # punchlist V-34).
      - name: server/migrations/__tests__ (vitest suites)
        run: npx vitest run --root . server/migrations/__tests__/1577-cart-booking-revenue-dedup.test.ts server/migrations/__tests__/244-platform-revenue-payment-intent-dedup.test.ts server/migrations/__tests__/ready-made-purchase-revenue-dedup.test.ts server/migrations/__tests__/daily-revenue-summary-upsert.test.ts

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # 2026-09-15-orphans-t4-t7-red-suites — T-4/T-5/T-6 of the orphan plan
  # (docs/lane-reports/2026-09-15-orphan-triage.md §7) first landed HERE as
  # `suite-mutation-auth` and `suite-ai-draft-and-availability`. Both boot the
  # BUILT production bundle against a throwaway Postgres, which needs
  # ALLOW_TEST_ACCOUNTS=1 — and `scripts/check-env-allowlist.cjs` (c) forbids
  # that token in ANY form in a workflow FILE that also carries a deploy signal,
  # which build.yml does (`artifact-deploy-guard`). Ledger
  # `2026-09-16-ci-main-red-repairs` moved them, key and name unchanged, to
  # `.github/workflows/suite-mutation-auth.yml` and
  # `.github/workflows/suite-ai-draft-and-availability.yml`, beside every other
  # server-booting gate. DO NOT ADD A SERVER-BOOTING JOB TO THIS FILE: a job that
  # needs the flag gets its own workflow file (see the header comment in either).
  # ---------------------------------------------------------------------------
  # suite-server-tests (server/__tests__ as a class, T-8/T-9) lives in
  # .github/workflows/suite-server-tests.yml: it boots the production bundle with
  # ALLOW_TEST_ACCOUNTS=1, which `scripts/check-env-allowlist.cjs` (c) forbids in this
  # deploy-targeting file (ledger 2026-09-16-ci-main-red-repairs). Do not move it back.

  # ---------------------------------------------------------------------------
  # guard-batch — 2026-09-21-ci-latency-cancel-and-workers
  #
  # These 24 guards need neither `npm ci` nor postgres and run in EIGHT SECONDS
  # TOTAL when timed serially. As 24 separate jobs they held 24 runner slots for
  # 8 seconds of work, and that queueing — not the guards — was a measurable part
  # of every PR's wall clock (jobs queued at 10:47:18 on #1026 were still queued
  # at 10:53).
  #
  # EACH GUARD KEEPS ITS OWN NAMED STEP, so the GitHub UI still says WHICH guard
  # failed and each one's documented negative space travels with it (§18d). What
  # was traded is 24 CHECK names for 1; the guard names themselves are not lost.
  #
  # `if: ${{ !cancelled() }}` on every guard step means one failure does not hide
  # the next twenty-three — all of them run and the job reports every failure at
  # once — while a run cancelled by cancel-in-progress still stops immediately.
  #
  # THE THREE REQUIRED GUARDS ARE DELIBERATELY NOT HERE. test-file-reachability,
  # money-endpoint-guard and claims-only-lookup-guard are branch-protection
