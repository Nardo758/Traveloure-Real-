      # read at the CHARGE point only, so a pass holder outside the 24h free-rerun window was told
      # the run was included and then got a `pending_payment` comparison with no variants — no
      # error, no log, and a page that looks exactly like ordinary "payment required". P1-P13 pin
      # the ONE run-authorization predicate (a pass authorizes the RUN; a pass on a DIFFERENT trip
      # authorizes nothing; no pass + outside the window + no PaymentIntent is still refused; a
      # covered run neither verifies nor spends a PI; an empty-string id is ABSENT). A1-A7 read the
      # shipped `server/routes.ts`, because a predicate a call site can reach past is not a rule:
      # exactly two call sites, one caller of `verifyOptimizationPayment`, one `coversAction`
      # wiring, the §15 atomic PI claim still at the route, no second copy of the free-rerun clock,
      # and no basis sentinel written into the payment-identity column.
      - name: Optimizer run-authorization pin (LD 41 lane 1)
        run: npx tsx --test server/__tests__/optimizer-run-authorization.test.ts
      # 2026-09-05-optimize-preview-on-slip (CLAUDE.md Locked Decision 41 (d)): the free heuristic
      # is now shown BEFORE the traveler pays, and the failure that would follow is a copy edit
      # promising a delta the heuristic cannot measure — it reads what each item IS, never where it
      # is, so it has no distance, no travel time and no measured saving to offer. P1-P8/E1-E3 pin
      # the extracted scoring (deterministic fixtures; an empty and a single-item plan REFUSED with
      # the heuristic's own reason rather than scored; the three legacy cart extrapolations kept
      # byte-identical but reachable only through their own named function). S1-S7 read the shipped
      # files, because ONE heuristic with two callers is exactly the kind of thing a later refactor
      # forks silently: no metrics call left in the routes file, both entries on the shared
      # function, the trip entry reading `loadTripOptimizerInputs` with the actor from the SESSION
      # and no item list off the wire, no Stripe/fee anywhere in the preview handler, and the slip
      # rendering neither extrapolated number. L1-L7/F1-F5 hold the traveler-facing strings.
      - name: Optimize-preview heuristic + slip line pin
        run: |
          npx tsx --test server/__tests__/optimize-preview-on-slip.test.ts
          npx tsx --test client/src/lib/__tests__/optimize-preview-line.test.ts
      # 2026-09-05-build-id-and-map-fallback: two post-publish QA defects whose whole failure mode
      # is that they RENDER FINE. B1-B9/S1 pin the build-identity resolver — the ordered sources,
      # and above all §13's all-miss answer (`commit: null`, `source: "unknown"`), because the way
      # a build id fails is a PLAUSIBLE WRONG ANSWER (a stale env var, a leftover build-info.json,
      # a short sha compared against a full $GITHUB_SHA) that a deploy check then believes. S1
      # reads the shipped wiring: ONE resolver behind both /api/version and /api/health, the
      # legacy `sha` key its two consumers parse, and the build script writing the file AFTER the
      # bundle. C1-C5/S1-S5 pin the map's honesty boundary — the centre resolver returns NULL when
      # nothing real names a place, both files are swept for coordinate literals, no fake marker
      # coordinate is computed without a centre, and the "N providers" chip that flipped 8 -> 0 on
      # a dismissed destination modal can no longer render a searched-and-found-none zero.
      - name: Build identity + map city-centre fallback pin
        run: |
          npx tsx --test server/__tests__/build-info.test.ts
          npx tsx --test client/src/lib/__tests__/map-no-city-center-fallback.test.ts

      # LD 41 lane 2 (ledger 2026-09-05-draft-only-on-empty + 2026-09-05-draft-cost-tracking-and-tier):
      # the free AI draft runs only on an EMPTY slip, its JSON recovery never repairs a truncated
      # response into a plan the model did not produce, and the client reads the refusal through
      # ONE module. All three are pure — no DATABASE_URL, no server, no network.
      - name: AI draft eligibility + parser + client-refusal pins (LD 41 lane 2)
        run: |
          npx tsx --test server/__tests__/ai-draft-eligibility.test.ts
          npx tsx --test server/__tests__/ai-json-parse.test.ts
          npx tsx --test client/src/lib/__tests__/ai-draft-refusal.test.ts
      # 2026-09-05-mint-market-slug-invariant (CLAUDE.md Locked Decision 42, D12 + D11-interim):
      # `market_slug` joins `timezone` as a named MINT invariant, and the intake panels stop
      # fabricating a party split. Both defects are ABSENCES that render perfectly — a plan minted
      # with a NULL market_slug looks right to its owner and is simply never seen by any
      # market-scoped reader, and `adults: travelers, kids: 0` is a well-formed answer to a question
      # neither panel asks. M1-M3 pin the two raw-SQL mints in booking.service.ts (column named,
      # derived value bound, ONE shared resolveMarketSlug, placeholder destinations NOT
      # special-cased into a hardcoded slug). M4 is the load-bearing one: it re-scans EVERY
      # trip-insert site in server/, holds Locked Decision 30's timezone stamp on all of them, and
      # pins the set that still omits market_slug to a RECORDED outstanding list — now the e2e seed
      # alone, since D12 binds EVERY production mint (the buyer's clone and BOTH expert authoring
      # builds included: a NULL userId exempts them from an owner row and the pen drain, never from
      # a market). A NEW omission fails here instead of being absorbed. I1-I3 pin
      # the stripped split and that the stated TOTAL still rides (the server derives the total from
      # `adults` only when the body omitted it, so nothing real was dropped).
      - name: Mint market_slug invariant / party-split pin
        run: npx tsx --test server/__tests__/mint-market-slug-invariant.test.ts
      # Build-order row 1.7 (ledger `2026-09-05-dead-surfaces-and-cart-qty`): three client
      # surfaces and one server field were deleted for having no consumer, and the cart's
      # quantity control gained a typed box. Both halves fail silently — a deleted-because-
      # unimported page comes back the day someone copies a sibling and nothing breaks, and a
      # typed box that grows its own local state or its own PATCH still WORKS, it just stops
      # agreeing with the buttons beside it. Q1-Q6 pin the one shared normaliser (floor 1, no
      # zero, the STORAGE ceiling rather than an invented cap, empty-is-a-draft that reverts on
      # commit); S1-S5 read the shipped files, because absence is the assertion.
      - name: Dead-surface absence + typed cart quantity pin
        run: npx tsx --test client/src/lib/__tests__/cart-quantity.test.ts
      # 2026-09-05-payment-method-posture / 2026-09-05-wallets-on-platform-intents (CLAUDE.md
      # Locked Decision 43): every PLATFORM PaymentIntent offers wallets (Apple Pay / Google Pay /
      # Link) through `automatic_payment_methods`. The regression this guards is SILENT — a site
      # that goes back to `payment_method_types: ['card']`, or a new charge path written card-only,
      # simply renders one fewer button and reports nothing anywhere. C1-C4 are a CENSUS over every
      # `paymentIntents.create` under server/: each one offers automatic methods or is on a PRINTED
      # exemption list with its reason (printed on every run, so an exemption cannot become a silent
      # baseline — the §18d posture), none pins payment_method_types, and each carries
      # allow_redirects:"never" because every sheet here confirms with `redirect: 'if_required'`
      # against a single return_url that is wrong for most of these flows. A1-A7 pin the shipped
      # artifacts, INCLUDING that this lane moved no idempotency key (§15) and no amount (§14), and
      # that the one exemption (the off-session confirm against a named saved card, which Stripe
      # will not accept automatic methods alongside) still looks the way its reason claims.
      - name: Payment-method posture — wallets on every platform intent (LD 43)
        run: npx tsx --test server/__tests__/payment-method-posture.test.ts
      # The other half of LD 43, client-side. P1-P6 pin the ONE prompt predicate, whose interesting
      # states are the two ways of having NO ANSWER — the vault read still in flight, and the read
      # DEGRADED (`available:false`, which /api/me/payment-methods returns instead of a 500) — both
      # of which report `methods: []` for a reason that is not "this traveler has no card" (§13).
      # D1-D4 pin per-scope dismissal over a localStorage that is allowed to be absent or to throw.
      # A1-A9 pin the shipped artifacts: one add-card rail (the existing AddCardDialog, no second
      # SetupIntent path), no amount stated, exactly the TWO mounts the ruling names, the Finalize
      # mount gated on bookable rows and on the owner, no client-side wallet suppression in either
      # Payment Element sheet — and LD 43(a), which is a CONVERSION decision no runtime assertion
      # can hold: no auth-shaped surface imports a payment rail at all.
      - name: Save-payment prompt + no-payment-at-signup pin (LD 43)
        run: npx tsx --test client/src/lib/__tests__/save-payment-prompt.test.ts
      # MONEY_MAP F-5 goes LIVE (ledger `2026-09-05-affiliate-subid-live`). Affiliate attribution is
      # per REQUEST: the outbound partner link for an `affiliate_booking_requests` row carries that
      # row's id in the partner's OWN attribution parameter, through ONE builder. B1-B6 pin the
      # builder — including the two §13 rules a plausible implementation gets wrong: a partner with
      # no sub_id concept gets the URL back BYTE-IDENTICAL (never a fabricated parameter) and the
      # return shape says so, and the builder never throws over an attribution nicety. R1-R4 pin the
      # round trip through `parseAttributionSubId` and the matcher's two decisions — an unparseable
      # sub_id yields a NULL token, is reported verbatim and stays UNMATCHED, because the only rows
      # this pass exists for carry a 0.00 the fuzzy pass rejects. S1-S5 pin §16 (the URL leaves only
      # as a Location header on a 302; both list readers and the PATCH strip it) and that this lane
      # decides no amount, rate or payout at all.
      - name: Affiliate sub_id attribution pin (MONEY_MAP F-5 live)
        run: npx tsx --test server/__tests__/affiliate-subid-attribution.test.ts

