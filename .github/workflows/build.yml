      # an explicit allowlist in the script. Node built-ins only — no npm ci needed. Predicate
      # fixtures FIRST (§18d).
      - name: Duplicate-migration-prefix guard predicate self-test
        run: node scripts/check-duplicate-migration-prefixes.cjs --self-test
      - name: Duplicate-migration-prefix guard
        run: node scripts/check-duplicate-migration-prefixes.cjs
      # Ledger `2026-09-06-publish-preflight`. Lodged in THIS job because it is the other
      # publish-hygiene guard that needs no `npm ci`, no DB and no build — the preflight is Node
      # built-ins only, and it prints the migration registry's last entry, which is this job's
      # subject matter. CI runs the SELF-TEST (the predicate, over committed fixtures) and then the
      # script's ADVISORY path: CI checks out a detached HEAD at a PR head, so every one of the
      # four publish conditions is legitimately false here and enforcing would fail every PR. The
