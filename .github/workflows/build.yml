      # The suite existed since ruling 40 and had NO CI job of its own; it does now, which is the
      # difference between a guard and a script somebody once ran (DECISIONS.md tag rule).
      # N24 (ledger 2026-09-12-readymade-recovery-path) adds the RECOVERY half of the ready-made
      # rail: the payment_intent.succeeded webhook now drives the SAME fulfilment the buyer's own
      # confirm drives, so a closed tab between capture and confirm no longer loses the purchase.
      # It proves the four exactly-once facts (row, clone, author earning, platform-revenue row)
      # and the refusals — a client-supplied PaymentIntent fulfils nothing, an unresolvable one
      # creates nothing, a partial capture creates nothing. The JOB is unchanged and still only
      # detects (§17), which N23's cases above continue to assert.
      # N25 (ledger 2026-09-12-readymade-earning-retry, punchlist V-3c) adds the half AFTER the
      # purchase row: a fulfilment interrupted between the atomic `paid → cloned` claim and the
      # author-credit INSERT left a DELIVERED purchase with no earning and no retry, because
      # every later fulfil returned at `status === 'cloned'`. Migration 294's PARTIAL unique
      # index makes the credit safe to retry and the fulfilment now ENSURES the money leg
      # (§15c's "money leg only"); the CLONE stays strictly once-only. N25a fails on the
      # pre-fix code, and N25c proves the partial predicate leaves the five other earnings
      # rails free to repeat a reference_id.
