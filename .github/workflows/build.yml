name: Build Smoke

# Closes the gate hole that let a syntax error reach main looking clean:
# the logic gate tests an isolated module and the e2e never had a green run, so
# nothing actually built or booted the app. This runs the real production build
# (vite client + esbuild server bundle via `npm run build`), which FAILS on
# syntax / bundling errors but does NOT type-check — so it tolerates the
# pre-existing baseline type errors (a `tsc --noEmit`-clean gate is impossible
# against that baseline). Catches the dropped-sort-block class of bug.
#
# The type-error BASELINE is gated separately below (`tsc-baseline`): 197 as of
# 2026-08-05 @ ea0bbc05, and the number only ever moves DOWN.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build (vite + esbuild bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Production build (syntax/bundle gate — does NOT run tsc)
        run: npm run build

      # ── tsc baseline ratchet ──────────────────────────────────────────────────
      # The repo is NOT tsc-clean, so the gate is a CEILING, not zero. THE NUMBER
      # ONLY EVER MOVES DOWN: a lane that removes errors lowers TSC_BASELINE in the
      # same PR so the improvement is locked in and cannot be spent as headroom by
      # the next lane. Coming in UNDER the ceiling therefore fails too — with the
      # instruction to lower it here.
      #
      # 194 measured on 2026-08-07 (fix waves 1-2 removed three errors; was 197
      # @ ea0bbc05, 199 before PR #430). Before this step existed the discipline
      # had no machine enforcement at all — every "baseline" in the repo was a
      # stale prose number (191/209/254/~137, none of them current).
      # 183 measured 2026-08-10 on PR #451 (down from 190) — the ratchet fired
      # exactly as designed: this lane's work removed 7 errors and the gate
      # refused to let the headroom survive. Locked in here, same PR.
      # 170 measured 2026-08-12 — POST-RECONCILIATION baseline (ledger 80): merging
      # the replit line into main net-removed 13 errors (their storage/routes/schema
      # edits replaced error-bearing code); the scheduler-unification / merge changes
      # introduced ZERO new type errors (none in any touched file). Locked in here.
      # 164 measured 2026-08-17 on lane/partner-demand-data (2A.3 party-size de-masking):
      # dropping the fabricated numberOfTravelers/adults defaults net-removed 4 errors
      # (the default-related type narrowings on the trip-creation path); ZERO new type
      # errors in any touched file. Ratchet fired as designed — locked in here, same PR.
      # 157 measured 2026-08-21 after the Distribution parity pass; ZERO new type
      # errors in the touched server/client paths. Locked in here, same PR.
      # 156 measured 2026-08-25 while landing the Ready-Made completeness gate.
      # The ratchet detected the reduction and requires it to be locked in.
      # 136 measured 2026-09-04 (ledger `2026-09-04-contract-stats-column`): fixing
      # getContractStats to read `contractStatus` — the column that actually exists on
      # vendor_contracts — removed the two TS2339 `Property 'status' does not exist`
      # errors that had been sitting inside this baseline since it was first taken.
      # Note the shape of that: the compiler KNEW the dashboard's "N active" tile could
      # never be right, and a ceiling that only forbids the number going UP is why the
      # two errors could live here indefinitely. Locked in, same PR.
      # 133 measured 2026-09-05 (analytics-events rescue): the trackEvent refactor widened
      # sendAnalyticsEvent's parameter from `Record<string, unknown>` to `object`, which cleared
      # the three TS2345 errors its own three callers had been contributing to this baseline
      # (trackSearchEvent / trackItineraryGenerated / trackBookingEvent — an interface with
      # optional members is not assignable to an index-signature type). The ratchet detected the
      # reduction and requires it to be locked in. Locked in, same PR.
      - name: tsc baseline ratchet (down-only)
        env:
          TSC_BASELINE: '133'
        run: |
          count=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "tsc --noEmit: $count error(s); baseline ceiling: $TSC_BASELINE"
          if [ "$count" -gt "$TSC_BASELINE" ]; then
            echo "::error::tsc errors went UP: $count > baseline $TSC_BASELINE. Fix the net-new type errors in this change."
            npx tsc --noEmit 2>&1 | grep "error TS" | head -40
            exit 1
          fi
          if [ "$count" -lt "$TSC_BASELINE" ]; then
            echo "::error::tsc errors went DOWN to $count (baseline $TSC_BASELINE) — good! Now LOCK IT IN: set TSC_BASELINE to $count in .github/workflows/build.yml in this same PR. The baseline only ever moves down; leftover headroom is how it creeps back up."
            exit 1
          fi
          echo "tsc baseline holds at $count ✅"

  money-endpoint-guard:
    name: money-endpoint-guard (CLAUDE.md §14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Operation-scoped guard: fails if a money-operation handler (or a money-named file) sources
      # amount/price/userId from req.body. Node built-ins only — no npm ci needed. See §14.
      # Predicate fixtures FIRST (ruling 42/43): a guard with a wrong predicate passes truthfully,
      # so the predicate itself is proven before its verdict is trusted.
      - name: Money-guard predicate self-test
        run: node scripts/check-money-endpoints.cjs --self-test
      - name: Client-trusted amount/identity/rate guard
        run: node scripts/check-money-endpoints.cjs

  item-removed-logging-guard:
    name: item-removed-logging-guard (R15 removal-signal coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if an itinerary_items hard-delete path lacks an item-removed:<kind> annotation, or a
      # `logged` site has no same-transaction `item_removed` write. Node built-ins only — no npm ci
      # needed. See ledger 2026-08-17-partner-demand-r15-transition-log. Predicate fixtures FIRST
      # (§18d): a guard with a wrong predicate passes truthfully.
      - name: Item-removed guard predicate self-test
        run: node scripts/check-item-removed-logging.cjs --self-test
      - name: Item-removed logging coverage guard
        run: node scripts/check-item-removed-logging.cjs

  itinerary-rebuild-guard:
    name: itinerary-rebuild-guard (D-1 rebuild-delete money-safety coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a trip-scoped itinerary_items rebuild-delete lacks `itineraryItemRebuildDeletable()`
      # and no `// rebuild-guard-exempt:<reason>`. Closes the D-1 class (origin is never a money guard;
      # a rebuild delete keys on routing_status + booking presence). Node built-ins only — no npm ci.
      # See ledger 2026-08-31-rebuild-delete-money-guard. Predicate fixtures FIRST (§18d).
      - name: Rebuild-guard predicate self-test
        run: node scripts/check-itinerary-rebuild-guard.cjs --self-test
      - name: Itinerary rebuild-delete coverage guard
        run: node scripts/check-itinerary-rebuild-guard.cjs

  traveler-fee-coverage:
    name: traveler-fee-coverage (ruling 2026-09-02 — every charge path bills + ledgers the fee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a known traveler-charging path stops resolving the fee via resolveTravelerServiceFee
      # or stops writing it to fee_ledger via a shared writer. Node built-ins only — no npm ci.
      # See ruling 2026-09-02-traveler-fee-applies-everywhere. Predicate fixtures FIRST (§18d).
      - name: Traveler-fee coverage predicate self-test
        run: node scripts/check-traveler-fee-coverage.cjs --self-test
      - name: Traveler-fee coverage gate
        run: node scripts/check-traveler-fee-coverage.cjs

  claims-only-lookup-guard:
    name: claims-only-lookup-guard (session-user extraction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a server/ file reads a session user id via claims.sub without an `.id`
      # fallback (or the shared getUserId helper). Email-login sessions only carry
      # claims.sub; OAuth sessions may only carry .id — a claims-only read causes false
      # 403s (~120 routes were fixed for this once). Node built-ins only — no npm ci needed.
      - name: Guard self-tests (fixture cases)
        run: node scripts/check-claims-only-user-lookups.cjs --self-test
      - name: Claims-only session-user lookup guard
        run: node scripts/check-claims-only-user-lookups.cjs

  unmounted-router-guard:
    name: unmounted-router-guard (CLAUDE.md §9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a server/routes/*.ts router is imported into routes.ts but never app.use()d
      # (dead → 200-HTML). Node built-ins only — no npm ci needed. See §9.
      - name: Unmounted-router guard
        run: node scripts/check-unmounted-routers.cjs

  trip-mint-owner-guard:
    name: trip-mint-owner-guard (CLAUDE.md §13 L10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if a trips-INSERT site doesn't mint the owner's trip_collaborators row (or carry a
      # trip-mint-owner-ok annotation for deliberate NULL-owner authoring builds). getTripRole
      # resolves access by assignment only, so an owner-less mint locks the owner out of their own
      # trip. Node built-ins only — no npm ci needed. See §13 L10.
      - name: Trip-mint owner-access guard
        run: node scripts/check-trip-mint-owner-access.cjs

  fee-literal-guard:
    name: fee-literal-guard (phase2-fee-gate — DECISIONS.md ruling 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Grep gate: no optimize/coordination fee literals in LOGIC code (fee_bands seed /
      # migrations / config rows excluded; `// fee-literal-ok: <reason>` exempts a line).
      # Predicate fixtures FIRST (ruling 42/43) — this gate was blind to every SCREAMING_SNAKE fee
      # constant for its whole life while reporting PASS.
      - name: Fee-gate predicate self-test
        run: bash scripts/phase2-fee-gate.sh --self-test
      - name: Fee-literal grep (scripts/phase2-fee-gate.sh)
        run: bash scripts/phase2-fee-gate.sh

  migration-chain-integrity:
    name: migration-chain-integrity (DECISIONS.md rulings 19, 27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Ruling 19: migration numbering re-verified at merge — the chain-integrity test is arbiter.
      - name: chain-integrity test
        run: npx tsx --test server/migrations/__tests__/chain-integrity.test.ts

  walkthrough-pins:
    name: walkthrough-pins (EX-1 logout endpoint + EX-2 price floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Pure-unit pins from docs/testing/EXPERT_UX_WALKTHROUGH.md — no DB, no browser.
      # EX-1: no client file may navigate to the Replit-only GET /api/logout (session survived
      # the click off-Replit); the shared logout must POST /api/auth/logout.
      - name: EX-1 logout endpoint pin
        run: npx tsx --test client/src/lib/__tests__/logout-endpoint-pin.test.ts
      # EX-2: insertProviderServiceSchema rejects negative/non-numeric prices on the create AND
      # .partial() (PATCH) shapes; zero stays parseable (draft state — publish gate is route-level).
      - name: EX-2 service price-floor pin
        run: npx tsx --test server/__tests__/service-price-floor.test.ts
      # Ready-Made listings must pass the same completeness gate at submit and approval.
      - name: Ready-Made completeness gate
        run: npx tsx --test server/routes/__tests__/ready-made-completeness-gate.test.ts
      # Thin gem detail (2026-08-29-replit-gem-audit ruling 3): the discover teaser
      # ships EXACTLY the ruled key set — address / popularity ratios / mainstream
      # forecast / discovery status stay removed, attribution ships only resolved.
      - name: Gem teaser projection gate
        run: npx tsx --test server/services/__tests__/gem-teaser.test.ts
      # F-1: trip DATE columns reach the client as "YYYY-MM-DD"; `new Date()` reads those as
      # UTC midnight, so a viewer west of UTC rendered the PREVIOUS day. The pin only reproduces
      # west of UTC, so it runs under three timezones — a UTC-only run would pass on the bug.
      - name: F-1 trip-date local-parse pin (3 timezones)
        run: |
          for tz in America/New_York Asia/Tokyo UTC; do
            echo "--- TZ=$tz ---"
            TZ="$tz" npx tsx --test client/src/lib/__tests__/trip-date-local-parse.test.ts
          done
      # QA F3: the SAME date-only defect on the Guest Invites caption — `user_experiences.event_date`
      # is a DATE column, so `new Date("2026-10-10")` showed every viewer west of UTC the 9th, a
      # day that can fall outside the plan's own range. Three timezones for the same reason.
      - name: QA F3 guest-invite caption local-parse pin (3 timezones)
        run: |
          for tz in America/New_York Asia/Tokyo UTC; do
            echo "--- TZ=$tz ---"
            TZ="$tz" npx tsx --test client/src/lib/__tests__/guest-invite-meta.test.ts
          done
      # QA F13: the SAME date-only class one boundary further out. The occasion workstation holds
      # its dates as the UTC-midnight instants `new Date("YYYY-MM-DD")` produces and handed the
      # hero card `date.toISOString()` — an INSTANT, which `parseTripDate` is right to read as one
      # — so the card said "13 Nov-15 Nov" for a plan stored Nov 14-16 while the Trip Strip beside
      # it said "Nov 14 -> Nov 16". Three timezones for the same reason as F-1/F3.
      - name: QA F13 hero-card date-range local-parse pin (3 timezones)
        run: |
          for tz in America/New_York Asia/Tokyo UTC; do
            echo "--- TZ=$tz ---"
            TZ="$tz" npx tsx --test client/src/lib/__tests__/hero-card-date-range.test.ts
          done
      # QA F10: the Experiences dropdown shipped a footer leaf whose i18nKey no locale file
      # carried, so production rendered the literal "browseAllOccasions". The parity spec diffs
      # the locales against EACH OTHER and was correctly green — a key missing from en AND ja is
      # at perfect parity. This pin asks the other question: does every key nav-config DECLARES
      # exist in every locale on disk.
      - name: Nav i18n key pin
        run: npx tsx --test client/src/lib/__tests__/nav-i18n-keys.test.ts
      # F-2: ONE trip-target resolver for the /services grid and the service-detail page — the
      # "?tripId= first, then TripContext, else none" order, plus the detail href that carries the
      # handoff forward. A second copy of that order is how the two surfaces drifted apart.
      - name: Trip-target resolver pin
        run: npx tsx --test client/src/lib/__tests__/trip-target.test.ts
      # 2026-09-03-slip-convergence: the strip's coral eyebrow already says "Your Trip" at >=sm,
      # so the travel-class lead ("Your trip") printed the same words twice. The pin asserts the
      # eyebrow SURVIVES (it is a ratified coral touch), the lead is suppressed only at that
      # breakpoint, and the composed event/couple/invite leads are untouched.
      - name: Trip-strip lead-duplication pin
        run: npx tsx --test client/src/components/__tests__/trip-strip-lead.test.tsx
      # 2026-09-03-switch-readers: migration 276's six occasion switches are nullable with NO DB
      # CHECK, so every reader meets three states and the third — NULL = NOT SET — is the one §13
      # governs. This pins that each reader falls back to the plain-plan shape in the SAFE
      # direction, that default_guests:false beats the vocabulary column, and that the reverse
      # event-type lookup returns a row only on a UNIQUE match instead of guessing.
      # 2026-09-05-slip-switch-reads-events-first (Locked Decision 42 D1) adds R7/R7b/A1-A5: the
      # event-type lookup is many-to-one, so most occasions were unresolvable from a trip and their
      # slips silently wore the plain-trip shape. The plan's own events name the occasion by ID, so
      # resolution tries that FIRST — and R7 pins the refusals that keep it exact (disagreement, a
      # missing id, an unmatched id and no events all fall THROUGH, never to a majority or a
      # nearest), while A1-A5 pin the wiring, because a slip reading `trips.event_type` for a shape
      # decision is the defect itself.
      - name: Occasion switch readers pin
        run: npx tsx --test client/src/lib/__tests__/occasion-switch-readers.test.ts
      # 2026-09-04-location-mismatch: the add-to-plan confirm is an HONESTY surface — it measures
      # nothing and must never overclaim. This pins the negatives that are the whole point: the
      # "Unknown" sentinel and every empty spelling produce NO alert, a missing comparison target
      # is silence, a ", Country" suffix still matches, "York" never matches "New York", and a
      # shared trailing "Japan" never silences an Osaka-vs-Kyoto mismatch.
      - name: Location mismatch reader pin
        run: npx tsx --test client/src/lib/__tests__/location-mismatch.test.ts
      # 2026-09-04-roles-needed: `experience_types.roles_needed` carries no DB CHECK (publish-trap
      # posture), so R1-R6 are where "app-enforced" stops being a claim. R3 in particular pins the
      # OCCASION_ROLE_KEYS mirror to migration 034 itself, so a category renamed there without
      # updating the enum fails HERE rather than at a traveler's screen.
      - name: Occasion roles-needed pin
        run: npx tsx --test shared/__tests__/roles-needed.test.ts
      # 2026-09-04-event-order: `which-event.ts` rule 5 puts ordering in the SERVER's hands so a
      # plan's events have ONE order rather than one per surface — which is only true if the server
      # has one answer. It did not: the slip's DTO was chronological while /api/user-experiences was
      # created_at DESC. O1-O3 pin both readers to the same ORDER BY, and pin that the client has
      # not quietly become a second authority by sorting.
      - name: Plan event ordering pin
        run: npx tsx --test server/__tests__/user-experience-order.test.ts
      # 2026-09-04-event-time-ui: step 5 shows the plan's day and place as DEFAULTS. A shown default
      # and a chosen value render identically, so E1 pins that an untouched row carries neither, and
      # E7 pins the ONE place the plan's values are inherited (create, not the pen). P5 pins the same
      # rule on the drain side, including that the TIME has no fallback — NULL is not midnight.
      - name: Step-5 event rows pin
        run: npx tsx --test client/src/lib/__tests__/plan-events.test.ts
      - name: Pre-trip event pen pin
        run: npx tsx --test server/__tests__/pending-events.test.ts
      # Same ledger: `which-event.ts` rule 4 moved from "no clock time, ever" to "only from
      # start_time". W7 is the rewritten negative — a timestamp in the DATE column, a NULL and a
      # malformed value all still render NO clock — and G7 holds the same line one surface over, on
      # the ONE shared derivation both read.
      - name: Event clock-source pin
        run: |
          npx tsx --test client/src/lib/__tests__/which-event.test.ts
          npx tsx --test client/src/lib/__tests__/slip-events.test.ts
      # 2026-09-04-wedding-landing-moment: the "Planning your own?" callout names "Plan this
      # moment", the CTA on the card above it, so it is only true INSIDE MomentsSection. C2/C3 pin
      # that it cannot appear in the empty-state fallback (the rail), and C4 pins that it did not
      # become a second planning opener beside the one the section already has.
      - name: Moments planning-callout pin
        run: npx tsx --test client/src/components/__tests__/moments-callout.test.tsx
      # 2026-09-04-guests-per-event: an invite belongs to ONE event and a plan holds many, so the
      # plan's roster is DERIVED — one row per person, one column per event. R1-R6 pin the rules a
      # plausible-looking implementation gets wrong: dedupe by normalised email only (no name
      # matching, refused by ruling), an email-less guest never merged, column order left to the
      # server's one ordering authority, not_invited kept distinct from pending, dietary notes
      # unioned rather than silently picked, and `countries` omitted rather than shown as 0.
      - name: Plan guest roster derivation pin
        run: npx tsx --test server/__tests__/plan-guest-roster.test.ts
      # 2026-09-04-step4-variants-fields (migration 284): step 4 asks a SECOND question and the
      # occasion's own switches choose it. Three things fail silently here and are therefore pinned:
      # the admission schemas (no DB CHECK behind these columns, so zod IS the only guard — T1 email,
      # T2/T3 null-vs-absent, T4 blank⇒null, T6 the allowlist strip, T8 the mint body cannot carry
      # them); the two visibility predicates plus the home-city suggestion (V1-V3, where a wrong
      # answer still renders a step); and the golf preset table, the only thing standing between the
      # ratified board and what a traveler can tick (G1-G5, incl. the sixth chip).
      - name: Step-4 variant fields + predicates + golf presets pin
        run: |
          npx tsx --test shared/__tests__/trip-party-fields.test.ts
          npx tsx --test client/src/lib/__tests__/plan-steps.test.ts
          npx tsx --test server/services/__tests__/golf-presets.test.ts
      # Post-publish QA check 4 (Locked Decision 38's home-city default). Two failures that are
      # INVISIBLE at the moment they happen and only show up as a plan coming back from the dead:
      # "Clear plan" left the server row, an armed debounced push, an in-flight hydrate and every
      # per-slug `searchSettings_<slug>` mirror still holding the plan (C1-C5, clear-plan), and
      # step 2's home-city default asked its question of the INPUT FIELD rather than of the plan,
      # so a cleared plan's leftover city read as an answer and the default never fired (Q1,
      # plan-steps, which the step above already runs).
      - name: Clear-plan durability pin
        run: npx tsx --test client/src/lib/__tests__/clear-plan.test.ts
      # Step 4's centre is now a TYPED input as well as a stepper (decision-maker request), so one
      # normaliser serves two controls on one state (§18 rule 1). P6a-P6e pin the invariants a
      # free-text field is the obvious way to break: empty stays empty (Locked Decision 33's
      # "untouched ⇒ NULL, never 2"), a typed 0 is NOT SET rather than a stated none (§13), digits
      # survive a paste, and the clamp is the stepper's own MAX_PARTY_COUNT.
      - name: Typed party count pin
        run: npx tsx --test client/src/lib/__tests__/plan-vocabulary.test.ts
      # 2026-09-04-plan-islands: three surfaces that connect machinery the plan's own page could
      # not reach. T1/T2 pin that the TRAVELING-PARTY body carries no money column and that a
      # blank field CLEARS rather than being dropped; O1-O4 pin the one-time "Organize into
      # events" gate (a NULL default_schedule is NOT a schedule, an uncountable event list is not
      # an empty one) and its idempotence by title; C1-C8 pin that the contract board passes
      # server amounts through untouched, omits a NULL balance rather than showing 0, and reads
      # overdue from the SERVER's answer rather than a browser clock.
      - name: Plan islands pin
        run: npx tsx --test client/src/lib/__tests__/plan-islands.test.ts
      # Same ledger: the participant CREATE rail was a DENYLIST (`.omit({ userId: true })`) and is
      # now the pick-based sibling of the PATCH allowlist, DERIVED from it so a field cannot move
      # lanes on one rail only (§19, §18 rule 1). G3/G3b assert over the real artifacts.
      - name: Participant write-rail allowlist pin
        run: npx tsx --test server/__tests__/participant-write-rail.test.ts
      # 2026-09-04-event-budget: the EVENT is the budget unit and the plan's total is DERIVED, so
      # B2 pins the omission that is the whole ruling — no event stating a budget renders NO line,
      # never "$0" — and B4 pins that a blank string is not coerced to zero (Number("") is 0, which
      # is exactly how "left blank" becomes "said zero"). B5 pins the deliberate choice NOT to
      # filter a stored negative, so the total can never disagree with the "across N events" beside
      # it. G1-G6 pin the admission shape on the SHARED pick: `createInsertSchema` derives
      # `z.string()` for a `decimal`, so that rail took "abc" and refused a number until this lane.
      # The start-time file is committed by #765 and ran in NO workflow — this arms it too.
      - name: Event budget pin
        run: |
          npx tsx --test client/src/lib/__tests__/plan-budget.test.ts
          npx tsx --test shared/__tests__/user-experience-start-time.test.ts
      # 2026-09-04-reaudit-fixes: the post-build re-audit's contained fixes. Everything pinned here
      # is a divergence that RENDERED PERFECTLY while asking or claiming the wrong thing, which is
      # why none of it was caught by any existing gate:
      #   R1-R4 (plan-steps) — step 4's stepper tuple (an `attendees` occasion asks ONE count),
      #     the main-moment predicate that stops a GOLF plan writing a stray `temporal_anchors`
      #     row, the checked "your own city" caption, and the guest-list clause that is promised
      #     only on an explicit `default_guests: true`.
      #   G8 (slip-events) — `eventMetaLine`'s short form is an OPTION, so the slip and the
      #     "Which event?" picker cannot fork one derivation into two (§18 rule 1); every §13
      #     silence must survive the option.
      #   W1-W6 (wedding presets) — the two chips the ratified board draws that the table omitted;
      #     step 5 renders the SERVER's presets, so this table is the only thing standing between
      #     the board and what a traveler can tick.
      #   S6 (switch seeds) — the two seeded rows that disagreed with the ratified OccasionRow
      #     board, by value, because the seeder is the one author and a hand-edit is how they drift.
      - name: Re-audit contained fixes pin
        run: |
          npx tsx --test client/src/lib/__tests__/slip-events.test.ts
          npx tsx --test server/services/__tests__/wedding-presets.test.ts
          npx tsx --test shared/__tests__/experience-type-switches.test.ts
      # 2026-09-05-slip-events-first-render: four defects found on the production walkthrough of a
      # freshly minted wedding plan, every one of which rendered without erroring while telling the
      # traveler something untrue on their FIRST screen.
      #   F1-F9 (slip-events) — a plan's day list is built from ITEMS, so a plan with four events
      #     and zero items had no days and drew no event cards under a header that said
      #     "4 events". `buildSlipDaySlots` COMPOSES `groupItemsByEvent` rather than forking it, so
      #     F4/F4b are the load-bearing ones: an event that has items must not gain a second, empty
      #     card, and the items-present grouping must be byte-identical to the pinned snapshot.
      #     F3/F3b are the §13 half — an event with no day goes in a trailing "Undated" slot, never
      #     on day 1, and a malformed date is no date rather than a repaired one.
      #   O5/O6 (plan islands) — "how many events" now has ONE source (the plancard's own `events`),
      #     because the second one was a user-scoped list cached as `[]` from before the plan
      #     existed, which is how "Organize into events" came to sit under "4 events".
      #   P1-P5 / H1-H4 (shared) — `partyTotal` moved to `shared/` so the occasion PATCH, the
      #     trip-create path and the client stop deriving the plan's party three ways (P5 pins the
      #     inline server expression this replaces); `canonicalMarketName` moved beside it so the
      #     Profile page's new home-city picker and the ONE writer of `users.home_city` read one
      #     list and one matcher (H4 pins that every offered option is one the writer accepts).
      - name: Slip first-render pin
        run: |
          npx tsx --test client/src/lib/__tests__/slip-events.test.ts
          npx tsx --test client/src/lib/__tests__/plan-islands.test.ts
          npx tsx --test shared/__tests__/plan-party-total.test.ts
      # QA check 3 (post-publish walkthrough): the SAME surface, one layer earlier — what it says
      # BEFORE its data arrives. Both defects are one conflation: an occasion that resolved to
      # nothing and an occasion still in flight reach every reader as the same `null`, so the slip
      # claimed "No items on this plan yet" over a plan whose event cards were still coming, and
      # printed ruling 28's "travelers" fallback over a wedding until the row landed and it became
      # "guests". P1-P6/E1-E4 pin the two pure gates (including that the SETTLED behaviour is
      # byte-identical — the NULL-vocabulary fallback is a finished answer and must survive), and
      # A1-A5 pin the shipped wiring, because a gate a call site can reach past is the defect.
      - name: Slip first-paint pin
        run: npx tsx --test client/src/lib/__tests__/slip-first-paint.test.ts
      # 2026-09-05-custom-venues-owner-scope: §14 applied to READS. P1-P4/T1-T4 pin the two pure
      # rules (an absent session user is never an owner; a trip the caller does not own is treated
      # as ABSENT, not as an error), and A1-A6/S1-S2 pin the shipped artifacts — both GETs gated,
      # no owner id read off the query string, the undifferentiated 404, one predicate across all
      # four routes, and the storage readers refusing an ownerless listing rather than returning
      # the whole table.
      - name: Custom-venues owner-scope pin
        run: npx tsx --test server/__tests__/custom-venues-owner-scope.test.ts
      # 2026-09-05-vendors-read-scope: the same class one table over, found by the sweep above.
      # `GET /api/vendors` was unauthenticated, read `createdById` off the query string, and its
      # storage reader JOINED `users` — so any caller got every vendor row carrying the creating
      # account's EMAIL. P1-P7 pin the pure allowlist projection (no creator identity, `createdBy`
      # ABSENT rather than null, a new column NOT published by default); A1-A6/S1-S3 pin the
      # shipped artifacts — the browse route gated and reading no creator id, the creator filter
      # relocated to the /api/admin path under §2's blanket guard, and exactly ONE storage reader
      # joining `users`; G1-G2 pin that the guard's name list grew and that no query-side allowlist
      # was invented to hide this route behind.
      - name: Vendors read-scope pin
        run: npx tsx --test server/__tests__/vendors-read-scope.test.ts
      # 2026-09-05-experts-public-projection: the same class again, on the widest surface of the
      # three. `storage.getExpertsWithProfiles` spread the whole `users` row and removed THREE
      # names from it, and its callers — GET /api/experts, /api/experts/counts, /api/experts/:id —
      # are all unauthenticated, so `email`, `homeCity`, every `stripe*` column,
      # `commissionOverrideExpertSharePercent` (a §18 rate) and the whole `local_expert_forms` row
      # (`govId`/`travelLicence` included) were world-readable per expert account. P1-P10 pin the
      # pure projector (nothing credential/contact/payout survives; the display fields and the
      # composed keys do; `preferences` narrowed to one key and OMITTED when absent; a users column
      # added later excluded by default; idempotent, which is what lets the routes re-apply it);
      # A1-A3 and S1-S2 pin the shipped call sites and that the browse filters still resolve.
      - name: Experts public-projection pin
        run: npx tsx --test server/__tests__/experts-public-projection.test.ts
      # 2026-09-05-user-id-is-internal (CLAUDE.md Locked Decision 40): `users.id` is INTERNAL, an
      # earner's public identity is the HANDLE, and contact is addressed by CONTEXT with the
      # recipient resolved SERVER-SIDE. P1-P6 pin the opaque public conversation id (the old id was
      # literally the two user ids concatenated, so the THREAD KEY published the counterpart — a
      # leak no participant-object projection could catch) and its non-participant refusal; B1-B6
      # pin the `.strict()` pick-based address allowlist, including that a legacy `receiverId` body
      # is a 400 rather than a silently ignored key; K1-K5 pin who counts as a party to a booking
      # and that a stranger gets the same 404 as a non-existent one (§13, no oracle); L1-L3 pin that
      # an unresolvable context is labelled by KIND and never given an invented name; A1-A8 pin the
      # shipped artifacts — the rail reading no identity from the body, the admin index on §2's
      # blanket guard with no message bodies, the retracted "Not sensitive" comment, the
      # once-per-process deprecation warn, the schema declaration + no-CHECK/no-backfill migration,
      # the pick-based insert schema, and the single handle/verification predicates.
      - name: Contact rails (handle/service/booking) pin
        run: npx tsx --test server/__tests__/contact-rails.test.ts
      # 2026-09-05-ld40-lane2-public-ids (Locked Decision 40, LANE 2). A removed field is invisible:
      # nothing 500s, nothing logs, and every page lane 3 switched renders identically whether or
      # not the server still sends it — so a re-add has no runtime signal at all. R1-R4 pin the four
      # payloads this lane stripped (storefront earner, provider directory row, public service
      # detail, public service browse — the last also losing `revenueShareRate`, a §18 rate the two
      # earlier lanes missed on this third public read); V1-V3 pin that the verification badge moved
      # from a user-id address to a LISTING address with ONE implementation and the same F2 gate;
      # G1-G3 pin the guard's CI wiring, that both surviving exposures carry a printed reason rather
      # than silence, and that CLAUDE.md records the standing rule.
      - name: Public user-id projection pin
        run: npx tsx --test server/__tests__/public-user-id.test.ts
      # 2026-09-05-user-id-is-internal, LANE 3 (the clients). Lane 1 kept every id-addressed input
      # alive for one release, so a client that regresses to sending a user id STILL WORKS — it
      # opens the thread, logs nothing and looks correct. That is exactly the failure mode a test
      # has to hold, because nothing else will. A1-A6 pin the pure address mapping (a storefront
      # gives `{handle}`, a listing `{serviceId}`, a booking `{bookingId}`; two addresses is a
      # refusal and not a priority order, as on the server; nothing a caller passes can come back
      # out as a user id). P1-P2 pin `earnerProfilePath` — ONE decision about the public page, so
      # a card cannot fork handle-vs-id. U1-U4 pin the /chat URL resolver, including that the
      # legacy `?expertId=`/`?provider=` links still resolve (they are removed after lane 2) and
      # that the opaque id wins when both are present. S1-S5 read the SHIPPED files, because a
      # pure rule a call site can reach past is not a rule: the CTAs that switched, `senderId` gone
      # from every send branch, and the lane-2 marker on every surface still addressed by id.
      - name: Earner address / chat URL pin (LD 40 lane 3)
        run: npx tsx --test client/src/lib/__tests__/earner-address.test.ts
      # Client analytics wrapper (docs/superpowers/specs/2026-09-05-custom-analytics-events-design.md):
      # trackEvent must be a SAFE NO-OP whenever the host-injected tracker is absent — during SSR,
      # in dev/preview, and in the tracker-load race — and must swallow a throwing tracker rather
      # than let it escape. Every call site added by that lane sits INSIDE a mutation success
      # handler (checkout confirm, listing submit, trip create), so an analytics exception that
      # escapes is a product outage caused by telemetry. The test shipped with the lane but was
      # wired to no workflow; an unrun test is not a guard.
      - name: Analytics trackEvent fail-soft pin
        run: npx tsx --test client/src/lib/__tests__/analytics.test.ts
      # 2026-09-05-trip-pass-run-gate (CLAUDE.md Locked Decision 41, LANE 1): Trip Pass coverage was
      # read at the CHARGE point only, so a pass holder outside the 24h free-rerun window was told
      # the run was included and then got a `pending_payment` comparison with no variants — no
      # error, no log, and a page that looks exactly like ordinary "payment required". P1-P13 pin
      # the ONE run-authorization predicate (a pass authorizes the RUN; a pass on a DIFFERENT trip
      # authorizes nothing; no pass + outside the window + no PaymentIntent is still refused; a
      # covered run neither verifies nor spends a PI; an empty-string id is ABSENT). A1-A7 read the
      # shipped `server/routes.ts`, because a predicate a call site can reach past is not a rule:
      # exactly two call sites, one caller of `verifyOptimizationPayment`, one `coversAction`
      # wiring, the §15 atomic PI claim still at the route, no second copy of the free-rerun clock,
      # and no basis sentinel written into the payment-identity column.
      - name: Optimizer run-authorization pin (LD 41 lane 1)
        run: npx tsx --test server/__tests__/optimizer-run-authorization.test.ts
      # 2026-09-05-optimize-preview-on-slip (CLAUDE.md Locked Decision 41 (d)): the free heuristic
      # is now shown BEFORE the traveler pays, and the failure that would follow is a copy edit
      # promising a delta the heuristic cannot measure — it reads what each item IS, never where it
      # is, so it has no distance, no travel time and no measured saving to offer. P1-P8/E1-E3 pin
      # the extracted scoring (deterministic fixtures; an empty and a single-item plan REFUSED with
      # the heuristic's own reason rather than scored; the three legacy cart extrapolations kept
      # byte-identical but reachable only through their own named function). S1-S7 read the shipped
      # files, because ONE heuristic with two callers is exactly the kind of thing a later refactor
      # forks silently: no metrics call left in the routes file, both entries on the shared
      # function, the trip entry reading `loadTripOptimizerInputs` with the actor from the SESSION
      # and no item list off the wire, no Stripe/fee anywhere in the preview handler, and the slip
      # rendering neither extrapolated number. L1-L7/F1-F5 hold the traveler-facing strings.
      - name: Optimize-preview heuristic + slip line pin
        run: |
          npx tsx --test server/__tests__/optimize-preview-on-slip.test.ts
          npx tsx --test client/src/lib/__tests__/optimize-preview-line.test.ts

      # LD 41 lane 2 (ledger 2026-09-05-draft-only-on-empty + 2026-09-05-draft-cost-tracking-and-tier):
      # the free AI draft runs only on an EMPTY slip, its JSON recovery never repairs a truncated
      # response into a plan the model did not produce, and the client reads the refusal through
      # ONE module. All three are pure — no DATABASE_URL, no server, no network.
      - name: AI draft eligibility + parser + client-refusal pins (LD 41 lane 2)
        run: |
          npx tsx --test server/__tests__/ai-draft-eligibility.test.ts
          npx tsx --test server/__tests__/ai-json-parse.test.ts
          npx tsx --test client/src/lib/__tests__/ai-draft-refusal.test.ts
      # 2026-09-05-mint-market-slug-invariant (CLAUDE.md Locked Decision 42, D12 + D11-interim):
      # `market_slug` joins `timezone` as a named MINT invariant, and the intake panels stop
      # fabricating a party split. Both defects are ABSENCES that render perfectly — a plan minted
      # with a NULL market_slug looks right to its owner and is simply never seen by any
      # market-scoped reader, and `adults: travelers, kids: 0` is a well-formed answer to a question
      # neither panel asks. M1-M3 pin the two raw-SQL mints in booking.service.ts (column named,
      # derived value bound, ONE shared resolveMarketSlug, placeholder destinations NOT
      # special-cased into a hardcoded slug). M4 is the load-bearing one: it re-scans EVERY
      # trip-insert site in server/, holds Locked Decision 30's timezone stamp on all of them, and
      # pins the set that still omits market_slug to a RECORDED outstanding list — now the e2e seed
      # alone, since D12 binds EVERY production mint (the buyer's clone and BOTH expert authoring
      # builds included: a NULL userId exempts them from an owner row and the pen drain, never from
      # a market). A NEW omission fails here instead of being absorbed. I1-I3 pin
      # the stripped split and that the stated TOTAL still rides (the server derives the total from
      # `adults` only when the body omitted it, so nothing real was dropped).
      - name: Mint market_slug invariant / party-split pin
        run: npx tsx --test server/__tests__/mint-market-slug-invariant.test.ts
      # Build-order row 1.7 (ledger `2026-09-05-dead-surfaces-and-cart-qty`): three client
      # surfaces and one server field were deleted for having no consumer, and the cart's
      # quantity control gained a typed box. Both halves fail silently — a deleted-because-
      # unimported page comes back the day someone copies a sibling and nothing breaks, and a
      # typed box that grows its own local state or its own PATCH still WORKS, it just stops
      # agreeing with the buttons beside it. Q1-Q6 pin the one shared normaliser (floor 1, no
      # zero, the STORAGE ceiling rather than an invented cap, empty-is-a-draft that reverts on
      # commit); S1-S5 read the shipped files, because absence is the assertion.
      - name: Dead-surface absence + typed cart quantity pin
        run: npx tsx --test client/src/lib/__tests__/cart-quantity.test.ts
      # 2026-09-05-payment-method-posture / 2026-09-05-wallets-on-platform-intents (CLAUDE.md
      # Locked Decision 43): every PLATFORM PaymentIntent offers wallets (Apple Pay / Google Pay /
      # Link) through `automatic_payment_methods`. The regression this guards is SILENT — a site
      # that goes back to `payment_method_types: ['card']`, or a new charge path written card-only,
      # simply renders one fewer button and reports nothing anywhere. C1-C4 are a CENSUS over every
      # `paymentIntents.create` under server/: each one offers automatic methods or is on a PRINTED
      # exemption list with its reason (printed on every run, so an exemption cannot become a silent
      # baseline — the §18d posture), none pins payment_method_types, and each carries
      # allow_redirects:"never" because every sheet here confirms with `redirect: 'if_required'`
      # against a single return_url that is wrong for most of these flows. A1-A7 pin the shipped
      # artifacts, INCLUDING that this lane moved no idempotency key (§15) and no amount (§14), and
      # that the one exemption (the off-session confirm against a named saved card, which Stripe
      # will not accept automatic methods alongside) still looks the way its reason claims.
      - name: Payment-method posture — wallets on every platform intent (LD 43)
        run: npx tsx --test server/__tests__/payment-method-posture.test.ts
      # The other half of LD 43, client-side. P1-P6 pin the ONE prompt predicate, whose interesting
      # states are the two ways of having NO ANSWER — the vault read still in flight, and the read
      # DEGRADED (`available:false`, which /api/me/payment-methods returns instead of a 500) — both
      # of which report `methods: []` for a reason that is not "this traveler has no card" (§13).
      # D1-D4 pin per-scope dismissal over a localStorage that is allowed to be absent or to throw.
      # A1-A9 pin the shipped artifacts: one add-card rail (the existing AddCardDialog, no second
      # SetupIntent path), no amount stated, exactly the TWO mounts the ruling names, the Finalize
      # mount gated on bookable rows and on the owner, no client-side wallet suppression in either
      # Payment Element sheet — and LD 43(a), which is a CONVERSION decision no runtime assertion
      # can hold: no auth-shaped surface imports a payment rail at all.
      - name: Save-payment prompt + no-payment-at-signup pin (LD 43)
        run: npx tsx --test client/src/lib/__tests__/save-payment-prompt.test.ts
      # MONEY_MAP F-5 goes LIVE (ledger `2026-09-05-affiliate-subid-live`). Affiliate attribution is
      # per REQUEST: the outbound partner link for an `affiliate_booking_requests` row carries that
      # row's id in the partner's OWN attribution parameter, through ONE builder. B1-B6 pin the
      # builder — including the two §13 rules a plausible implementation gets wrong: a partner with
      # no sub_id concept gets the URL back BYTE-IDENTICAL (never a fabricated parameter) and the
      # return shape says so, and the builder never throws over an attribution nicety. R1-R4 pin the
      # round trip through `parseAttributionSubId` and the matcher's two decisions — an unparseable
      # sub_id yields a NULL token, is reported verbatim and stays UNMATCHED, because the only rows
      # this pass exists for carry a 0.00 the fuzzy pass rejects. S1-S5 pin §16 (the URL leaves only
      # as a Location header on a 302; both list readers and the PATCH strip it) and that this lane
      # decides no amount, rate or payout at all.
      - name: Affiliate sub_id attribution pin (MONEY_MAP F-5 live)
        run: npx tsx --test server/__tests__/affiliate-subid-attribution.test.ts

