name: Adopt Version Semantics Gate

# Guards ruling 2026-08-31-adopt-merge-finalize-lock: ADOPT = MERGE, FINALIZE = LOCK.
#
# The load-bearing assertions (V1–V5, adopt-version-semantics.db.test.ts) are the
# decision-maker's ruled version semantics, verbatim: "adopt on an un-final trip → zero
# trip_finals rows; adopt on a final trip → v+1; neither path sets finalized_at." Both adopt
# paths are driven over HTTP against a server booted in this job — whole-variant
# POST /api/itinerary-comparisons/:id/apply-to-trip (whose missing auto-v+1 call was the D-1a
# bug) and per-stop /adopt-stop (the ratified 2026-08-31-trip-card-snapshot-render behavior).
# V5 pins D-4 (R-B wins): proposals stay REVISITABLE — an apply never discards the losing
# variants (supersedes ruling 14's R3 clause). The adopt-stop suite runs beside it as the
# regression pair.
#
# A change that makes adopt finalize (one button doing both), makes finalize stop versioning,
# or reintroduces the losing-variant discard fails HERE.
#
# Registered in the docs/DECISIONS.md Guard registry as `adopt-version-semantics`. Ruling 27:
# a script-only/manual-only suite is MISSING — it must run in CI to count as a guard.
#
# Negative space (ruling 43 — what this gate does NOT cover): it proves version/lock semantics
# of the two adopt rails and finalize only — nothing about WHAT is merged (dedupe/replace
# scope), nothing about the R-A batch adopt (unbuilt, filed as its own lane), nothing about
# any money path (adopt purchases nothing by construction; the suites assert versions, not
# charges), and nothing about client vocabulary/labels.
#
# DB writes: the suites' assertDisposableDb guard refuses any non-localhost DB unless
# JOURNEY_DB_WRITES_OK=1 is set deliberately. This job's Postgres is a THROWAWAY service
# container, so the opt-in is safe here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: adopt-version-semantics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adopt-version-semantics:
    name: adopt-version-semantics (adopt = merge, finalize = lock)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Uses the composite action, never an inline migration-script step — ci-db-setup-lint
      # forbids inline DB setup, so every workflow gets the same migration + sessions-table
      # sequence.
      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          # The suites register their own travelers over HTTP; no seeded route auth involved.
          seed-ci-users: 'false'

      # Boot recipe mirrors payout-parity-gate.yml (build → prod bundle → /api/ready poll).
      # Stub keys are DELIBERATE: no adopt/finalize path calls Stripe or an AI provider.
      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          # sk_test_ stub — never a real Stripe secret (server/validate-env.ts hard-stops a
          # live key outside production; a test-shaped stub passes trivially).
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          # P0 fail-safe (server/index.ts): a production boot purges test accounts unless
          # explicitly allowed. This CI DB is throwaway.
          ALLOW_TEST_ACCOUNTS: '1'
          PORT: 5000
          # Plain-http loopback: a `secure` session cookie is never replayed, so opt out.
          # NEVER set this in production.
          SESSION_COOKIE_INSECURE: '1'
          # The suites register fresh users from the loopback IP; exempt loopback from the
          # limiter so registration is never 429'd. NEVER set this in production.
          RATE_LIMIT_LOOPBACK_SKIP: '1'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1

      - name: Adopt version semantics pins (V1–V5) + adopt-stop regression
        run: |
          npx tsx --test --test-concurrency=1 server/__tests__/adopt-version-semantics.db.test.ts
          npx tsx --test --test-concurrency=1 server/__tests__/adopt-stop.db.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          JOURNEY_BASE_URL: http://127.0.0.1:5000
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          NODE_ENV: test
          # Disposable-DB opt-in: this is a throwaway service container (see header comment).
          JOURNEY_DB_WRITES_OK: '1'
