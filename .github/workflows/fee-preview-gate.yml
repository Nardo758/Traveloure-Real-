name: Fee Preview Gate

# Guards the traveler service fee on GET /api/cart/fee-preview + the fee-ledger netting
# (ruling 2026-09-02-traveler-fee-applies-everywhere). The fee is now BILLED on the direct path, so:
#   A no tripId → no waiver, baseline total (which includes the fee)
#   B tripId with no pass → no waiver, total unchanged
#   C tripId with an active pass → waiver flag + counterfactual, total REDUCED by the waived fee,
#     travelerFee === 0, billedOnDirectPathToday === true
# Plus the fee-ledger contract (traveler-fee-ledger.db.test.ts): an uncovered booking lands one
# traveler_service_fee (+X) row; a covered booking lands that row PLUS a fee_waiver (−X) leg netting
# to $0; a $0 fee lands no row; idempotent.
#
# Boot recipe mirrors payout-parity-gate.yml (build → prod bundle → /api/ready poll). Stub Stripe/AI
# keys are deliberate — fee-preview is read-only and the ledger test writes only DB fixtures.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fee-preview-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fee-preview:
    name: fee-preview (Trip-Pass informational waiver)
    runs-on: ubuntu-latest
    # A HANG MUST FAIL, NEVER STALL (ledger `2026-09-05-fee-ledger-test-robustness`). Two runs in
    # 24h left the ledger step with no output for 30-80 minutes while every other job on the same
    # SHA was green; with no timeout anywhere the job was free to sit until GitHub's 6-hour default.
    # The per-step ceilings below name the failing step in the log; this one is the job backstop.
    # The ceilings are the BACKSTOP, not the cure — see the `--test-force-exit` note on the test
    # steps for the mechanism that was actually stalling them (ledger
    # `2026-09-05-fee-ledger-hang-root-cause`).
    timeout-minutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          # The suite registers its own buyer over HTTP and inserts its own fixtures.
          seed-ci-users: 'false'

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          ALLOW_TEST_ACCOUNTS: '1'
          PORT: 5000
          SESSION_COOKIE_INSECURE: '1'
          RATE_LIMIT_LOOPBACK_SKIP: '1'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1

      # `--test-force-exit` IS LOAD-BEARING, NOT A CONVENIENCE (ledger
      # `2026-09-05-fee-ledger-hang-root-cause`). `node --test <file>` runs the file in a CHILD
      # process and prints the file's result and the `1..N` summary only when that child EXITS —
      # so a child left alive by ANY stray handle produces a silent, unbounded stall whose last
      # line is the final `ok`, with every assertion already passed. The stray handle here is the
      # `pino-pretty` transport WORKER THREAD that `server/infrastructure/logger.ts` builds
      # whenever NODE_ENV !== "production" (these steps set NODE_ENV=test); its teardown races
      # process exit and loses ~11% of the time under 2-CPU contention. Ending the pg pool
      # (ledger `2026-09-05-fee-ledger-test-robustness`) was necessary and is kept — a hung child
      # holds no Postgres socket — but it was never the only handle. This flag makes the runner
      # exit as soon as every test AND hook has finished, with the exit code still decided by the
      # RESULTS: it cannot hide a failed assertion, and a genuinely blocked hook still reports its
      # `{ timeout: 60_000 }` failure first and then exits non-zero instead of stalling forever.
      # Same flag, same reason, as user-experience-ownership-gate.yml and the affiliate gates.
      - name: Fee-preview Trip-Pass waiver pins (A–C)
        run: npx tsx --test --test-force-exit server/__tests__/fee-preview-entitlement.http.test.ts
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          JOURNEY_BASE_URL: http://127.0.0.1:5000
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          NODE_ENV: test
          JOURNEY_DB_WRITES_OK: '1'

      - name: Traveler-fee ledger netting (+X / −X, $0-no-row, idempotency)
        run: npx tsx --test --test-force-exit server/__tests__/traveler-fee-ledger.db.test.ts
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          NODE_ENV: test
          JOURNEY_DB_WRITES_OK: '1'

      - name: Traveler-fee refund (proportional/full/waived/duplicate + reversal linkage)
        run: npx tsx --test --test-force-exit server/__tests__/traveler-fee-refund.db.test.ts
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          NODE_ENV: test
          JOURNEY_DB_WRITES_OK: '1'
