name: Guest Trip Mint Responds Gate

# Guards punchlist R-9, built by ledger `2026-09-14-guest-trip-mint-responds`. `POST /api/trips`
# had a guest branch that minted a NULL-owner `trips` row and then threw
# `TypeError: crypto.randomBytes is not a function` (the bare ESM Web Crypto global — this file
# imports only `randomBytes`) out of an async Express 4 handler, which never sends a response: the
# row was committed and the request HUNG. R1-R5 assert that an unauthenticated mint ANSWERS inside
# the request (401, per `2026-09-13-guest-cart-becomes-plan`'s "nothing lets an anonymous principal
# own a `trips` row" and punchlist D-15), that the refusal leaves NO row behind, that the gate
# precedes the parse, that the OWNER path still mints with its server-derived invariants (LD 30 /
# LD 42 D12), and that no code in `server/routes.ts` calls a method on the bare `crypto` global.
#
# WHY ITS OWN WORKFLOW AND NOT A build.yml JOB. This suite needs a REAL booted server (the defect
# was the ABSENCE of an HTTP response, which nothing short of a real request can observe), and a
# throwaway-DB boot of the production bundle needs ALLOW_TEST_ACCOUNTS=1 for server/index.ts's P0
# purge fail-safe. `check-env-allowlist.cjs` (c) is FAIL-CLOSED: that token may not appear in ANY
# form in a workflow that also targets a real deployment, and build.yml carries the prod-smoke
# jobs, so it does. Same reason every other server-booting gate lives in its own file. Boot recipe
# mirrors guest-cart-becomes-plan-gate.yml verbatim.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: guest-trip-mint-responds-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guest-trip-mint-responds:
    name: guest-trip-mint-responds (R-9; ledger 2026-09-14-guest-trip-mint-responds)
    runs-on: ubuntu-latest
    # A HANG MUST FAIL, NEVER STALL (the fee-preview-gate precedent, and this lane's whole subject):
    # per-step ceilings name the failing step in the log, and this is the job backstop. The suite
    # itself also carries a per-request abort deadline, so a never-answering route reports as a
    # failed assertion rather than eating the clock.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (runner-installed; no registry pull)
        uses: ./.github/actions/start-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          # The suite registers its own traveler over HTTP; it needs no seeded CI accounts.
          seed-ci-users: 'false'

      - name: Build production bundle
        run: npm run build

      # SESSION_COOKIE_INSECURE (plain-http loopback drops a `secure` cookie, so the traveler's
      # login would set none) and RATE_LIMIT_LOOPBACK_SKIP (one IP registering users is otherwise
      # 429'd) are both load-bearing, and NEVER set in production. The Stripe key is a stub and is
      # never exercised: nothing in this suite charges.
      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET_TEST: whsec_ci_stub_no_real_calls
          STRIPE_CONNECT_WEBHOOK_SECRET_TEST: whsec_ci_stub_no_real_calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          # P0 fail-safe (server/index.ts): a production boot purges test accounts unless
          # explicitly allowed. This CI database is throwaway and this workflow targets no
          # deployment — see the header for why that distinction decides which file this lives in.
          ALLOW_TEST_ACCOUNTS: '1'
          PORT: 5000
          SESSION_COOKIE_INSECURE: '1'
          RATE_LIMIT_LOOPBACK_SKIP: '1'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1

      # `--test-force-exit` is load-bearing for the reason fee-preview-gate.yml documents at
      # length: `node --test <file>` prints the summary only when the child EXITS, and a stray
      # handle can leave it alive forever with every assertion already passed. The flag cannot
      # hide a failed assertion.
      - name: The anonymous mint answers, and mints nothing (R1-R5)
        run: npx tsx --test --test-force-exit server/__tests__/guest-trip-mint-responds.http.test.ts
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          JOURNEY_BASE_URL: http://127.0.0.1:5000
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          NODE_ENV: test
          JOURNEY_DB_WRITES_OK: '1'
