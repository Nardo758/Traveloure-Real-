name: Scheduler Jobs Gate

# Guards the scheduler-reliability lane (#1712). The MONEY/INTEGRITY jobs are now fired by an
# external cron (jobs-cron.yml → the /internal/jobs/* endpoints) in ADDITION to their in-process
# defense-in-depth timers, so the endpoint and the timer can both run a job in the same window.
# The endpoint wrappers add NO money logic — they call the same idempotent job entry points — so the
# `[guarded]` property that matters ("no MONEY job can double-pay on a double-fire") is exactly the
# idempotency these suites prove. This gate runs them on every PR so the property is enforced, not
# merely asserted in a doc:
#
#   earnings-release-idempotency.db  — held→releasable flips once; a 2nd pass no-ops (the release job)
#   booking-auto-complete.db         — the completion flip + mint are double-fire safe (auto-complete)
#   checkout-claim-sweep.db          — void/promote can never both win; a 2nd sweep double-frees nothing
#   reconciliation-detection.db      — append-only exceptions; dedupe_key absorbs re-detection
#   internal-jobs-auth.http          — every /internal/jobs/* route is default-deny (503 unset / 401)
#   internal-jobs-limiter.http        — /internal rate cap + failed-auth lockout, per-IP (L1/L7)
#   internal-jobs-skip-semantics.db  — a skip, a real run and a broken job are three answers (L4)
#   internal-jobs-heartbeat.db       — cron liveness: roster-driven staleness; a skip never stamps (L6)
#   internal-spa-fallback-exemption  — a dead /internal route can never be answered 200-HTML (L3)
#   startup-delay                    — the boot-herd floor+jitter contract
#   check-jobs-cron-roster           — jobs-cron.yml has ONE cron schedule + posts every in-scope
#                                       JOB_CADENCE route (ledger 2026-09-20-jobs-cron-single-schedule)
#   post-internal-jobs.test.sh       — the cron script's cold-start warm-up + bounded 404/503 retry
#                                       against a local stub server (ledger
#                                       2026-09-20-jobs-cron-cold-start-retry): a boot-window 404
#                                       is retried and recovers; a truly dead route still fails; a
#                                       401 or 500 is never retried; readiness that never arrives
#                                       fails cleanly, naming the readiness path
#
# Negative space (ruling 43): this gate proves the jobs are idempotent and the endpoints are
# default-deny. It does NOT boot the app, so the owner-rail HTTP half of booking completion
# (booking-completion-machinery.db.test.ts, which needs a running server at JOURNEY_BASE_URL) is
# out of scope here and runs where a booted server is available. check-jobs-cron-roster proves the
# WORKFLOW's static shape (one schedule, every roster route named) — it does NOT prove GitHub
# actually fires that schedule in production; that is verified in the Actions tab after merge
# (jobs-cron.yml), or by a future external trigger (recorded, not built — see the ledger row above).
# post-internal-jobs.test.sh proves the SCRIPT's retry/warm-up logic against a stub it starts
# itself — it does NOT prove production's actual cold-start behaviour, which is why the fix also
# keeps the three-check health contract (HTTP 200 + JSON + ok:true) unweakened: a stub can be
# wrong about production timing, but it cannot make a genuinely dead route pass.
#
# Same Postgres + composite-migration shape as fee-resolution-authority-gate.yml. Sequential steps,
# not one combined `npx tsx --test a b c` — node:test aggregates exit codes across files unhelpfully.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scheduler-jobs-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scheduler-jobs:
    name: scheduler-jobs (idempotency + endpoint auth, #1712)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      SESSION_SECRET: ci-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
      NODE_ENV: test
      ALLOW_TEST_ACCOUNTS: '1'
      JOURNEY_DB_WRITES_OK: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (runner-installed; no registry pull)
        uses: ./.github/actions/start-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Self-test first (§18d): a predicate that never lies to itself before it lies about the repo.
      - name: jobs-cron roster guard — self-test
        run: node scripts/check-jobs-cron-roster.cjs --self-test

      - name: jobs-cron roster guard — one schedule, every route posted
        run: node scripts/check-jobs-cron-roster.cjs

      - name: post-internal-jobs.sh — cold-start warm-up + bounded retry (vs a local stub server)
        run: bash scripts/ci/post-internal-jobs.test.sh

      - name: Facts recheck — route, auth, success heartbeat and failure/overlap semantics
        run: npx vitest run --config vitest.facts-recheck.config.ts

      # Migrations are the fixture; the composite action is mandatory (ci-db-setup-lint forbids
      # inline DB setup). No authenticated routes here — every suite creates its own rows directly.
      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'false'

      - name: Earnings release — double-fire safety (the release job)
        run: npx tsx --test server/__tests__/earnings-release-idempotency.db.test.ts

      - name: Booking auto-completion — idempotent flip + mint
        run: npx tsx --test server/__tests__/booking-auto-complete.db.test.ts

      - name: Checkout claim sweep — void/promote race + no double-free
        run: npx tsx --test server/__tests__/checkout-claim-sweep.db.test.ts

      - name: Stripe reconciliation — append-only drift detection
        run: npx tsx --test server/__tests__/reconciliation-detection.db.test.ts

      # Track A step A2 (ledger `2026-09-29-a2-travel-time-matrix`): the travel-time matrix refresh
      # against a fake Routes API — never the network. M1–M8.
      - name: Travel-time matrix — refresh job + read helper (fake Routes API)
        run: npx tsx --test --test-force-exit server/__tests__/travel-time-matrix.db.test.ts

      # Track A step A3 (ledger `2026-09-29-a3-option-sets`): comparisons on the plan — cap, atomic
      # choose, R129, finalize/routing guards, M7/M8. O1–O10. Rides this DB job beside A2's matrix.
      - name: Plan option sets — cap, atomic choose, R129, M7/M8
        run: npx tsx --test --test-force-exit server/__tests__/plan-option-sets.db.test.ts
      # R-ah (ledger `2026-10-03-item-locks`, migration 342): item locks — the owner's writer, and
      # Regenerate / Optimize apply / Optimize input / the Moment default all honour a lock. K1–K7.
      - name: Item locks — Keep this, never moved or removed by a machine
        run: npx tsx --test --test-force-exit server/__tests__/item-locks.db.test.ts
      # FD-2 (ledger `2026-10-09-fd2-content-tier-tags`, migrations 361/362): content-tier tags — the item stamp
      # ignores a client value (ruling 9), the 362 backfill, the draft gem gate, gem verification, the census. D1–D8.
      - name: FD-2 content tiers — tags, backfill, draft gate, verification, census
        run: npx tsx --test --test-force-exit server/__tests__/content-tiers.db.test.ts
      # Ledger `2026-10-03-build-around-places`: build-around reads Google's live location fact and
      # stores no coordinate (LD 57); the option reader resolves it. B1–B4.
      - name: Build-around on a Google-located item — read, never copied
        run: npx tsx --test --test-force-exit server/__tests__/build-around-places.db.test.ts
      - name: A5 content facts — engine order, Places cache, plan-fit points, no public reader
        run: npx tsx --test --test-force-exit server/__tests__/content-facts.db.test.ts
      - name: R313 leg Google coords — refresh a live point, clear past the max age, expired fact never a pin
        run: npx tsx --test --test-force-exit server/__tests__/leg-google-coords-refresh.db.test.ts
      - name: T-48h nudge — "starts soon" only for chosen dates and a start ahead (ledger 2026-10-08-nudge-needs-real-dates)
        run: npx tsx --test --test-force-exit server/__tests__/trip-card-handover-nudge.db.test.ts
      - name: A6 Tavily extract — free path cannot call it, caps, 300-char quotes, own host only
        run: npx tsx --test --test-force-exit server/__tests__/tavily-extract.db.test.ts
      - name: A6 expert confirm — crawled fact to verified nugget, once, never a Places fact
        run: npx tsx --test --test-force-exit server/__tests__/fact-confirm.db.test.ts
      - name: A9 paid-run fresh fetch — paid runs only, one pass, never a free draft (pure)
        run: npx tsx --test --test-force-exit server/__tests__/paid-run-fresh-fetch.test.ts
      - name: A6 content source registry — born inactive, edit strips terms, allowlisted activation
        run: npx tsx --test --test-force-exit server/__tests__/content-sources.db.test.ts
      # Places named-place gate (ledger `2026-09-30-places-named-gate`, production smoke test 3):
      # generic titles are never looked up, a mismatched answer is never attached, and the per-draft
      # cap reaches every day. G1–G4, fake Places API only.
      - name: Places named-place gate — generic items get no facts; the cap reaches every day
        run: npx tsx --test --test-force-exit server/__tests__/places-named-gate.db.test.ts
      # Smoke 4 item 5 (ledger `2026-10-02-smoke4-draft-fixes`): the "Where to stay" read and bind
      # against real rows — eligibility, ranking by the plan's own days, no invented inventory,
      # Skip and "I've got lodging sorted" through the option-set rail. D1–D4.
      - name: Where to stay — ranked by the plan's days; skip and own answers bind honestly
        run: npx tsx --test --test-force-exit server/__tests__/where-to-stay.db.test.ts
      # Smoke 9 S9-1 (ledger `2026-10-04-smoke9-fixes`): the plan's lodging anchor is not an item for
      # the free-draft gate — hotel + flights drafts and keeps the stay; one stop is still refused. G1–G3.
      - name: Smoke 9 draft gate — anchors are not items; the draft keeps the stay
        run: npx tsx --test --test-force-exit server/__tests__/smoke9-draft-gate.db.test.ts
      # Feedback phase A (ledger `2026-10-04-feedback-phase-a`, migration 345): one row per plan ×
      # moment × user (a second tap updates), server-filled context, unknown pairs refused. F1–F5.
      - name: Feedback events — a second tap updates; unknown codes refused
        run: npx tsx --test --test-force-exit server/__tests__/feedback-events.db.test.ts
      # Surface step 5 (ledger `2026-10-04-surface-step5-map-versions`, migrations 343/344): the versions
      # board read, per-day apply with provenance (moved in place, locked kept, draft and run untouched),
      # and R-ac's free re-times — the fourth refused with nothing written. B1–B4.
      - name: Versions board — per-day apply and the free re-time limit
        run: npx tsx --test --test-force-exit server/__tests__/version-board.db.test.ts

      # TravelPulse PR 1 (ledger `2026-09-29-travelpulse-hygiene`): no legacy crowd/pulse field on
      # the four public routes, the 48h Trend freshness gate, and /api/health's score age. T1–T4.
      # --test-force-exit because importing content.routes.ts starts the TravelPulse scheduler timer.
      - name: TravelPulse — public routes carry no legacy crowd; stale Trend shows no number
        run: npx tsx --test --test-force-exit server/__tests__/travelpulse-public-crowd.db.test.ts

      - name: Internal job endpoints — default-deny auth (no DB touched)
        run: npx tsx --test server/routes/__tests__/internal-jobs-auth.http.test.ts

      - name: Internal job endpoints — rate cap + failed-auth lockout (L1/L7)
        run: npx tsx --test server/routes/__tests__/internal-jobs-limiter.http.test.ts

      - name: Internal job endpoints — skip vs ran vs broken are three answers (L4)
        run: npx tsx --test server/routes/__tests__/internal-jobs-skip-semantics.db.test.ts

      - name: Internal job endpoints — heartbeat roster + staleness (L6)
        run: npx tsx --test server/routes/__tests__/internal-jobs-heartbeat.db.test.ts

      - name: SPA fallback never answers /internal (L3, no DB touched)
        run: npx tsx --test server/__tests__/internal-spa-fallback-exemption.test.ts

      - name: Boot-herd startup delay — floor + jitter contract
        run: npx tsx --test server/services/__tests__/startup-delay.test.ts
