name: Unwired Spec Gate

# WHY THIS GATE EXISTS (ledger 2026-09-14-test-files-wired-orphans).
#
# The reachability inventory (`scripts/check-test-files-wired.cjs`, ledger
# 2026-09-13-test-files-wired) reported 88 test files that no workflow could
# reach. 41 of them were Playwright specs. This gate claims the subset that was
# run to completion on a CI-shaped bench and passed IN FULL — so they stop
# reading as coverage and start being it. It is the sibling of
# spec-coverage-gate.yml and provider-console-gate.yml, which did the same job
# for the Aug-16 sweep and for the console surfaces.
#
# PROVEN, NOT ASSUMED, AND PROVEN ON A DATABASE BUILT FROM EMPTY. Every spec
# below was run against a Postgres created by nothing but ci-db-setup's three
# steps, by the same serial invocation this gate uses. The specs from the same
# sweep that did NOT pass are deliberately EXCLUDED and recorded in the ledger
# row with their reason — a gate that lands red on day one teaches people to
# ignore it, and an allowlist inside the inventory would have been worse: it
# would have made them disappear instead.
#
# WHAT THE RUNNER MUST GIVE THESE SPECS (each one faked a failure during the
# sweep before it was found — the same four spec-coverage-gate.yml records):
#   1. DATABASE_URL + PG* — logo-navigation-surfaces and others read rows.
#   2. PW_AUTH_SETUP=1    — playwright.config.ts gates globalSetup on it; the
#      storageState files ea-console-pages and logo-navigation-surfaces load are
#      written by that setup and by nothing else.
#   3. An HTTP-200 readiness probe — global-setup THROWS in CI mode on anything
#      less, wiping the whole run before a test executes. /api/ready grades a
#      missing XAI_API_KEY or STRIPE_WEBHOOK_SECRET as `fail`, so both stubs are
#      load-bearing.
#   4. Seeded CI users — global-setup logs in as them.
#
# --timeout=120000 is deliberate and is NOT a flake allowance: the Vite dev
# server takes tens of seconds to serve a heavy authenticated route's module
# graph while the APIs behind it answer in milliseconds. Playwright's 30s
# default indicts the module waterfall, not the product.
#
# STATED NEGATIVE SPACE. paris-surfacing carries its OWN conditional
# `test.skip()` (PARIS-4 stands down when the unfiltered control already proved
# the point), so a green run of that file can be three assertions rather than
# four. It is named here rather than left for someone to discover.
#
# ANTI-VACUITY: `npx playwright test <name>` exits 0 when the name matches
# nothing, so every spec path is asserted to exist before Playwright runs, and
# specs are passed as explicit paths.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unwired-specs:
    name: unwired-specs (DOM gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Assert every gated spec exists at its expected path
        # A missing path must fail LOUDLY here rather than silently reduce this
        # gate to zero assertions. Fix when this fails: restore the spec, OR
        # update both this list and the run step below.
        run: |
          set -euo pipefail
          FAIL=0
          for f in \
            playwright/tests/catalog-preview-toggle.spec.ts \
            playwright/tests/ea-console-pages.spec.ts \
            playwright/tests/landing-market-ticker.spec.ts \
            playwright/tests/logo-navigation-surfaces.spec.ts \
            playwright/tests/optimized-slip-confirmation.spec.ts \
            playwright/tests/paris-surfacing.spec.ts \
            playwright/tests/plan-guests.spec.ts \
            playwright/tests/planning-entry.spec.ts \
            playwright/tests/service-display-options.spec.ts \
            playwright/tests/trip-pass.spec.ts \
            playwright/tests/vendors-creator-filter.spec.ts; do
            if [ ! -f "$f" ]; then
              echo "::error file=.github/workflows/unwired-spec-gate.yml::Spec file not found: $f"
              FAIL=1
            else
              echo "OK  $f"
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "::error::One or more gated specs are missing."; exit 1; }
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Set up CI database (migrations, sessions table, test users)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'true'
      - name: Start dev server (PR artifact — localhost only)
        run: npx tsx server/index.ts &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: development
          E2E_AI_STUB: "1"
          RATE_LIMIT_LOOPBACK_SKIP: "1"
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure
      - name: Wait for server, seeding, and an HTTP-200 readiness verdict
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:5000/api/ready || true)
            if [ "$code" = "200" ]; then
              echo "Server ready, seeding complete, readiness 200"; exit 0
            fi
            echo "attempt $i/60: http=$code $(cat /tmp/ready.json 2>/dev/null | head -c 200)"; sleep 5
          done
          echo "::error::Server did not reach an HTTP-200 readiness within 5 minutes. If the body says ready:true, a health check is graded 'fail' — check which env var is missing."
          cat /tmp/ready.json 2>/dev/null || true
          exit 1
      - name: Verify build identity (artifact == PR commit)
        run: |
          VERSION=$(curl -sf http://localhost:5000/api/version)
          echo "Server reports: $VERSION"
          ACTUAL_SHA=$(echo "$VERSION" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          EXPECTED_SHA="${{ github.sha }}"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Build identity mismatch — server SHA=$ACTUAL_SHA expected=$EXPECTED_SHA. Tests would run against the wrong artifact."
            exit 1
          fi
          echo "Build identity confirmed: $ACTUAL_SHA"
      - name: Previously-unwired specs (proven green by the 2026-09-14 sweep)
        # workers=1 and explicit paths: several of these register accounts and
        # create plans through the real rails, so they must not interleave.
        run: |
          npx playwright test --project=chromium --workers=1 --timeout=120000 \
            playwright/tests/catalog-preview-toggle.spec.ts \
            playwright/tests/ea-console-pages.spec.ts \
            playwright/tests/landing-market-ticker.spec.ts \
            playwright/tests/logo-navigation-surfaces.spec.ts \
            playwright/tests/optimized-slip-confirmation.spec.ts \
            playwright/tests/paris-surfacing.spec.ts \
            playwright/tests/plan-guests.spec.ts \
            playwright/tests/planning-entry.spec.ts \
            playwright/tests/service-display-options.spec.ts \
            playwright/tests/trip-pass.spec.ts \
            playwright/tests/vendors-creator-filter.spec.ts
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'
          PW_AUTH_SETUP: '1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unwired-spec-report
          path: playwright-report/
          retention-days: 14
