name: Custom venue allowlist gate

# Security-audit finding (as-of 4644af6): insertCustomVenueSchema was .omit()-based, so `userId`
# and `source` stayed client-settable and POST /api/custom-venues never stamped an owner — a caller
# could birth a venue owned by someone else, or attach one to any trip id (the FK requires the trip
# to exist, not to be yours). §19's stated fix shape is a pick-based ALLOWLIST; this is the first
# #PS18 conversion, so check-omit-schema-ratchet's baseline moves 190 -> 189 in the same PR.
#
# No database service: the suite parses schemas and reads source. The ratchet + its self-test run
# here too, because the baseline change is part of this fix and must not be silently reverted.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    # CI-1b (c): docs-only and other-workflow-only changes do not trigger this workflow
    # (scripts/ci/ci-skip-rules.cjs canonicalPaths; later entries win).
    paths:
      - '**'
      - '!**/*.md'
      - 'CLAUDE.md'
      - 'generated/**'
      - 'client/public/.well-known/**'
      - '!.github/workflows/**'
      - '.github/workflows/custom-venue-allowlist-gate.yml'
  workflow_dispatch:

concurrency:
  group: custom-venue-allowlist-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'ready_for_review' }}
permissions:
  contents: read

jobs:
  custom-venue-allowlist:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: custom venue owner is not a body field
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
      SESSION_SECRET: ci-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
      NODE_ENV: test
      ALLOW_TEST_ACCOUNTS: '1'
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Omit-schema ratchet predicate self-test
        run: node scripts/check-omit-schema-ratchet.cjs --self-test
      - name: Omit-schema ratchet (baseline 189 after the first #PS18 conversion)
        run: node scripts/check-omit-schema-ratchet.cjs
      - name: Custom venue mass-assignment (C1-C5)
        run: npx tsx --test server/routes/__tests__/custom-venue-mass-assignment.test.ts
