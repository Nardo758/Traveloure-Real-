name: E2E Tests (Model B — STAGING deploy-only, no Actions DB)

# NON-BLOCKING BY DESIGN — scheduled + manual only, NOT on push/PR.
#
# This suite drives the FULL journey specs against an EXTERNAL deployed app that lags `main`
# during active development. On a PR it therefore reports the state of the *deploy*, not the
# PR's diff, so it cannot gate a PR meaningfully — the app-in-Actions gates (Build Smoke,
# Selection Controls, Service Offering Types, Upsell Trust Contract) do that. Running it on
# every push/PR only posted a permanent, misleading red. It now runs on a daily schedule +
# manual dispatch. Triage of the current failures (stale-deploy vs. drifted specs) and the
# per-test rehab backlog live in docs/audits/e2e-model-b-triage.md.
#
# TARGET = STAGING (E2E_STAGING_BASE_URL), NOT production.
# Nearly every journey spec logs in a seeded @traveloure.test account. Production purges those
# accounts on boot (PR #319 P0 fix, enforced by scripts/check-env-allowlist.cjs), so this suite
# is structurally incapable of passing against production — it would die in e2e/global-setup.ts
# with a 401. Provisioning staging is the OWNER's action: see docs/STAGING.md.
#
# WHEN STAGING IS NOT CONFIGURED the test job is SKIPPED (grey, not green) and the final check
# renames itself to say so. A not-configured run must never read as a passing run.

on:
  workflow_dispatch:
  schedule:
    # Run E2E tests daily at 2:23 UTC (off-peak, avoids top-of-hour congestion)
    - cron: '23 2 * * *'

jobs:
  # secrets.* are unavailable in `if:` conditions — probe in a job and publish an output.
  config:
    name: 'staging config probe'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.guard.outputs.run }}
    env:
      E2E_STAGING_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
    steps:
      - name: Check staging secret (report loudly when absent)
        id: guard
        run: |
          if [ -z "$E2E_STAGING_BASE_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Journey suite did not run::E2E_STAGING_BASE_URL is not configured — the journey suite DID NOT RUN. This is not a pass."
            {
              echo "## ⛔ STAGING NOT CONFIGURED — journey suite DID NOT RUN"
              echo
              echo "\`E2E_STAGING_BASE_URL\` is not set, so **zero** journeys executed. This is not a passing result."
              echo
              echo "The journey specs log in seeded \`@traveloure.test\` accounts, which production purges on"
              echo "every boot. They require a staging deploy — **owner action, see \`docs/STAGING.md\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  playwright-tests:
    # 90 min: tests use 90 s element timeouts × 13 tests + 2 retries each = ~40 min
    # plus 10 min server wake-up window.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    name: 'Playwright E2E Tests (staging)'
    needs: config
    if: needs.config.outputs.configured == 'true'
    env:
      E2E_STAGING_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for Replit deployment (health + DB seeded + ready)
        id: server-check
        # Hard-fail if the Replit dev server does not respond within 10 minutes.
        # A passing E2E job with no tests executed provides no signal — if the
        # server is unavailable the gate must fail explicitly so engineers know
        # to re-run when the Replit workspace is active.
        #
        # Model B: The deployed app self-seeds its own DB on startup. We only
        # confirm the app is alive AND its DB is seeded and ready by checking:
        #   - /health        → DB connectivity (checks.database.status === "healthy")
        #   - /api/ready     → seeding completion (ready === true)
        # No Actions-side database work — no DATABASE_URL, no migrations, no seed.
        run: |
          # 60 attempts × 10 s = 10 minute window.  Replit dev servers can take
          # several minutes to wake from sleep when the first request arrives.
          max_attempts=60
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            # Check 1: /health — DB connectivity and general health
            health_response=$(curl -s --connect-timeout 15 --max-time 20 \
              "$E2E_STAGING_BASE_URL/health" 2>/dev/null || echo "")
            health_db=$(echo "$health_response" | node -e "
              let d = '';
              process.stdin.on('data', c => d += c);
              process.stdin.on('end', () => {
                try {
                  const j = JSON.parse(d);
                  const db = j.checks?.database?.status === 'healthy';
                  process.stdout.write(db ? 'yes' : 'no');
                } catch { process.stdout.write('no'); }
              });
            " || echo "no")

            # Check 2: /api/ready — seeding completion (test accounts + data)
            ready_response=$(curl -s --connect-timeout 15 --max-time 20 \
              "$E2E_STAGING_BASE_URL/api/ready" 2>/dev/null || echo "")
            ready_ok=$(echo "$ready_response" | node -e "
              let d = '';
              process.stdin.on('data', c => d += c);
              process.stdin.on('end', () => {
                try {
                  const j = JSON.parse(d);
                  process.stdout.write(j.ready === true ? 'yes' : 'no');
                } catch { process.stdout.write('no'); }
              });
            " || echo "no")

            if [ "$health_db" = "yes" ] && [ "$ready_ok" = "yes" ]; then
              echo "✓ Replit deployment is accessible, DB is healthy, and seeding is complete"
              echo "  Health: $health_response"
              echo "  Ready:  $ready_response"
              exit 0
            fi

            echo "Attempt $attempt/$max_attempts: health_db=$health_db  ready=$ready_ok  — waiting..."
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "::error::Replit dev server did not report healthy DB + complete seeding within 10 minutes (${max_attempts} attempts)."
          echo "::error::E2E tests cannot run against an unready server — re-run this workflow"
          echo "::error::while the Replit workspace is active to get real test results."
          exit 1

      - name: Verify service readiness (fast-fail on missing secrets)
        # Hits /api/ready which reports service-key presence.  Any "fail" check
        # (ai_xai, stripe, webhook) returns HTTP 503 so CI stops here with a
        # clear diagnostic instead of burning time inside the test suite.
        # WARN-only checks (ai_claude, email) do not block the gate.
        run: |
          echo "Checking /api/ready for service configuration..."
          READY_CODE=$(curl -s -o /tmp/ready.json \
            -w "%{http_code}" \
            --connect-timeout 15 --max-time 20 \
            "$E2E_STAGING_BASE_URL/api/ready")
          echo "HTTP $READY_CODE"
          cat /tmp/ready.json | python3 -m json.tool || cat /tmp/ready.json
          if [ "$READY_CODE" != "200" ]; then
            echo "❌ Service readiness check failed (HTTP $READY_CODE)."
            echo "Missing required secrets:"
            cat /tmp/ready.json | node -e "
              let d = '';
              process.stdin.on('data', c => d += c);
              process.stdin.on('end', () => {
                try {
                  const j = JSON.parse(d);
                  Object.entries(j.checks || {}).forEach(([k, v]) => {
                    if (v.status === 'fail') {
                      process.stdout.write('  ✗ ' + k + ': ' + v.message + '\n');
                    }
                  });
                } catch { process.stdout.write('  (could not parse response)\n'); }
              });
            "
            exit 1
          fi
          echo "✅ All critical services ready"

      - name: Annotate deploy freshness (warn-only)
        # The deployed app exposes GET /api/version -> { sha }. If the Replit deploy injects
        # GIT_COMMIT (it does not yet — falls back to "dev"), we can tell whether the target is
        # running the commit under test. A stale (or "dev") deploy is the #1 cause of red here:
        # a failing journey may just be testing older code. Warn-only — never fails the run.
        run: |
          DEPLOY_SHA=$(curl -s --connect-timeout 15 --max-time 20 "$E2E_STAGING_BASE_URL/api/version" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(d).sha||'unknown')}catch{process.stdout.write('unknown')}})" \
            || echo "unreachable")
          echo "Deploy /api/version sha: $DEPLOY_SHA"
          echo "Commit under test:       $GITHUB_SHA"
          if [ "$DEPLOY_SHA" = "dev" ] || [ "$DEPLOY_SHA" = "unknown" ] || [ "$DEPLOY_SHA" = "unreachable" ]; then
            echo "::warning::Deploy does not report a real commit (sha='$DEPLOY_SHA'; GIT_COMMIT not injected at deploy). Cannot verify the deploy matches this commit — failures may be stale-deploy, not code regressions."
          elif [ "$DEPLOY_SHA" != "$GITHUB_SHA" ]; then
            echo "::warning::STALE DEPLOY: app is running $DEPLOY_SHA but tests target $GITHUB_SHA. Redeploy before trusting failures as code regressions."
          else
            echo "✓ Deploy matches the commit under test."
          fi

      # playwright.e2e.config.ts resolves E2E_STAGING_BASE_URL first (job env),
      # so this harness can only point at staging from here.
      - name: Run E2E journey suite against staging
        run: npm run test:e2e:staging
        env:
          # Staging may carry its own seed password; falls back to the shared one.
          # If both are empty, e2e/fixtures/accounts.ts uses the documented dev default.
          E2E_TEST_PASSWORD: ${{ secrets.E2E_STAGING_TEST_PASSWORD || secrets.E2E_TEST_PASSWORD }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Post test summary as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'playwright-report/index.html';
            if (!fs.existsSync(reportPath)) {
              console.log('No report found — server was likely unavailable. Skipping comment.');
              return;
            }
            const report = fs.readFileSync(reportPath, 'utf8');
            const passed  = (report.match(/passed/g)  || []).length;
            const failed  = (report.match(/failed/g)  || []).length;
            const skipped = (report.match(/skipped/g) || []).length;
            const icon = failed > 0 ? '❌' : '✅';
            const body = `## ${icon} E2E Test Results\n\n` +
              `✅ **Passed:** ${passed}  ❌ **Failed:** ${failed}  ⏭️ **Skipped:** ${skipped}\n\n` +
              `[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }).catch(() => console.log('Could not post comment (OK for non-PR runs)'));

  # The check NAME carries the outcome so a not-configured run can never be read
  # as a passing run from the checks list alone.
  test-summary:
    name: ${{ needs.config.outputs.configured == 'true' && 'Test Summary (staging)' || 'STAGING NOT CONFIGURED — journey suite DID NOT RUN' }}
    runs-on: ubuntu-latest
    needs: [config, playwright-tests]
    if: always()

    steps:
      - name: Summarize results
        run: |
          CONFIGURED='${{ needs.config.outputs.configured }}'
          RESULT='${{ needs.playwright-tests.result }}'
          if [ "$CONFIGURED" != "true" ]; then
            echo "::warning title=Journey suite did not run::E2E_STAGING_BASE_URL not configured — DID NOT RUN (not a pass)."
            echo "STAGING NOT CONFIGURED — journey suite DID NOT RUN. Nothing was verified. See docs/STAGING.md."
            exit 0
          fi
          echo "# E2E Test Suite Summary (result: $RESULT)"
          echo "## Harness: playwright.e2e.config.ts (auth-dependent — STAGING target)"
          echo "## Specs: e2e/specs/*.spec.ts"
          echo ""
          echo "## Flows Tested"
          echo "- Journey 1A: Authed traveler — landing → discover → cart → checkout → confirmation"
          echo "- Journey 1B: Guest path — landing → discover → add-to-cart → sign-in → cart/migrate → checkout → confirmation"
          echo ""
          echo "## Stage 1 Component Wiring"
          echo "- EscalationCTA in trip-details expert tab"
          echo "- ExpertMatchCard in discover with showExperts"
          echo "- SmartServiceRecommendations in discover (authed)"
          echo "- /local-experts route renders without 404"
          echo ""
          echo "## Required Secrets (Model B — no DATABASE_URL)"
          echo "- E2E_STAGING_BASE_URL       (HTTPS STAGING deploy URL — must be live while the workflow runs)"
          echo "- E2E_STAGING_TEST_PASSWORD  (optional; falls back to E2E_TEST_PASSWORD, then the dev default)"
          echo "See docs/STAGING.md for provisioning."
          if [ "$RESULT" = "failure" ]; then
            echo "::error title=Journey suite failed::The staging journey suite failed."
            exit 1
          fi
