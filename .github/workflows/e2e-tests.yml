name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run E2E tests daily at 2am UTC
    - cron: '0 2 * * *'

jobs:
  playwright-tests:
    # 90 min: tests use 90 s element timeouts × 13 tests + 2 retries each = ~40 min
    # plus 10 min server wake-up window.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    name: 'Playwright E2E Tests'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Replit deployment
        id: server-check
        # Hard-fail if the Replit deployment does not respond within 10 minutes.
        # Probes /api/health which executes SELECT 1 — proves the deployed DB
        # is connected and the app is fully initialised.
        run: |
          max_attempts=60
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            http_code=$(curl -s --connect-timeout 15 --max-time 20 \
              -o /tmp/health_body.json -w "%{http_code}" \
              "$E2E_BASE_URL/api/health" 2>/dev/null || echo "000")
            if echo "$http_code" | grep -qE "^(200|301|302|304)$"; then
              db_flag=$(python3 -c "import json,sys; d=json.load(open('/tmp/health_body.json')); print(d.get('db','?'))" 2>/dev/null || echo "?")
              echo "✓ Replit deployment accessible (HTTP $http_code, db=$db_flag)"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: HTTP $http_code — waiting..."
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "::error::Replit deployment did not respond within 10 minutes."
          exit 1
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}

      - name: Apply pending migrations to E2E database
        # Uses secrets.DATABASE_URL (the deployed app's database).
        # migrate-entry.ts probes reachability first (5 s timeout) — if the DB
        # host is not accessible from GitHub Actions it exits 0 with a warning.
        # The deployed app applies all migrations at startup, so this step is a
        # belt-and-suspenders pre-flight when the DB is externally reachable.
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed E2E test accounts
        # Same reachability pattern as migrations above.
        # When DATABASE_URL is not reachable the script exits 0 gracefully.
        # Accounts are guaranteed to exist in the deployed DB — seeded manually
        # on first deploy and preserved across restarts.
        run: npm run seed:e2e-accounts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Verify deployed login (gate)
        # Hard-fail if the primary E2E test account cannot log in.
        # Asserts both HTTP 200 and a Set-Cookie session header — proves the
        # auth stack is up and the seeded password is correct.
        run: |
          curl -s --connect-timeout 15 --max-time 20 \
            -D /tmp/login_headers.txt \
            -o /tmp/login_body.json \
            -X POST "$E2E_BASE_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"test-traveler-kyoto@traveloure.test\",\"password\":\"$E2E_TEST_PASSWORD\"}"
          http_code=$(awk 'NR==1{print $2}' /tmp/login_headers.txt)
          echo "Login probe → HTTP $http_code"
          cat /tmp/login_body.json || true
          if [ "$http_code" != "200" ]; then
            echo "::error::Login returned HTTP $http_code (expected 200)."
            echo "::error::Check E2E_TEST_PASSWORD secret and that accounts are seeded in the deployed DB."
            exit 1
          fi
          if ! grep -qi "^set-cookie:" /tmp/login_headers.txt; then
            echo "::error::No Set-Cookie header — session was not established."
            exit 1
          fi
          echo "✓ Login verified for test-traveler-kyoto@traveloure.test (HTTP 200 + Set-Cookie)"
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Run E2E deploy tests (journey-1 + Stage 1 gates)
        run: npm run test:e2e:deploy
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Post test summary as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'playwright-report/index.html';
            if (!fs.existsSync(reportPath)) {
              console.log('No report found — server was likely unavailable. Skipping comment.');
              return;
            }
            const report = fs.readFileSync(reportPath, 'utf8');
            const passed  = (report.match(/passed/g)  || []).length;
            const failed  = (report.match(/failed/g)  || []).length;
            const skipped = (report.match(/skipped/g) || []).length;
            const icon = failed > 0 ? '❌' : '✅';
            const body = `## ${icon} E2E Test Results\n\n` +
              `✅ **Passed:** ${passed}  ❌ **Failed:** ${failed}  ⏭️ **Skipped:** ${skipped}\n\n` +
              `[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }).catch(() => console.log('Could not post comment (OK for non-PR runs)'));

  test-summary:
    name: 'Test Summary'
    runs-on: ubuntu-latest
    needs: playwright-tests
    if: always()

    steps:
      - name: Summarize results
        run: |
          echo "# E2E Test Suite Summary"
          echo "## Harness: playwright.e2e.config.ts (deploy harness)"
          echo "## Spec: e2e/specs/journey-1.spec.ts"
          echo ""
          echo "## Flows Tested"
          echo "- Journey 1A: Authed traveler — landing → discover → cart → checkout → confirmation"
          echo "- Journey 1B: Guest path — landing → discover → add-to-cart → sign-in → cart/migrate → checkout → confirmation"
          echo ""
          echo "## Stage 1 Component Wiring"
          echo "- EscalationCTA in trip-details expert tab"
          echo "- ExpertMatchCard in discover with showExperts"
          echo "- SmartServiceRecommendations in discover (authed)"
          echo "- /local-experts route renders without 404"
          echo ""
          echo "## Required Secrets"
          echo "- E2E_BASE_URL    (HTTPS deploy URL — must be live while workflow runs)"
          echo "- E2E_TEST_PASSWORD  (password for seeded test accounts)"
          echo "- DATABASE_URL    (deployed DB; migration/seed scripts probe reachability)"
