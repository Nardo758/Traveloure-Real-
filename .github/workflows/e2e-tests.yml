name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run E2E tests daily at 2am UTC
    - cron: '0 2 * * *'

jobs:
  playwright-tests:
    # 90 min: tests use 90 s element timeouts × 13 tests + 2 retries each = ~40 min
    # plus 10 min server wake-up window.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    name: 'Playwright E2E Tests'

    services:
      # Local postgres for the migration and seed pre-flight steps.
      # The Replit-managed postgres (helium) is internal-only and unreachable
      # from GitHub Actions. Migration and seeding run here so both steps exit
      # cleanly; the deployed app already has E2E accounts from startup seeding.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Replit deployment
        id: server-check
        # Hard-fail if the Replit dev server does not respond within 10 minutes.
        # A passing E2E job with no tests executed provides no signal — if the
        # server is unavailable the gate must fail explicitly so engineers know
        # to re-run when the Replit workspace is active.
        run: |
          # 60 attempts × 10 s = 10 minute window.  Replit dev servers can take
          # several minutes to wake from sleep when the first request arrives.
          max_attempts=60
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            http_code=$(curl -s --connect-timeout 15 --max-time 20 \
              -o /dev/null -w "%{http_code}" "$E2E_BASE_URL/api/health" 2>/dev/null || echo "000")
            if echo "$http_code" | grep -qE "^(200|301|302|304)$"; then
              echo "✓ Replit deployment is accessible (HTTP $http_code)"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: HTTP $http_code — waiting for deployment..."
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "::error::Replit dev server did not respond within 10 minutes (${max_attempts} attempts)."
          echo "::error::E2E tests cannot run against an unavailable server — re-run this workflow"
          echo "::error::while the Replit workspace is active to get real test results."
          exit 1
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}

      - name: Apply pending migrations to E2E database
        # Runs against a local CI postgres (see services above).
        # Keeps the step meaningful (schema is validated) without requiring
        # network access to Replit's internal postgres host (helium).
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure_e2e

      - name: Seed E2E test accounts
        # Seeds into the local CI postgres (same rationale as migrations above).
        # The deployed app seeds these accounts automatically at startup via
        # runDatabaseSeeding() → seedE2EAccounts() in server/index.ts, so
        # the accounts are guaranteed to exist in the deployed DB.
        run: npm run seed:e2e-accounts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure_e2e
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Verify deployed login (gate)
        # Hard-fail if the primary E2E test account cannot log in to the
        # deployed app.  A non-200 here means the seed at startup failed or
        # the password does not match — tests will fail anyway but this gives
        # a clearer signal before Playwright runs.
        run: |
          http_code=$(curl -s --connect-timeout 15 --max-time 20 \
            -o /tmp/login_response.json -w "%{http_code}" \
            -X POST "$E2E_BASE_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"test-traveler-kyoto@traveloure.test\",\"password\":\"$E2E_TEST_PASSWORD\"}" \
            2>/dev/null || echo "000")
          echo "Login probe HTTP $http_code"
          cat /tmp/login_response.json || true
          if [ "$http_code" != "200" ]; then
            echo "::error::Deployed login returned HTTP $http_code — check E2E_TEST_PASSWORD secret and startup seeding."
            exit 1
          fi
          echo "✓ Login verified for test-traveler-kyoto@traveloure.test"
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Run E2E deploy tests (journey-1 + Stage 1 gates)
        run: npm run test:e2e:deploy
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Post test summary as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'playwright-report/index.html';
            if (!fs.existsSync(reportPath)) {
              console.log('No report found — server was likely unavailable. Skipping comment.');
              return;
            }
            const report = fs.readFileSync(reportPath, 'utf8');
            const passed  = (report.match(/passed/g)  || []).length;
            const failed  = (report.match(/failed/g)  || []).length;
            const skipped = (report.match(/skipped/g) || []).length;
            const icon = failed > 0 ? '❌' : '✅';
            const body = `## ${icon} E2E Test Results\n\n` +
              `✅ **Passed:** ${passed}  ❌ **Failed:** ${failed}  ⏭️ **Skipped:** ${skipped}\n\n` +
              `[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }).catch(() => console.log('Could not post comment (OK for non-PR runs)'));

  test-summary:
    name: 'Test Summary'
    runs-on: ubuntu-latest
    needs: playwright-tests
    if: always()

    steps:
      - name: Summarize results
        run: |
          echo "# E2E Test Suite Summary"
          echo "## Harness: playwright.e2e.config.ts (deploy harness)"
          echo "## Spec: e2e/specs/journey-1.spec.ts"
          echo ""
          echo "## Flows Tested"
          echo "- Journey 1A: Authed traveler — landing → discover → cart → checkout → confirmation"
          echo "- Journey 1B: Guest path — landing → discover → add-to-cart → sign-in → cart/migrate → checkout → confirmation"
          echo ""
          echo "## Stage 1 Component Wiring"
          echo "- EscalationCTA in trip-details expert tab"
          echo "- ExpertMatchCard in discover with showExperts"
          echo "- SmartServiceRecommendations in discover (authed)"
          echo "- /local-experts route renders without 404"
          echo ""
          echo "## Required Secrets"
          echo "- E2E_BASE_URL    (HTTPS deploy URL — must be live while workflow runs)"
          echo "- E2E_TEST_PASSWORD  (password for seeded test accounts)"
          echo "- DATABASE_URL    (prod DB — set but only used as reference; CI uses local postgres)"
