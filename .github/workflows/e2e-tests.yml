name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run E2E tests daily at 2am UTC
    - cron: '0 2 * * *'

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    name: 'Playwright E2E Tests'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Replit deployment
        run: |
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -s -o /dev/null -w "%{http_code}" "$E2E_BASE_URL" | grep -q "200\|301\|302"; then
              echo "✓ Replit deployment is accessible"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: Waiting for deployment..."
            sleep 10
            attempt=$((attempt + 1))
          done
          echo "⚠ Deployment not responding after $max_attempts attempts"
          exit 1
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}

      - name: Seed E2E test accounts
        run: npm run seed:e2e-accounts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Run E2E deploy tests (journey-1 + Stage 1 gates)
        run: npm run test:e2e:deploy
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Post test summary as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'playwright-report/index.html';
            if (!fs.existsSync(reportPath)) return;
            const report = fs.readFileSync(reportPath, 'utf8');
            const passed  = (report.match(/passed/g)  || []).length;
            const failed  = (report.match(/failed/g)  || []).length;
            const skipped = (report.match(/skipped/g) || []).length;
            const icon = failed > 0 ? '❌' : '✅';
            const body = `## ${icon} E2E Test Results\n\n` +
              `✅ **Passed:** ${passed}  ❌ **Failed:** ${failed}  ⏭️ **Skipped:** ${skipped}\n\n` +
              `[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }).catch(() => console.log('Could not post comment (OK for non-PR runs)'));

  test-summary:
    name: 'Test Summary'
    runs-on: ubuntu-latest
    needs: playwright-tests
    if: always()

    steps:
      - name: Summarize results
        run: |
          echo "# E2E Test Suite Summary"
          echo "## Harness: playwright.e2e.config.ts (deploy harness)"
          echo "## Spec: e2e/specs/journey-1.spec.ts"
          echo ""
          echo "## Flows Tested"
          echo "- Journey 1A: Authed traveler — landing → discover → cart → checkout → confirmation"
          echo "- Journey 1B: Guest path — landing → discover → add-to-cart → sign-in → cart/migrate → checkout → confirmation"
          echo ""
          echo "## Stage 1 Component Wiring"
          echo "- EscalationCTA in trip-details expert tab"
          echo "- ExpertMatchCard in discover with showExperts"
          echo "- SmartServiceRecommendations in discover (authed)"
          echo "- /local-experts route renders without 404"
          echo ""
          echo "## Required Secrets"
          echo "- E2E_BASE_URL    (HTTPS deploy URL)"
          echo "- E2E_TEST_PASSWORD  (password for seeded test accounts)"
          echo "- DATABASE_URL    (prod DB — needed by seed:e2e-accounts step)"
