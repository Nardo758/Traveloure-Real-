name: Suite AI Draft And Availability

# T-5/T-6 of the orphan plan (ledger `2026-09-15-orphans-t4-t7-red-suites`; docs/lane-reports/
# 2026-09-15-orphan-triage.md §7): R-12/R-13 (`availability-model.db`, `s11-stay-booking.db`) and
# the two LD 41 (b) suites (`generated-itinerary-atomicity.db`, `regenerate-booking-guard.db`) —
# every one an HTTP+DB suite that registers its actor over HTTP in the BOOTED app and then inserts
# fixture rows from the test process. NAMED FILE LIST, NOT A DIRECTORY GLOB, for the reason stated
# in suite-mutation-auth.yml.
#
# WHY ITS OWN WORKFLOW AND NOT A build.yml JOB (ledger `2026-09-16-ci-main-red-repairs`). This job
# boots the PRODUCTION BUNDLE against a throwaway Postgres, and that boot needs ALLOW_TEST_ACCOUNTS=1
# for server/index.ts's P0 purge fail-safe. `scripts/check-env-allowlist.cjs` (c) is FAIL-CLOSED and
# FILE-SCOPED: the token may not appear in ANY form in a workflow FILE that also targets a real
# deployment, and build.yml counts as one (its `artifact-deploy-guard` job key matches the guard's
# production/deploy job-name signal). Ledger `2026-09-15-orphans-t4-t7-red-suites` added this job to
# build.yml and turned main red on that guard. The guard is NOT narrowed — a deploy-targeting file may
# never carry the flag — so the job moves to its own file, which is exactly where every other
# server-booting gate (fee-preview-gate, publish-gate-and-fundamentals, payout-parity, the route gates,
# cart-priceless-listing) already lives. Job KEY and `name:` are unchanged so the check-run name a
# reviewer sees is unchanged, and `scripts/check-test-files-wired.cjs` scans every workflow file, so
# the six suites this job runs stay wired.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: suite-ai-draft-and-availability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite-ai-draft-and-availability:
    name: suite-ai-draft-and-availability (R-12/R-13 + the two LD 41 (b) suites — DB + app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      SESSION_SECRET: ci-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
      NODE_ENV: test
      JOURNEY_DB_WRITES_OK: '1'
      JOURNEY_BASE_URL: http://127.0.0.1:5000
      BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (runner-installed; no registry pull)
        uses: ./.github/actions/start-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'false'
      - name: Build production bundle
        run: npm run build
      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET_TEST: whsec_ci_stub_no_real_calls
          STRIPE_CONNECT_WEBHOOK_SECRET_TEST: whsec_ci_stub_no_real_calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          EMAIL_FROM: noreply@ci.traveloure.test
          NODE_ENV: production
          ALLOW_TEST_ACCOUNTS: '1'
          PORT: 5000
          SESSION_COOKIE_INSECURE: '1'
          RATE_LIMIT_LOOPBACK_SKIP: '1'
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://127.0.0.1:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then echo "Server ready"; exit 0; fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"; exit 1
      # T-5. Both suites create their actor over HTTP in the SERVER process and
      # then insert fixture rows from the TEST process; the missing read-back
      # between the two is the race triage §6 measured (0/13 on six runs). The
      # repair is one shared fixture, server/__tests__/fixtures/registered-actor.ts.
      - name: R-12/R-13 availability + stay booking
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/availability-model.db.test.ts server/__tests__/s11-stay-booking.db.test.ts
      # T-6. Both suites were overtaken by Locked Decision 41 (b) — the free AI
      # draft runs only on an EMPTY slip — and their fixtures seeded a slip that
      # already held items. Restated, not weakened: every slip is born empty and
      # every expected rejection is now IDENTIFIED rather than merely awaited.
      - name: LD 41 (b) snapshot atomicity + rebuild guard
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/generated-itinerary-atomicity.db.test.ts server/__tests__/regenerate-booking-guard.db.test.ts
