name: Route Coverage Gate

# Guards against broken or missing routes reaching production.
#
# Three Playwright smoke suites run inside the single navbar-links-smoke job:
#
#   1. navbar-links  — every href in navGroupsConfig + authNavConfig
#                      (client/src/lib/nav-config.ts)
#   2. footer-links  — every href in footerSectionsConfig
#                      (client/src/lib/nav-config.ts)
#   3. app-routes    — every <Route path="..."> in client/src/App.tsx,
#                      including routes not listed in nav-config.ts
#                      (detail pages, onboarding flows, public share pages,
#                      role dashboards, etc.)
#
# Each suite visits every resolved URL against a locally-built production
# bundle and fails if any route renders the NotFound (404) component or
# a blank/empty page with no heading or <main> content.
#
# Dynamic segments (:id, :token, :slug, …) in App.tsx routes are replaced
# with canonical placeholders; duplicate resolved URLs are deduplicated.
# Auth-gated routes that redirect to "/" rather than 404ing pass all checks.
#
# Status contexts (for branch-protection required checks):
#   * navbar-links-smoke — all three suites run here; safe to mark REQUIRED.
#   * report             — PR comment; informational only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to avoid redundant gate checks.
concurrency:
  group: navbar-links-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  navbar-links-smoke:
    name: navbar-links-smoke (Playwright DOM gate)
    runs-on: ubuntu-latest
    # 40, not 20: the three suites run serially and app-routes now visits ~176
    # routes (~10 min). At 20 the job was cancelled mid-app-routes. Kept at 1
    # worker (playwright.config CI default) for determinism — bump this before
    # parallelizing.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Create sessions table (connect-pg-simple workaround)
        # connect-pg-simple 10.0.0 table.sql uses WITH (OIDS=FALSE) which is
        # incompatible with Postgres 12+. Pre-create the table here.
        run: npx tsx scripts/create-sessions-table.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Build production bundle
        # Serve a PRODUCTION build so Vite HMR WebSocket noise is absent.
        # Startup seeding still runs (gated on ENVIRONMENT !== "PROD", not
        # NODE_ENV), so /api/ready flips true as expected.
        run: npm run build

      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1

      - name: Navbar links smoke (all navGroupsConfig + authNavConfig hrefs)
        # Derives hrefs from client/src/lib/nav-config.ts (single source of truth).
        # No globalSetup / auth required — 404-checking works for all routes
        # (auth-gated ones redirect to "/" rather than rendering NotFound).
        run: npx playwright test navbar-links --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'

      - name: Footer links smoke (all footerSectionsConfig hrefs)
        # Derives hrefs from client/src/lib/nav-config.ts (footerSectionsConfig).
        # No globalSetup / auth required — 404-checking works for all routes
        # (auth-gated ones redirect to "/" rather than rendering NotFound).
        run: npx playwright test footer-links --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'

      - name: App route coverage (all <Route path="..."> entries in App.tsx)
        # Extracts every path registered in client/src/App.tsx at test-collection
        # time — including routes that are NOT listed in nav-config.ts (detail
        # pages, onboarding flows, public share pages, role dashboards, etc.).
        # Dynamic segments (:id, :token, …) are substituted with canonical
        # placeholders; duplicate resolved URLs are deduplicated.
        # Auth-gated routes redirect to "/" rather than rendering NotFound, so
        # they pass the 404 gate and are skipped on the content check.
        run: npx playwright test app-routes --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navbar-links-report
          path: playwright-report/
          retention-days: 14

  report:
    name: report (PR comment)
    runs-on: ubuntu-latest
    needs: [navbar-links-smoke]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## Route Coverage Gate — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl})`,
              '',
              '> Three suites run against a locally-built production bundle:',
              '> **navbar-links** (all `navGroupsConfig` + `authNavConfig` hrefs), **footer-links** (all `footerSectionsConfig` hrefs),',
              '> and **app-routes** (every `<Route path="...">` in `client/src/App.tsx`, including routes not in nav-config).',
              '> A red gate means at least one route renders the 404 (NotFound) page **or** a blank/empty page with no heading or `<main>` content.',
              allGreen ? '' : '> Fix: ensure every failing path has a matching `<Route>` in `client/src/App.tsx` and that the page component renders real content (at least one h1/h2/h3 or a non-empty `<main>`).',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
