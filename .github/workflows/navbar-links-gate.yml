name: Route Coverage Gate

# Guards against broken or missing navbar/footer routes reaching production.
#
# Jobs in this workflow:
#
#   navbar-links-smoke (Playwright DOM gate) — suites 0–2:
#
#     0. crash-filter-unit — pure unit tests for the console-error filter
#                            predicates (playwright/utils/console-crash-filter.ts)
#                            used by the smoke test. No browser or server needed;
#                            runs fast as an early gate.
#
#     1. navbar-links      — every href in navGroupsConfig + authNavConfig
#                            (client/src/lib/nav-config.ts)
#     2. footer-links      — every href in footerSectionsConfig
#                            (client/src/lib/nav-config.ts)
#
#   hardcoded-links-check (static analysis, no server or browser) — suite 3:
#
#     3. hardcoded-links   — all static href="/..." and to="/..." string literals
#                            found in client/src/ components, cross-checked against
#                            <Route path="..."> entries in App.tsx.  Catches links
#                            that were removed from nav-config but still exist in
#                            component files.  Pure static analysis — no DB, no
#                            server, no Playwright browser required.  Gives
#                            sub-30-second feedback on broken links.
#
# Each browser suite visits every resolved URL against a locally-built
# production bundle and fails if any route renders the NotFound (404)
# component or a blank/empty page with no heading or <main> content.
#
# App-route coverage (every <Route path="..."> in App.tsx) runs in its own
# dedicated workflow: .github/workflows/app-routes-gate.yml
# Authenticated role-route coverage (expert/provider/admin/EA routes with real
# session cookies) runs in: .github/workflows/auth-routes-gate.yml
# Auth-gated routes that redirect to "/" rather than 404ing pass all checks.
#
# Status contexts (for branch-protection required checks):
#   * navbar-links-smoke      — navbar + footer checks; safe to mark REQUIRED.
#   * hardcoded-links-check   — static link analysis; safe to mark REQUIRED.
#   * report                  — PR comment; informational only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to avoid redundant gate checks.
concurrency:
  group: navbar-links-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  navbar-links-smoke:
    name: navbar-links-smoke (Playwright DOM gate)
    runs-on: ubuntu-latest
    # 40, not 20: the three suites run serially and app-routes now visits ~176
    # routes (~10 min). At 20 the job was cancelled mid-app-routes. Kept at 1
    # worker (playwright.config CI default) for determinism — bump this before
    # parallelizing.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Crash-filter unit tests (pure logic, no browser needed)
        # Verifies the console-error filter predicates in
        # playwright/utils/console-crash-filter.ts that the navbar-links smoke
        # test depends on. These are pure JS unit tests — no server or browser
        # required — so they run fast and act as an early gate.
        run: npx playwright test crash-filter-unit
        env:
          CI: 'true'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Apply database migrations
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Cache production build output
        uses: actions/cache@v4
        id: build-cache
        with:
          path: dist/
          key: build-${{ runner.os }}-${{ hashFiles('client/**', 'server/**', 'shared/**', 'package-lock.json') }}

      - name: Build production bundle
        # Serve a PRODUCTION build so Vite HMR WebSocket noise is absent.
        # Startup seeding still runs (gated on ENVIRONMENT !== "PROD", not
        # NODE_ENV), so /api/ready flips true as expected.
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: [REDACTED_STRIPE_TEST_KEY]_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1

      - name: Navbar links smoke (all navGroupsConfig + authNavConfig hrefs)
        # Derives hrefs from client/src/lib/nav-config.ts (single source of truth).
        # No globalSetup / auth required — 404-checking works for all routes
        # (auth-gated ones redirect to "/" rather than rendering NotFound).
        run: npx playwright test navbar-links --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'

      - name: Footer links smoke (all footerSectionsConfig hrefs)
        # Derives hrefs from client/src/lib/nav-config.ts (footerSectionsConfig).
        # No globalSetup / auth required — 404-checking works for all routes
        # (auth-gated ones redirect to "/" rather than rendering NotFound).
        run: npx playwright test footer-links --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navbar-links-report
          path: playwright-report/
          retention-days: 14

  hardcoded-links-check:
    name: hardcoded-links-check (static analysis)
    runs-on: ubuntu-latest
    # No PostgreSQL service — pure file-system analysis, no DB or server needed.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Hardcoded-link cross-check (static href/to literals vs App.tsx routes)
        # Scans every .tsx / .ts file in client/src/ (except nav-config.ts, which
        # is already covered by the navbar-links and footer-links suites) for
        # static string literals used as href="/..." or to="/..." attributes.
        # Each found path is verified against the <Route path="..."> entries in
        # App.tsx.  Fails if any hardcoded path has no matching route — meaning a
        # link in a component points to a route that was deleted or never added.
        # No browser, no server, no database — pure static source-file analysis.
        # Typically completes in under 30 seconds.
        run: npx playwright test hardcoded-links
        env:
          CI: 'true'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardcoded-links-report
          path: playwright-report/
          retention-days: 14

  report:
    name: report (PR comment)
    runs-on: ubuntu-latest
    needs: [navbar-links-smoke, hardcoded-links-check]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## Route Coverage Gate — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl})`,
              '',
              '> Two jobs guard this gate:',
              '> **navbar-links-smoke** (suites 0–2: crash-filter unit tests, `navGroupsConfig` + `authNavConfig` hrefs, `footerSectionsConfig` hrefs) runs against a locally-built production bundle.',
              '> **hardcoded-links-check** (suite 3: static `href="/..."` / `to="/..."` literals in `client/src/` components cross-checked against App.tsx routes) runs as a fast static-analysis job — no server or browser needed.',
              '> App-route coverage (every `<Route path="...">` in `App.tsx`) runs in the separate **app-routes-gate** workflow.',
              '> A red gate means at least one route renders the 404 (NotFound) page, a blank/empty page, or a hardcoded link in a component points to a missing route.',
              allGreen ? '' : '> Fix: ensure every failing path has a matching `<Route>` in `client/src/App.tsx`, the page renders real content, and no component links to a removed route.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
