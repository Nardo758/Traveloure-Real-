# REQUIRED (decision-maker, Sep 27, 2026 — ledger `2026-09-27-supply-demand-e2e-required`).
#
# Supply → Demand content-journey e2e harness (Pass 2). Builds and serves a
# PR/main artifact locally on localhost:5000 (never a shared deployment),
# seeds CI test users, runs the supply specs (s1-s3) then the demand specs
# (d*-*.spec.ts) in one serial Playwright run so the demand specs can reuse
# the Kyoto fixture content the supply specs mint. Stripe stays the CI stub
# (sk_test_ci_stub…) — every Stripe-dependent step is `test.skip('HELD:stripe')`.
#
# Status context (for branch-protection required checks):
#   * supply-demand-e2e — safe to mark as a REQUIRED branch-protection check.
#
# It runs on EVERY pull request to main, with no `paths:` filter: a required check that a PR never
# triggers reports nothing and leaves that PR waiting forever. `continue-on-error` is gone for the
# same reason — a required check has to be able to fail. Modeled on
# .github/workflows/selection-controls-gate.yml (e2e-journey-2 job) for the local-server pattern.
name: Supply-Demand E2E

on:
  # Merge queue (ledger `2026-10-18-merge-queue-triggers`): the queue's run is always a full run.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# CI-1b (b): a new push to the same PR cancels that PR's run still in progress. Schedule, dispatch and
# main runs are never cancelled (the build.yml pattern).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

jobs:
  # CI-1b (c)+(d) (scripts/ci/ci-skip-rules.cjs): decides whether this PR push runs the heavy jobs. A draft or
  # a docs-only / other-workflow-only push skips them; a job skipped by its `if:` reports success, so every
  # required check still reports on the merge head. Only an explicit run=false skips: any other event, a file
  # list it cannot read, or this job failing outright leaves the suites running (fail open).
  changes:
    name: changes (skip suites on drafts and docs-only pushes)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          sparse-checkout: scripts/ci
      - name: Skip rules self-test
        run: node scripts/ci/ci-skip-rules.cjs --self-test
      - id: decide
        name: Decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node scripts/ci/ci-skip-rules.cjs --decide

  supply-demand:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    name: supply-demand-e2e
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Start PostgreSQL (runner-installed; no registry pull)
        uses: ./.github/actions/start-postgres

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Set up CI database (migrations + sessions table + CI test accounts)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'true'

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start server (built artifact — localhost only)
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          # Stripe stub — every Stripe-dependent supply/demand step is test.skip('HELD:stripe').
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          # CI escape hatch (server/validate-env.ts) — without it, the prod-strict
          # Stripe-key guard refuses to boot the production bundle with a sk_test_
          # stub key. Every *-gate.yml workflow that boots dist/index.cjs sets this.
          ALLOW_TEST_ACCOUNTS: '1'
          # The server runs NODE_ENV=production over plain http://localhost, so the session
          # cookie is Secure by default and the browser drops it: login answers 200 and every
          # later request is 401. Same pair every other browser gate that boots dist/ sets.
          SESSION_COOKIE_INSECURE: '1'
          RATE_LIMIT_LOOPBACK_SKIP: '1'
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          # Set and ignored: a production boot never serves the canned draft.
          # D4 asserts the model failure (429/502/503, no origin='ai' rows, ai-draft-failure).
          E2E_AI_STUB: '1'
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          exit 1

      - name: Capture baseline row counts (post-seed)
        run: mkdir -p test-results && npx tsx scripts/e2e/row-counts.ts > test-results/row-counts-baseline.txt
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Supply + demand E2E (s1-s3, then d*)
        run: npx playwright test -c playwright.supply-demand.config.ts
        env:
          BASE_URL: http://localhost:5000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          NODE_ENV: production
          CI: 'true'

      - name: Upload evidence + findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-demand-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
