name: E2E Deploy Smoke

# Runs the new deploy-targeting Playwright harness (playwright.e2e.config.ts →
# e2e/specs) against a deployed app. NON-BLOCKING BY DESIGN: do NOT add this job
# to branch-protection required checks until it has a green run with secrets.
#
# Distinct from e2e-tests.yml, which runs the OLDER local harness
# (playwright.config.ts → ./playwright/tests) against a hardcoded URL.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-deploy-smoke:
    name: e2e-deploy-smoke (deployed app; non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # secrets.* are NOT accessible in `if:` conditions, so map them to job env
    # and gate the work on a guard step's output instead.
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Check E2E secrets (skip cleanly when absent)
        id: guard
        run: |
          if [ -z "$E2E_BASE_URL" ] || [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "::notice::E2E_BASE_URL / E2E_TEST_PASSWORD not configured — skipping deploy smoke (non-blocking)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.guard.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.guard.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run deploy smoke (chromium)
        if: steps.guard.outputs.run == 'true'
        run: npm run test:e2e:deploy:smoke

      - name: Upload report
        if: ${{ always() && steps.guard.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-deploy-smoke-report
          path: playwright-report/
          retention-days: 14
