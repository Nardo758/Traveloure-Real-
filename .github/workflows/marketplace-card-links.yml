name: Marketplace card links

on:
  pull_request:
    paths:
      - "artifacts/traveloure/**"
      - "artifacts/api-server/**"
      - "playwright.marketplace.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/marketplace-card-links.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/traveloure/**"
      - "artifacts/api-server/**"
      - "playwright.marketplace.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/marketplace-card-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-card-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Assert active marketplace spec exists
        run: test -f artifacts/traveloure/playwright/marketplace-card-links.spec.ts
      - name: Start the active API server
        run: pnpm --filter @workspace/api-server run dev > /tmp/api-server.log 2>&1 &
        env:
          PORT: 8080
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: marketplace-card-links-ci
          NODE_ENV: development
          RATE_LIMIT_LOOPBACK_SKIP: "1"
      - name: Start the active Traveloure web artifact
        run: pnpm --filter @workspace/traveloure run dev > /tmp/traveloure-web.log 2>&1 &
        env:
          PORT: 20087
          BASE_PATH: /
      - name: Wait for active services
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/healthz >/dev/null && curl --fail --silent http://127.0.0.1:20087/services >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/api-server.log || true
          cat /tmp/traveloure-web.log || true
          exit 1
      - name: Run Marketplace card regression check
        run: pnpm run test:e2e:marketplace
        env:
          BASE_URL: http://127.0.0.1:20087
          CI: "true"
      - name: Upload active-service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-card-links-logs
          path: |
            /tmp/api-server.log
            /tmp/traveloure-web.log
          retention-days: 14