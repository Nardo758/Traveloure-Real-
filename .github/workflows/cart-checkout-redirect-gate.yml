name: Cart Checkout Redirect Gate

# Guards against the cart-checkout → /trip/:id redirect breaking.
#
# Background: the dynamic-links scanner (Suite 5) caught that cart.tsx and
# EnhancedPlanningModal.tsx were navigating to `/trips/${tripId}` (plural —
# no matching route) instead of `/trip/${tripId}` (singular — the real route).
# This gate runs on every PR to ensure the regression cannot reoccur silently.
#
# Jobs:
#   static-redirect-check — pure static analysis (no server, no browser).
#     Verifies the source-code redirect path is correct before any build work.
#     Suites A–C of cart-checkout-redirect.spec.ts:
#       A. cart.tsx must use setLocation(`/trip/${…}`) not `/trips/${…}`
#       B. EnhancedPlanningModal.tsx must use setLocation(`/trip/${…}`)
#       C. App.tsx must declare <Route path="/trip/:id">
#
#   e2e-cart-redirect — full browser + API end-to-end test.
#     Starts a local dev server, registers a fresh user via API, adds a
#     cart item, calls convert-to-itinerary, navigates the browser to the
#     returned /trip/:id URL, and asserts the trip page renders (not 404).
#     Suite D of cart-checkout-redirect.spec.ts.
#
# Status contexts (for branch-protection required checks):
#   * static-redirect-check — fast static gate; safe to mark REQUIRED.
#   * e2e-cart-redirect      — browser gate; safe to mark REQUIRED.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cart-checkout-redirect-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # static-redirect-check: pure static analysis — suites A, B, C.
  #
  # No browser, no server, no database required.
  # Verifies source code uses /trip/:id (not /trips/:id) and App.tsx
  # declares the matching route. Typically completes in under 30 seconds.
  # ─────────────────────────────────────────────────────────────────────────
  static-redirect-check:
    name: static-redirect-check (source analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Assert spec file exists (cart-checkout-redirect)
        run: |
          if [ ! -f "playwright/tests/cart-checkout-redirect.spec.ts" ]; then
            echo "::error::Spec file not found: playwright/tests/cart-checkout-redirect.spec.ts — rename or restore it before re-running this gate."
            exit 1
          fi
          echo "Spec file present ✅"

      - name: Cart redirect static analysis (suites A–C)
        # Scans cart.tsx, EnhancedPlanningModal.tsx, and App.tsx to verify:
        #   A. cart.tsx uses /trip/${…} not /trips/${…}
        #   B. EnhancedPlanningModal.tsx uses /trip/${…} not /trips/${…}
        #   C. App.tsx has <Route path="/trip/:id">
        # --grep "singular|declares" matches tests A and B ("singular" in title)
        # and test C ("declares" in title) while excluding the browser test D.
        # No browser or server needed — purely static source-file analysis.
        run: npx playwright test cart-checkout-redirect --grep "singular|declares"
        env:
          CI: 'true'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cart-redirect-static-report
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # e2e-cart-redirect: browser + API end-to-end test — suite D.
  #
  # Starts the dev server, runs the full happy path:
  #   register → add cart item → convert-to-itinerary → navigate /trip/:id
  #   → assert trip page renders, not 404.
  # ─────────────────────────────────────────────────────────────────────────
  e2e-cart-redirect:
    name: e2e-cart-redirect (browser gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Start dev server
        run: npx tsx server/index.ts &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: development
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a tsx || true
          exit 1

      - name: Cart redirect browser test (all suites A–D)
        # Runs all four tests in the spec:
        #   A. cart.tsx uses /trip/${…} (singular)
        #   B. EnhancedPlanningModal.tsx uses /trip/${…} (singular)
        #   C. App.tsx declares <Route path="/trip/:id">
        #   D. Happy path: register → add cart item → convert-to-itinerary →
        #      navigate to /trip/:id → assert trip page renders, not 404.
        run: npx playwright test cart-checkout-redirect --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cart-redirect-e2e-report
          path: playwright-report/
          retention-days: 14

  report:
    name: report (PR comment)
    runs-on: ubuntu-latest
    needs: [static-redirect-check, e2e-cart-redirect]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## Cart Checkout Redirect Gate — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl})`,
              '',
              '> **static-redirect-check**: verifies `cart.tsx` and `EnhancedPlanningModal.tsx` use `/trip/${id}` (singular), and `App.tsx` declares `<Route path="/trip/:id">`. No server or browser needed.',
              '> **e2e-cart-redirect**: registers a user, adds a cart item, calls `convert-to-itinerary`, navigates the browser to the returned `/trip/:id` URL, and asserts the trip page renders instead of the 404 page.',
              allGreen ? '' : '> A red gate means the cart checkout redirect is broken — navigating after purchase would land on a 404 instead of the trip page.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
