name: Authenticated Route Coverage Gate

# Guards against crashes that only surface when a real logged-in user visits a
# role-gated page and the component receives actual API data.
#
# The unauthenticated navbar-links gate cannot catch these bugs because
# auth-gated routes redirect to "/" before any data loads. This workflow fixes
# that blind spot by running the same 404 / content / crash checks with a valid
# session cookie for each platform role.
#
# Jobs in this workflow:
#
#   setup (build + browser cache warm-up):
#
#     Runs immediately on push/PR. Installs deps, populates the Playwright
#     browser cache, and builds the production bundle. Both outputs are saved
#     via actions/cache so auth-routes-smoke can restore them without repeating
#     the work. On a cache hit (same lock-file and source hash) this job
#     completes in under 60 seconds.
#
#   auth-routes-smoke (Playwright DOM gate):
#
#     Depends on `setup` so both browser binaries and the production bundle are
#     guaranteed to be in cache before this job starts. The job restores them,
#     skips the expensive install/build, seeds CI test users, starts the server,
#     and runs auth-routes.spec.ts with real session cookies for each platform
#     role (travel_expert, service_provider, executive_assistant, admin).
#
# Route source of truth: client/src/lib/role-routes-config.ts
#   expertRoutesConfig / providerRoutesConfig / adminRoutesConfig / eaRoutesConfig
#   Adding a new route to those arrays automatically registers it in auth-routes.spec.ts.
#   No manual edits to that spec are needed when routes are added.
#
# Status context (for branch-protection required checks):
#   * auth-routes-smoke — safe to mark as a REQUIRED branch-protection check,
#                         independently of navbar-links-smoke and app-routes-smoke.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to avoid redundant gate checks.
concurrency:
  group: auth-routes-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # setup: pre-warm Playwright browser cache + production build cache.
  #
  # No PostgreSQL service needed — this job only builds the bundle and
  # installs browser binaries. auth-routes-smoke depends on this job and
  # restores both caches, so it never has to re-install browsers or re-build
  # the bundle — even on retries.
  # ─────────────────────────────────────────────────────────────────────────
  setup:
    name: setup (build + browser cache warm-up)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium + system deps)
        # Full --with-deps install only on a cache miss; subsequent runs
        # (including auth-routes-smoke) restore the browser binaries from
        # cache and only need install-deps (which is fast, ~10 s).
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Cache production build output
        uses: actions/cache@v4
        id: build-cache
        with:
          path: dist/
          key: build-${{ runner.os }}-${{ hashFiles('client/**', 'server/**', 'shared/**', 'package-lock.json') }}

      - name: Build production bundle
        # Skipped on a cache hit — dist/ is fully restored from the cache
        # entry saved by a previous run with the same source hash.
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # auth-routes-smoke: Playwright DOM gate with real session cookies.
  #
  # Depends on `setup` so both the browser binaries and the production bundle
  # are guaranteed to be in the cache before this job starts. The job restores
  # them, skips the expensive install/build, and goes straight to seeding CI
  # users and running the authenticated-route checks.
  # ─────────────────────────────────────────────────────────────────────────
  auth-routes-smoke:
    name: auth-routes-smoke (Playwright DOM gate)
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Restore Playwright browser cache
        # The setup job already populated this cache entry; this step should
        # always be a hit, making browser availability near-instant.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system deps
        # Browser binaries come from the restored cache; only the OS-level
        # system dependencies (shared libs, fonts, etc.) need to be installed.
        # This is always fast (~10 s) compared to the full --with-deps install.
        run: npx playwright install-deps chromium

      - name: Restore production build cache
        # The setup job built and cached dist/; this restores it so no
        # re-compilation is needed even on job retries.
        uses: actions/cache@v4
        with:
          path: dist/
          key: build-${{ runner.os }}-${{ hashFiles('client/**', 'server/**', 'shared/**', 'package-lock.json') }}

      - name: Set up CI database (migrations, sessions table, test users)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'true'

      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          PORT: 5000
          # The session cookie is `secure` under NODE_ENV=production, but this
          # gate drives the server over plain-http localhost, where a secure
          # cookie is never replayed (globalSetup logs in, but the stored session
          # can't be reused → authenticated=false). Opt out of secure cookies for
          # this test-only server. NEVER set this in production.
          SESSION_COOKIE_INSECURE: '1'
          # The smoke visits ~75 role-gated pages in a few minutes from one
          # loopback IP; the general /api limiter (100 req/min/IP) 429s late
          # pages, blanking data-driven ones. Exempt loopback for this
          # test-only server. NEVER set this in production.
          RATE_LIMIT_LOOPBACK_SKIP: '1'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1

      - name: Assert spec file exists (auth-routes)
        run: |
          if [ ! -f "playwright/tests/auth-routes.spec.ts" ]; then
            echo "::error::Spec file not found: playwright/tests/auth-routes.spec.ts — rename or restore it before re-running this gate."
            exit 1
          fi
          echo "Spec file present ✅"

      - name: Authenticated routes smoke (expert / provider / EA / admin)
        # Runs auth-routes.spec.ts with real session cookies for each platform role.
        # globalSetup (playwright/global-setup.ts) logs in via /api/auth/login using
        # the CI test accounts seeded above, then saves per-role storage states.
        # The spec then visits /expert/*, /provider/*, /admin/* routes with the
        # matching auth context and fails if any page throws a JS error or crashes.
        # Route source of truth: client/src/lib/role-routes-config.ts
        run: npx playwright test auth-routes --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'
          # Enable globalSetup (auth-state creation) — this workflow seeds the
          # ci-* users above, so login will succeed.
          PW_AUTH_SETUP: '1'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-routes-report
          path: playwright-report/
          retention-days: 14

  report:
    name: report (PR comment)
    runs-on: ubuntu-latest
    needs: [auth-routes-smoke]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## Authenticated Route Coverage Gate — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl})`,
              '',
              '> Visits every role-gated route in `client/src/lib/role-routes-config.ts` with real session cookies',
              '> for each platform role (travel_expert, service_provider, executive_assistant, admin).',
              '> A red gate means at least one authenticated route renders the 404 (NotFound) page,',
              '> a blank/empty page with no heading or `<main>` content, or throws an unhandled JS error.',
              allGreen ? '' : '> Fix: ensure the failing page component renders real content when a real API response is received.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
