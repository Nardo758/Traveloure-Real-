name: Authenticated Route Coverage Gate

# Guards against crashes that only surface when a real logged-in user visits a
# role-gated page and the component receives actual API data.
#
# The unauthenticated navbar-links gate cannot catch these bugs because
# auth-gated routes redirect to "/" before any data loads. This workflow fixes
# that blind spot by running the same 404 / content / crash checks with a valid
# session cookie for each platform role.
#
# Route source of truth: client/src/lib/role-routes-config.ts
#   expertRoutesConfig / providerRoutesConfig / adminRoutesConfig / eaRoutesConfig
#   Adding a new route to those arrays automatically registers it in auth-routes.spec.ts.
#   No manual edits to that spec are needed when routes are added.
#
# Status context (for branch-protection required checks):
#   * auth-routes-smoke — safe to mark as a REQUIRED branch-protection check,
#                         independently of navbar-links-smoke and app-routes-smoke.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to avoid redundant gate checks.
concurrency:
  group: auth-routes-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  auth-routes-smoke:
    name: auth-routes-smoke (Playwright DOM gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Apply database migrations
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Create sessions table (connect-pg-simple workaround)
        # connect-pg-simple 10.0.0 table.sql uses WITH (OIDS=FALSE) which is
        # incompatible with Postgres 12+. Pre-create the table here.
        run: npx tsx scripts/create-sessions-table.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Seed CI test users
        # Creates ci-expert@traveloure.test (travel_expert), ci-provider@traveloure.test
        # (service_provider), and ci-admin@traveloure.test (admin) with hashed passwords
        # so the authenticated Playwright gate can log in via email/password auth.
        # Idempotent — safe to re-run (ON CONFLICT DO UPDATE).
        run: npx tsx scripts/seed-ci-test-users.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Build production bundle
        # Serve a PRODUCTION build so Vite HMR WebSocket noise is absent.
        # Startup seeding still runs (gated on ENVIRONMENT !== "PROD", not
        # NODE_ENV), so /api/ready flips true as expected.
        run: npm run build

      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1

      - name: Authenticated routes smoke (expert / provider / EA / admin)
        # Runs auth-routes.spec.ts with real session cookies for each platform role.
        # globalSetup (playwright/global-setup.ts) logs in via /api/auth/login using
        # the CI test accounts seeded above, then saves per-role storage states.
        # The spec then visits /expert/*, /provider/*, /admin/* routes with the
        # matching auth context and fails if any page throws a JS error or crashes.
        # Route source of truth: client/src/lib/role-routes-config.ts
        run: npx playwright test auth-routes --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-routes-report
          path: playwright-report/
          retention-days: 14

  report:
    name: report (PR comment)
    runs-on: ubuntu-latest
    needs: [auth-routes-smoke]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## Authenticated Route Coverage Gate — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl})`,
              '',
              '> Visits every role-gated route in `client/src/lib/role-routes-config.ts` with real session cookies',
              '> for each platform role (travel_expert, service_provider, executive_assistant, admin).',
              '> A red gate means at least one authenticated route renders the 404 (NotFound) page,',
              '> a blank/empty page with no heading or `<main>` content, or throws an unhandled JS error.',
              allGreen ? '' : '> Fix: ensure the failing page component renders real content when a real API response is received.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
