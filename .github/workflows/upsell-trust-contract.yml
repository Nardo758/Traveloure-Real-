name: Upsell Trust Contract

# The relevance-dominance guarantee — "revenue can never reorder two candidates
# across a relevance band" — is the upsell engine's core trust contract. It is
# verified as a pure-function unit test (server/services/__tests__/
# upsell-engine.test.ts), which sweeps 100+ (gap, revenue, policy) combinations
# against blendScore/holdsDominance directly. This gate makes that test actually
# guard the build: it was silently un-run for the whole engine's life (a stale
# import — resolveTemplateKey imported from routes/upsell.routes instead of
# services/upsell-query.service — made the file fail to load, and no workflow
# invoked it).
#
# No Postgres service: the suite never queries the DB. It needs DATABASE_URL set
# only because server/db.ts throws at module load if it is unset (the Pool
# connects lazily and is never used here), so a dummy DSN suffices.

# Status context (for branch-protection required checks):
#   * relevance-dominance (pure unit) — safe to mark as a REQUIRED branch-protection check.
#     Pure function, zero DB, zero browser. Zero flakiness risk. The dummy DATABASE_URL
#     satisfies db.ts's load-time guard; no actual connection is made.

on:
  # Merge queue (ledger `2026-10-18-merge-queue-triggers`): the queue's run is always a full run.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs. A new push to a PR makes the previous run's jobs
# dead work that still holds runner slots, so the new run queues behind its own
# predecessor. cancel-in-progress is scoped to `pull_request` ONLY: a push to
# main must keep its run, because a cancelled main run leaves a merged commit
# with no green record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

jobs:
  # CI-1b (c)+(d) (scripts/ci/ci-skip-rules.cjs): decides whether this PR push runs the heavy jobs. A draft or
  # a docs-only / other-workflow-only push skips them; a job skipped by its `if:` reports success, so every
  # required check still reports on the merge head. Only an explicit run=false skips: any other event, a file
  # list it cannot read, or this job failing outright leaves the suites running (fail open).
  changes:
    name: changes (skip suites on drafts and docs-only pushes)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          sparse-checkout: scripts/ci
      - name: Skip rules self-test
        run: node scripts/ci/ci-skip-rules.cjs --self-test
      - id: decide
        name: Decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node scripts/ci/ci-skip-rules.cjs --decide

  upsell-trust-contract:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    name: relevance-dominance (pure unit)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run relevance-dominance contract test
        run: npm run test:upsell-contract
        env:
          # Dummy DSN — satisfies db.ts's load-time guard; no connection is made.
          DATABASE_URL: postgresql://ci-noconnect@127.0.0.1:1/nodb
