name: Automation Registry Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    # CI-1b (c): docs-only and other-workflow-only changes do not trigger this workflow
    # (scripts/ci/ci-skip-rules.cjs canonicalPaths; later entries win).
    paths:
      - '**'
      - '!**/*.md'
      - 'CLAUDE.md'
      - 'generated/**'
      - 'client/public/.well-known/**'
      - '!.github/workflows/**'
      - '.github/workflows/automation-registry-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

# CI-1b (b): a new push to the same PR cancels that PR's run still in progress. Schedule, dispatch and
# main runs are never cancelled (the build.yml pattern).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

jobs:
  registry:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      NODE_ENV: test
      # No database service and no credentials: adapter tests bind stubbed actions.
      # An accidental database call must fail instead of reaching a live database.
      DATABASE_URL: postgresql://ci-noconnect@127.0.0.1:1/nodb
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Validate all domain IDs and cancellation references without executing actions
        run: npx tsx scripts/check-automation-registry.ts
      - name: Verify registry dispatch, scheduling, and fail-closed contracts
        # Literal globs (not a find/mapfile list) so scripts/check-test-files-wired.cjs can see these
        # files are run. Both depths that hold tests today are named; a deeper directory must be added here.
        run: npx tsx --test --test-concurrency=1 server/automations/__tests__/*.test.ts server/automations/*/__tests__/*.test.ts