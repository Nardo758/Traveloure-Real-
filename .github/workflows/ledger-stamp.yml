name: Ledger Stamp

# CI-1 Phase 1 — POST-MERGE R-NUMBER STAMPING (decision-maker rulings, Oct 12, 2026; ledger
# `2026-10-12-ci1-post-merge-stamp`; one file per ruling, `2026-10-21-ledger-one-file`).
# PRs merge with each new row still `R?` in its own `docs/decisions/pending/<id>.md`. After each
# merge to main that touches docs/decisions/, this job:
#   1. numbers every pending file and moves it to docs/decisions/<seq>-<id>.md
#      (scripts/assign-r-numbers.cjs --stamp), appending `; merged <sha7>` to its citation cell
#      and replacing `R?` on CLAUDE.md lines naming its slug;
#   2. refuses to commit anything outside docs/decisions/ and CLAUDE.md;
#   3. runs the ledger lint with --require-assigned and stamps ONLY if it passes;
#   4. pushes a docs-only `[skip ci]` commit as the Ledger Stamp GitHub App — the ruleset's sole bypass
#      actor — so the stamp triggers no gates and needs no merge-main push.
# On a lint failure nothing is pushed and an issue is opened with the lint output.
#
# Credentials (names only): repository variable LEDGER_STAMP_APP_ID and the `ledger-stamp` ENVIRONMENT
# secret LEDGER_STAMP_APP_PRIVATE_KEY (no repository-level copy). Until they exist, a merge with no `R?` rows is a no-op (green), and a
# merge carrying `R?` rows fails red with an issue — the same signal the old `--require-assigned`
# step on main gave.
#
# Status context: NOT a required check. It runs after the merge, on main.

on:
  push:
    branches: [main]
    paths:
      - 'docs/decisions/**'
  workflow_dispatch:
    inputs:
      auth_dry_run:
        description: "Only mint the Ledger Stamp App token and read the repository with it; stamp and push nothing."
        type: boolean
        default: false

# One stamp at a time: two merges in quick succession are numbered in the order their runs start,
# each run re-reading main, so a second run finds nothing left to number.
concurrency:
  group: ledger-stamp
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ledger-stamp:
    name: ledger-stamp (post-merge R-number)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    # The App's private key lives in this environment (branch-limited to main), not at repository level.
    environment: ledger-stamp
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          ref: main
          fetch-depth: 500
          persist-credentials: false

      - name: Anything to number?
        id: probe
        if: ${{ !inputs.auth_dry_run }}
        run: |
          set -euo pipefail
          node scripts/assign-r-numbers.cjs --self-test
          if node scripts/check-decision-guards.cjs --require-assigned > /tmp/lint-before.txt 2>&1; then
            echo "No R? rows on main — nothing to stamp."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            if grep -q "Unassigned R-number" /tmp/lint-before.txt; then
              echo "needed=true" >> "$GITHUB_OUTPUT"
            else
              # The ledger is broken for a reason the stamp cannot fix: report it, stamp nothing.
              cat /tmp/lint-before.txt
              echo "needed=lint" >> "$GITHUB_OUTPUT"
            fi
          fi

      # The key is normalized before minting (a pasted value can carry \r line endings or literal "\n"
      # sequences, either of which fails the parse with "Invalid keyData"), every line is masked, and it is
      # handed to the mint step as a step output. Diagnostics describe its SHAPE only — never its contents.
      - name: Prepare the App key
        id: key
        if: (steps.probe.outputs.needed == 'true' || inputs.auth_dry_run) && vars.LEDGER_STAMP_APP_ID != ''
        env:
          RAW_KEY: ${{ secrets.LEDGER_STAMP_APP_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.auth_dry_run }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, secrets as rnd
          raw = os.environ.get("RAW_KEY", "")
          had_cr = "\r" in raw
          had_literal_nl = "\\n" in raw
          key = raw.replace("\r", "").replace("\\n", "\n").strip()
          lines = [l.strip() for l in key.split("\n") if l.strip()]
          key = "\n".join(lines) + "\n" if lines else ""
          for l in lines:
              print(f"::add-mask::{l}")
          # Which secret the job resolved: this job declares environment `ledger-stamp`, and an environment
          # secret takes precedence over a repository secret of the same name. A value whose length is far from
          # a PEM key's (~1.6-3.3k) is the sign of a shadowing or wrong value (a fingerprint is ~50).
          print("environment declared on this job: ledger-stamp")
          print(f"LEDGER_STAMP_APP_PRIVATE_KEY resolved: {'present' if raw else 'EMPTY'}, raw length {len(raw)}")
          if os.environ.get("DRY_RUN") == "true":
              begin = bool(lines) and lines[0].startswith("-----BEGIN ") and lines[0].endswith("PRIVATE KEY-----")
              end = bool(lines) and lines[-1].startswith("-----END ") and lines[-1].endswith("PRIVATE KEY-----")
              print("key shape (no contents): "
                    f"lines={len(lines)}, \\r present={'y' if had_cr else 'n'}, literal \\n present={'y' if had_literal_nl else 'n'}, "
                    f"first line is BEGIN marker={'y' if begin else 'n'}, last line is END marker={'y' if end else 'n'}, "
                    f"normalized length={len(key)}")
          delim = "KEY_" + rnd.token_hex(16)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"key<<{delim}\n{key}{delim}\n")
          PY

      - name: Mint the Ledger Stamp App token
        id: app
        if: (steps.probe.outputs.needed == 'true' || inputs.auth_dry_run) && vars.LEDGER_STAMP_APP_ID != ''
        uses: actions/create-github-app-token@v3.3.0
        with:
          # v3 deprecates app-id in favour of client-id; the App ID variable is what this repo holds, and it still works.
          app-id: ${{ vars.LEDGER_STAMP_APP_ID }}
          private-key: ${{ steps.key.outputs.key }}
          # The stamp needs exactly this: push one commit to main. Nothing else is granted to the token.
          permission-contents: write

      # The push must authenticate as the Ledger Stamp App and nothing else (GH013 "Changes must be made through a
      # pull request" on run 38648786691 means the ruleset did not see the App). Checkout persists no credentials;
      # this step also removes every other way git could supply one — an http extraheader, a credential helper, a
      # url.insteadOf rewrite — and points origin at the App's installation token. It then prints what git would
      # use, by NAME only, and fails if anything other than the App token remains.
      - name: Pin git to the App token
        id: gitauth
        if: steps.app.outputs.token != ''
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for v in $(compgen -e | grep '^GIT_CONFIG_' || true); do unset "$v"; done  # no env-injected git config
          for scope in --local --global; do
            git config $scope --get-regexp '^http\..*\.extraheader$' | awk '{print $1}' | while read -r k; do git config $scope --unset-all "$k"; done || true
            git config $scope --get-regexp '^url\..*\.insteadof$' | awk '{print $1}' | while read -r k; do git config $scope --unset-all "$k"; done || true
            git config $scope --unset-all credential.helper || true
          done
          git config --local credential.helper ""
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
          LEFT=$(git config --show-origin --get-regexp '^(http\..*\.extraheader|url\..*\.insteadof)$' | awk '{print $2}' || true)
          if [ -n "$LEFT" ]; then
            echo "::error::git still carries another credential source: $LEFT"
            exit 1
          fi
          echo "git credential sources: none but origin's App installation token (credential.helper empty, no extraheader, no insteadOf)."

      - name: App auth dry run (read only)
        if: ${{ inputs.auth_dry_run }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for v in $(compgen -e | grep '^GIT_CONFIG_' || true); do unset "$v"; done  # no env-injected git config
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::error::No App token: LEDGER_STAMP_APP_ID (variable) or LEDGER_STAMP_APP_PRIVATE_KEY (ledger-stamp environment secret) is missing."
            exit 1
          fi
          echo "Minted an installation token for ${APP_SLUG}."
          curl -fsS -H "Authorization: Bearer $APP_TOKEN" "https://api.github.com/installation/repositories" \
            | jq -r '"installation repositories (\(.total_count)): " + ([.repositories[].full_name] | join(", "))'
          # Identity: the token's own permissions on this repo, as GitHub reports them for this installation.
          curl -fsS -H "Authorization: Bearer $APP_TOKEN" "https://api.github.com/repos/${REPO}" \
            | jq -r '"read repo: " + .full_name + " (default branch " + .default_branch + "); token can push: " + (.permissions.push | tostring)'
          # The pusher identity is the App's bot user; a push from this job authenticates as it and nothing else.
          BOT=$(curl -fsS "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | jq -r '.login + " (id " + (.id|tostring) + ")"')
          echo "pusher identity: ${BOT}"
          # git reads main through origin, which the step above pinned to the App token.
          git ls-remote origin refs/heads/main | sed 's/^/git read via origin: /'
          [ "$(git remote get-url origin | sed -E 's#https://x-access-token:[^@]+@#https://x-access-token:***@#')" = "https://x-access-token:***@github.com/${REPO}.git" ] \
            || { echo "::error::origin is not the App-token URL"; exit 1; }
          echo "origin: https://x-access-token:***@github.com/${REPO}.git (App installation token)"
          echo "Dry run only: nothing stamped, nothing pushed."

      - name: Stamp, lint, push
        id: stamp
        if: steps.probe.outputs.needed == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
          MERGED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          for v in $(compgen -e | grep '^GIT_CONFIG_' || true); do unset "$v"; done  # no env-injected git config
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::error::Main carries R? rows but the Ledger Stamp App is not configured (repository variable LEDGER_STAMP_APP_ID / ledger-stamp environment secret LEDGER_STAMP_APP_PRIVATE_KEY)."
            exit 1
          fi
          APP_USER_ID=$(curl -fsS -H "Authorization: Bearer $APP_TOKEN" "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | jq -r .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          # origin was pinned to the App token by "Pin git to the App token"; REMOTE is that same URL.
          REMOTE="https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"
          [ "$(git remote get-url origin)" = "$REMOTE" ] || { echo "::error::origin is not the App-token URL — refusing to push"; exit 1; }

          # A merge can land between our read and our push. Re-read main and re-stamp (idempotent) on
          # a rejected push; three tries, then fail red.
          for attempt in 1 2 3; do
            git fetch -q "$REMOTE" main
            git reset -q --hard FETCH_HEAD
            node scripts/assign-r-numbers.cjs --stamp | tee /tmp/stamp.txt
            # Untracked seq files count: `git diff` does not show them, and `git commit -a` would drop them.
            if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard -- docs/decisions CLAUDE.md)" ]; then
              echo "Nothing left to number (another run stamped it)."
              echo "stamped=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The stamp rewrites decision files (a pending file moves to its seq name) and CLAUDE.md. Nothing else.
            # `git commit -a` does not pick up the new seq file, so stage those paths explicitly.
            git add -A -- docs/decisions CLAUDE.md
            OUTSIDE=$(
              { git diff --cached --name-only; git diff --name-only; } \
                | grep -v -x -e 'CLAUDE.md' \
                | grep -v -E '^docs/decisions/' \
                | grep -v '^$' || true
            )
            if [ -n "$OUTSIDE" ]; then
              echo "::error::The stamp changed files outside docs/decisions/ and CLAUDE.md: $OUTSIDE"
              exit 1
            fi
            if ! node scripts/check-decision-guards.cjs --require-assigned > /tmp/lint-after.txt 2>&1; then
              cat /tmp/lint-after.txt
              echo "::error::Ledger lint failed after stamping — nothing pushed."
              exit 1
            fi
            NUMBERS=$(grep -E '^R[0-9]+ ' /tmp/stamp.txt | tr '\n' ' ' | sed 's/  */ /g; s/ $//')
            git commit -q -m "ledger: stamp ${NUMBERS} [skip ci]"
            if git push -q "$REMOTE" HEAD:main; then
              echo "stamped=${NUMBERS}" >> "$GITHUB_OUTPUT"
              {
                echo "### Ledger stamp"
                echo "- stamped: ${NUMBERS}"
                echo "- stamp commit: $(git rev-parse --short HEAD)"
                echo "- merge pushed at: ${MERGED_AT:-unknown}; stamp pushed at: $(date -u +%Y-%m-%dT%H:%M:%SZ); attempt ${attempt}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (main moved) — re-reading main, attempt $((attempt + 1))."
          done
          echo "::error::Could not push the stamp after 3 attempts."
          exit 1

      - name: Report a ledger the stamp cannot fix
        if: steps.probe.outputs.needed == 'lint'
        run: exit 1

      - name: Open an issue (nothing was stamped)
        if: failure() && !inputs.auth_dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "The post-merge ledger stamp did not stamp main at \`${SHA:0:9}\`. Nothing was pushed."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo '```'
            cat /tmp/lint-after.txt /tmp/lint-before.txt 2>/dev/null | tail -40 || true
            echo '```'
          } > /tmp/issue.md
          gh issue create --repo "$REPO" --title "Ledger stamp failed at ${SHA:0:9}" --body-file /tmp/issue.md
