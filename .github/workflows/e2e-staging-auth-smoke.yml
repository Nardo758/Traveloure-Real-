name: E2E Staging Auth Smoke

# AUTH-DEPENDENT smoke — runs against STAGING, never production.
#
# WHY STAGING EXISTS
# ──────────────────
# Production PURGES every @traveloure.test account on boot (the PR #319 P0
# security fix). That is correct and is enforced at grep level by
# scripts/check-env-allowlist.cjs. Consequence: a suite that logs in a seeded
# account can NEVER pass against production — the old e2e-deploy-smoke died in
# e2e/global-setup.ts with a 401 before a single test ran, on every PR, for
# weeks. Rather than weaken the purge, auth-dependent smoke targets a STAGING
# deploy that opts in to the seeded accounts. Provisioning that deploy is the
# OWNER's action, not CI's — the exact steps are in docs/STAGING.md.
#
# This workflow NEVER sets the opt-in env var itself: doing so from a
# deploy-targeting workflow is precisely the leak check-env-allowlist.cjs
# fails on. The opt-in lives on the Replit staging deployment's own env.
#
# BEHAVIOUR WHEN STAGING IS NOT CONFIGURED
# ────────────────────────────────────────
# The smoke job is SKIPPED (grey, not green) and the final check is renamed to
# "STAGING NOT CONFIGURED — auth smoke DID NOT RUN", with a run-summary banner
# and a warning annotation. A not-configured run must never be mistakable for a
# passing run. There is deliberately NO continue-on-error anywhere in this file:
# once staging IS configured, a failure is a real failure and stays red.
#
# NON-BLOCKING BY DESIGN: do NOT add to branch-protection required checks until
# it has had a green run against a provisioned staging deploy.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    # CI-1b (c): docs-only and other-workflow-only changes do not trigger this workflow
    # (scripts/ci/ci-skip-rules.cjs canonicalPaths; later entries win).
    paths:
      - '**'
      - '!**/*.md'
      - 'CLAUDE.md'
      - 'generated/**'
      - 'client/public/.well-known/**'
      - '!.github/workflows/**'
      - '.github/workflows/e2e-staging-auth-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs. A new push to a PR makes the previous run's jobs
# dead work that still holds runner slots, so the new run queues behind its own
# predecessor. cancel-in-progress is scoped to `pull_request` ONLY: a push to
# main must keep its run, because a cancelled main run leaves a merged commit
# with no green record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

jobs:
  # ── Gate: does a staging target exist? ──────────────────────────────────────
  # secrets.* are unavailable in `if:` conditions, so map to job env and publish
  # the answer as an output the smoke job gates on.
  config:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: staging config probe
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    outputs:
      configured: ${{ steps.guard.outputs.run }}
    env:
      E2E_STAGING_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
    steps:
      - name: Check staging secrets (report loudly when absent)
        id: guard
        run: |
          if [ -z "$E2E_STAGING_BASE_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Auth smoke did not run::E2E_STAGING_BASE_URL is not configured — the auth-dependent smoke DID NOT RUN. This is not a pass."
            {
              echo "## ⛔ STAGING NOT CONFIGURED — auth smoke DID NOT RUN"
              echo
              echo "\`E2E_STAGING_BASE_URL\` is not set, so **zero** authenticated checks executed."
              echo "**This is not a passing result — nothing was verified.**"
              echo
              echo "Auth-dependent smoke cannot run against production: production purges the seeded"
              echo "\`@traveloure.test\` accounts on every boot (PR #319 P0 fix), so login correctly 401s."
              echo "It needs a staging deploy that opts in to the seeded accounts."
              echo
              echo "**Owner action required — see \`docs/STAGING.md\`:** provision the staging deployment,"
              echo "then add the repository secret \`E2E_STAGING_BASE_URL\` (HTTPS staging URL)"
              echo "and, if staging uses a non-default seed password, \`E2E_STAGING_TEST_PASSWORD\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Staging target configured — running the auth-dependent smoke."
          fi

  auth-smoke:
    name: auth smoke (staging; non-blocking)
    needs: config
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.config.outputs.configured == 'true') }}
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    env:
      E2E_STAGING_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      # Launch item 12: the staging box's basic auth (server/middleware/staging-access.ts); empty ⇒ not sent.
      E2E_STAGING_BASIC_AUTH_USER: ${{ secrets.E2E_STAGING_BASIC_AUTH_USER }}
      E2E_STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.E2E_STAGING_BASIC_AUTH_PASSWORD }}
      # Staging may carry its own seed password so it can be rotated without
      # touching the existing E2E_TEST_PASSWORD secret; it falls back to that
      # one. If BOTH are absent the value is the empty string, and both the
      # probe below and e2e/fixtures/accounts.ts fall back to the same
      # documented dev default (TestPass123!).
      E2E_TEST_PASSWORD: ${{ secrets.E2E_STAGING_TEST_PASSWORD || secrets.E2E_TEST_PASSWORD }}
      # Presence flag only (yes/no in the preflight log) — never the value.
      E2E_STAGING_TEST_PASSWORD_SET: ${{ secrets.E2E_STAGING_TEST_PASSWORD != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Preflight: staging must actually accept a seeded account ────────────
      # This is the INVERSE of the old production probe. There, a 401 meant "the
      # purge is working" and the run was skipped. Here, a 401 means STAGING IS
      # MISPROVISIONED — the deploy is not carrying the test-account opt-in, or
      # the password does not match its seed — and that is a real, actionable
      # failure. Skipping on it would recreate the exact silent-noise problem
      # this split exists to remove.
      - name: Preflight — staging accepts the seeded traveler
        run: |
          PW="${E2E_TEST_PASSWORD:-TestPass123!}"
          EMAIL="test-traveler-kyoto@traveloure.test"
          BODY=$(node -e 'process.stdout.write(JSON.stringify({email:process.argv[1],password:process.argv[2]}))' "$EMAIL" "$PW")
          AUTH=()
          if [ -n "$E2E_STAGING_BASIC_AUTH_USER" ] && [ -n "$E2E_STAGING_BASIC_AUTH_PASSWORD" ]; then AUTH=(-u "$E2E_STAGING_BASIC_AUTH_USER:$E2E_STAGING_BASIC_AUTH_PASSWORD"); fi
          # Which secrets are SET (yes/no only — never a value, never the -u argument, never the body).
          if [ -n "${E2E_STAGING_TEST_PASSWORD_SET:-}" ]; then echo "E2E_STAGING_TEST_PASSWORD secret: set (yes)"; else echo "E2E_STAGING_TEST_PASSWORD secret: not set (no) — the step falls back to E2E_TEST_PASSWORD, then the seed default"; fi
          if [ "${#AUTH[@]}" -gt 0 ]; then echo "basic-auth credentials: sent (yes)"; else echo "basic-auth credentials: not sent (no)"; fi
          # Two 401s look the same as a status code and mean different things: the staging GATE refusing the
          # CI basic-auth pair (WWW-Authenticate: Basic, text/plain "Authentication required."), or the APP
          # refusing the seeded traveler's password (JSON {"message":"Invalid email or password"}). The
          # response is captured — status, Content-Type, whether WWW-Authenticate is present, and the first
          # 200 bytes of the body (one of those two sentences; never a secret) — so the error names the cause.
          HDRS="$RUNNER_TEMP/preflight-headers.txt"
          BODYOUT="$RUNNER_TEMP/preflight-body.txt"
          code=$(curl -s -o "$BODYOUT" -D "$HDRS" -w "%{http_code}" --max-time 60 "${AUTH[@]}" \
            -X POST "$E2E_STAGING_BASE_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$BODY") || code=000
          ctype=$(grep -i '^content-type:' "$HDRS" 2>/dev/null | tail -1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//')
          if grep -qi '^www-authenticate:' "$HDRS" 2>/dev/null; then wwwauth=present; else wwwauth=absent; fi
          if grep -qi '^www-authenticate: *basic' "$HDRS" 2>/dev/null; then wwwbasic=yes; else wwwbasic=no; fi
          body200=$(head -c 200 "$BODYOUT" 2>/dev/null | tr -d '\r\n')
          echo "POST /api/auth/login -> $code; Content-Type: ${ctype:-<none>}; WWW-Authenticate: $wwwauth; body[0:200]: ${body200:-<empty>}"
          if [ "$code" = "200" ]; then
            echo "Staging accepts the seeded traveler — proceeding."
            exit 0
          fi
          {
            echo "## ❌ Staging preflight failed (HTTP $code)"
            echo
            echo "\`POST /api/auth/login\` for \`$EMAIL\` returned **$code** against the configured staging URL."
            echo
            echo "- Content-Type: \`${ctype:-<none>}\`"
            echo "- WWW-Authenticate: $wwwauth"
            echo "- body (first 200 bytes): \`${body200:-<empty>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "401" ]; then
            case "$ctype" in application/json*) isjson=yes ;; *) isjson=no ;; esac
            if [ "$wwwbasic" = "yes" ] || { [ "$isjson" = "no" ] && printf '%s' "$ctype" | grep -qi '^text/plain'; }; then
              echo "::error title=Staging gate rejected CI credentials::E2E_STAGING_BASIC_AUTH_USER/PASSWORD do not match staging's STAGING_BASIC_AUTH_USER/PASSWORD. The 401 came from the staging basic-auth gate (WWW-Authenticate: Basic / text/plain), before the app saw the login. See docs/STAGING.md §6.1."
            elif [ "$isjson" = "yes" ]; then
              echo "::error title=Seeded password mismatch::The password secret does not match the password staging seeded test-traveler-kyoto with (the seed never rewrites an existing account's password). Set E2E_STAGING_TEST_PASSWORD to the value staging's E2E_TEST_PASSWORD held when the account was created, or recreate the account. See docs/STAGING.md §6.1."
            else
              echo "::error title=Staging is misprovisioned::401 from staging with neither a Basic challenge nor a JSON body. The seeded @traveloure.test accounts are absent or the password does not match. The staging deployment must carry the test-account opt-in env var and the same seed password. See docs/STAGING.md."
            fi
          elif [ "$code" = "000" ]; then
            echo "::error title=Staging unreachable::Could not reach E2E_STAGING_BASE_URL within 60s. Confirm the staging deployment is running and the secret holds its HTTPS URL. See docs/STAGING.md."
          else
            echo "::error title=Staging preflight failed::Unexpected HTTP $code from the staging login endpoint. See docs/STAGING.md."
          fi
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.e2e.config.ts resolves E2E_STAGING_BASE_URL first, so the
      # auth harness can only ever point at staging from here.
      - name: Run auth smoke (chromium)
        run: npm run test:e2e:staging:smoke

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-auth-smoke-report
          path: playwright-report/
          retention-days: 14

  # ── Final, unmissable verdict ───────────────────────────────────────────────
  # The check NAME itself carries the outcome, so "did not run" can never be
  # mistaken for "passed" when skimming the checks list.
  report:
    name: ${{ needs.config.outputs.configured == 'true' && 'auth smoke verdict (staging)' || 'STAGING NOT CONFIGURED — auth smoke DID NOT RUN' }}
    needs: [config, auth-smoke]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) }}
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - name: Summarize
        run: |
          CONFIGURED='${{ needs.config.outputs.configured }}'
          RESULT='${{ needs.auth-smoke.result }}'
          if [ "$CONFIGURED" != "true" ]; then
            echo "::warning title=Auth smoke did not run::E2E_STAGING_BASE_URL not configured — DID NOT RUN (not a pass)."
            echo "STAGING NOT CONFIGURED — auth smoke DID NOT RUN. Nothing was verified. See docs/STAGING.md."
            exit 0
          fi
          echo "Auth smoke job result: $RESULT"
          {
            echo "## Staging auth smoke: \`$RESULT\`"
            echo
            echo "Target: the staging deploy behind \`E2E_STAGING_BASE_URL\` (seeded test accounts present)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" = "failure" ]; then
            echo "::error title=Staging auth smoke failed::An authenticated journey failed against staging."
            exit 1
          fi
