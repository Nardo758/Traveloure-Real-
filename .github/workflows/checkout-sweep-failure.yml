name: Checkout sweep failure monitoring

on:
  pull_request:
    paths:
      - server/services/checkout-claim.service.ts
      - server/routes/internal.routes.ts
      - server/services/job-heartbeats.service.ts
      - server/services/background-job-runner.ts
      - server/routes/__tests__/checkout-sweep-failure.vitest.ts
      - vitest.checkout-sweep.config.ts
      - .github/workflows/checkout-sweep-failure.yml
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - server/services/checkout-claim.service.ts
      - server/routes/internal.routes.ts
      - server/services/job-heartbeats.service.ts
      - server/services/background-job-runner.ts
      - server/routes/__tests__/checkout-sweep-failure.vitest.ts
      - vitest.checkout-sweep.config.ts
      - .github/workflows/checkout-sweep-failure.yml
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: checkout-sweep-failure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout-sweep-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Real HTTP routes and heartbeat logic; persistence is mocked, no secrets or live jobs.
      - run: npx vitest run --config vitest.checkout-sweep.config.ts