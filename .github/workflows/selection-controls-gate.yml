name: Selection Controls Gate

# Automates the gates for the #462 selection-controls reconcile so they can be
# enforced as required status checks (the manual Replit checklist that PR #21
# jumped). Status contexts:
#   * lockfile-purity            — fails if package-lock.json re-acquires a
#     replit.local URL. Fast; no deps.
#   * verify-selection-controls  — pure, deterministic logic gate (no app/DB).
#     Safe to mark REQUIRED immediately.
#   * e2e-selection-controls     — DOM gate (render/narrow/parity/tab-isolation).
#     Builds and serves the PR artifact locally; runs Playwright against
#     localhost:5000 — never against the shared deployed app. A build-identity
#     step confirms the tested binary matches the PR commit before any assertion.
#   * report                     — posts a pass/fail completion comment on the PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lockfile-purity:
    name: lockfile-purity (no replit.local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if package-lock.json points at the Replit firewall
        run: |
          if grep -n "replit\.local" package-lock.json; then
            echo "::error::package-lock.json contains a replit.local registry URL — re-pollution from the Replit env breaks npm ci on GitHub runners. Fix: sed -i 's#http://package-firewall.replit.local#https://registry.npmjs.org#g' package-lock.json and recommit."
            exit 1
          fi
          echo "lockfile clean (no replit.local) ✅"

  verify-selection-controls:
    name: verify-selection-controls (logic gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Narrowing + parity logic gate (expects 32/32)
        run: npm run verify:selection-controls

  e2e-selection-controls:
    name: e2e-selection-controls (DOM gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Push canonical schema
        # drizzle-kit push --force requires an interactive TTY (throws
        # "Interactive prompts require a TTY terminal" on a bare CI runner).
        # `script -q -c "..." /dev/null` allocates a pseudo-TTY, forwards the
        # exit code (bsdutils 2.37.2 on ubuntu-22.04), and suppresses the
        # typescript output file written by script. This creates all base tables
        # from schema.ts so that migrate-entry.ts FKs resolve correctly.
        run: script -q -c "npx drizzle-kit push --force" /dev/null
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          # Stripe validates its key at module-load time; stub prevents crash.
          STRIPE_SECRET_KEY: [REDACTED_STRIPE_TEST_KEY]_stub_no_real_calls
      - name: Apply database migrations
        # Runs all registered SQL migrations against the push-built schema.
        # All DDL uses IF NOT EXISTS / ADD COLUMN IF NOT EXISTS — no-ops on
        # tables already created by push. All DML uses ON CONFLICT DO NOTHING —
        # seeds catalog data (fee_bands, service_categories, offering types, etc.)
        # without conflicts. Migration 001's FKs to users/user_experiences now
        # resolve because push created those tables in the previous step.
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      - name: Verify migration ledger is idempotent (#28)
        # Runs the migration runner twice against the fresh CI Postgres: run 1
        # applies + records every file in schema_migrations; run 2 must apply
        # nothing. Fails the gate if the ledger isn't idempotent or doesn't record.
        run: npx tsx scripts/verify-migration-ledger.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      - name: Start dev server (PR artifact — localhost only)
        run: npx tsx server/index.ts &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          # Stripe key stub — stripe.service.ts throws at import if this is unset.
          # No real Stripe API calls are made during selection-controls tests.
          STRIPE_SECRET_KEY: [REDACTED_STRIPE_TEST_KEY]_stub_no_real_calls
          # Amadeus stub — new Amadeus({clientId}) runs at module load time and throws
          # ArgumentError if clientId is undefined. Providing a stub prevents the
          # server crash on import; no real Amadeus API calls are made in CI.
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          # Build identity — exposed via GET /api/version so tests can assert
          # they are talking to this PR's artifact, not a stale deployment.
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: development
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure
      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          echo "--- server process check ---"
          pgrep -a tsx || true
          echo "--- last server logs ---"
          journalctl -u traveloure 2>/dev/null || true
          exit 1
      - name: Verify build identity (artifact == PR commit)
        run: |
          VERSION=$(curl -sf http://localhost:5000/api/version)
          echo "Server reports: $VERSION"
          ACTUAL_SHA=$(echo "$VERSION" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          EXPECTED_SHA="${{ github.sha }}"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Build identity mismatch — server SHA=$ACTUAL_SHA expected=$EXPECTED_SHA. Tests would run against wrong artifact."
            exit 1
          fi
          echo "Build identity confirmed: $ACTUAL_SHA ✅"
      - name: Verify fee-config parity (display == charge, #2)
        # Billing invariant: GET /api/booking-fee-config (itinerary fee display) must
        # resolve the same rate the checkout charge does for the same context. Fails
        # if the endpoint regressed to booking_fee_configs or dropped a resolver input.
        run: npx tsx scripts/verify-fee-config-parity.ts
        env:
          BASE_URL: http://localhost:5000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      - name: Selection-controls DOM test
        run: npx playwright test selection-controls --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-controls-report
          path: playwright-report/
          retention-days: 14

  e2e-journey-2:
    name: e2e-journey-2 (Stage 3 exit gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: false  # Stage 3 exit gate — skipped until Stage 3 UI is built; re-enable then
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Apply database migrations
        # drizzle-kit push --force requires an interactive TTY which CI doesn't
        # have (throws "Interactive prompts require a TTY terminal"). Use
        # migrate-entry.ts instead — applies all SQL migrations, no TTY needed.
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      - name: Start dev server (PR artifact — localhost only)
        run: npx tsx server/index.ts &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: [REDACTED_STRIPE_TEST_KEY]_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: development
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure
      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a tsx || true
          exit 1
      - name: Seed E2E test accounts
        # Creates the role-scoped accounts global-setup.ts logs in as.
        # Must run after the server is ready (DB exists and migrations applied).
        run: npm run seed:e2e-accounts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          E2E_TEST_PASSWORD: TestPass123!
      - name: Journey-2 E2E test (Stage 3 exit gate)
        # Uses playwright.local.config.ts: testDir=./e2e/specs + globalSetup
        # that accepts http://localhost (NODE_ENV=development skips the Secure
        # cookie / HTTPS guard introduced for production deployments).
        run: npx playwright test journey-2 --project=chromium --config playwright.local.config.ts
        env:
          BASE_URL: http://localhost:5000
          E2E_TEST_PASSWORD: TestPass123!
          NODE_ENV: development
          CI: 'true'
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-2-report
          path: playwright-report/
          retention-days: 14

  report:
    name: report (PR completion comment)
    runs-on: ubuntu-latest
    needs: [lockfile-purity, verify-selection-controls, e2e-selection-controls]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## Selection Controls Gate — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl})`,
              '',
              '> Tests run against a locally-built artifact (localhost:5000), not the shared deployed app.',
              '> Build identity is verified before any assertion — a mismatch fails fast.',
              allGreen ? '' : '> A red `e2e-selection-controls` is a real behavior bug or server-startup failure — not a stale deployment.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
