name: Scheduled jobs (jobs-cron)

# BACKUP external trigger for the MONEY/INTEGRITY schedulers (scheduler-reliability lane, #1712).
#
# THE AUTHORITATIVE TRIGGER IS A REPLIT SCHEDULED DEPLOYMENT (ledger
# 2026-09-20-jobs-trigger-replit-scheduled), running the SAME script — scripts/ci/post-internal-jobs.sh
# --due — against production directly, every 15 minutes. See docs/ops/REPLIT_SCHEDULED_JOBS.md for the
# operator setup and how to verify it is actually firing. This workflow stays as a SECOND, independent
# path: GitHub's own schedule dispatch under-delivers under load — five runs were observed in ten
# hours against a */15 schedule on 2026-09-20, with gaps of 30 minutes to 5 hours — so it cannot be
# the SOLE trigger for MONEY/INTEGRITY jobs, but a GitHub-triggered pass racing a Replit-triggered one
# still just no-ops via each job's overlap dedupe (every job here is idempotent by design — §15 atomic
# conditionals / dedupe keys / DB-guarded mints), so running both is safe redundancy, not risk.
#
# THE DUE-BUCKET LOGIC LIVES IN THE SCRIPT, NOT HERE (ledger 2026-09-20-jobs-trigger-replit-scheduled).
# Two triggers — this workflow and the Replit Scheduled Deployment — must not carry two copies of
# "which cadence buckets are due right now" (§18 rule 1: one implementation): a copy here and a copy
# in the Replit deployment's own command would drift the moment either one changed, silently, the same
# way the FIVE-cron-schedule shape below it used to drift. So this workflow is now a THIN CALLER: one
# step runs `scripts/ci/post-internal-jobs.sh --due`, unmodified between the two triggers, which
# computes the due buckets from wall-clock UTC, maps them to routes from its OWN bucket→routes table,
# and posts them. See that script's header comment for the due rules and the bucket→routes table's
# parse contract.
#
# HISTORY, kept for context: this workflow used to declare FIVE cron schedules and gate each bucket
# with `if: github.event.schedule == '<that cron>'`. GitHub dispatches a multi-schedule workflow's
# matching schedule LATE and UNEVENLY under load: run 35487463992 (2026-09-20T03:46Z) fired for the
# six-hourly cron only — the 15-minute, hourly, four-hourly and daily buckets were ALL `skipped` that
# run — and production's /internal/jobs/health reported six stale MONEY/INTEGRITY jobs although
# INTERNAL_JOB_SECRET was correct and every endpoint answered 200. Ledger
# `2026-09-20-jobs-cron-single-schedule` collapsed that to ONE `*/15 * * * *` schedule with the
# due-by-wall-clock computation described above (at the time, still inline in this file); ledger
# `2026-09-20-jobs-trigger-replit-scheduled` (this revision) moved that computation into the script so
# a second, non-GitHub trigger could call the identical logic, and made the Replit Scheduled
# Deployment — not this workflow — the authoritative one, because even a single correctly-shaped
# schedule here inherited GitHub's own delivery unreliability (see that ledger row for the evidence).
#
# GUARDED (§18d): scripts/check-jobs-cron-roster.cjs pins that this file carries exactly ONE cron
# schedule and invokes the script in `--due` mode, and that every server/routes/internal.routes.ts
# JOB_CADENCE route this workflow is responsible for is posted by some bucket in the SCRIPT's own
# bucket→routes table — run in scheduler-jobs-gate.yml.
#
# NOTE: occasion-drafts has its own workflow (occasion-drafts-daily.yml) and is intentionally not
# duplicated here — its JOB_CADENCE bucket (`occasion-drafts-daily`) is out of this workflow's and
# the roster guard's scope. Partnerize's report-poll is intentionally NOT included — held for
# Lane 4's 404 triage; only Travelpayouts' poll is wired.
#
# NEGATIVE SPACE, stated because it is the load-bearing half of this fix: neither this workflow nor
# the script it calls can make GitHub Actions dispatch its schedule reliably, or make a Replit
# Scheduled Deployment fire on time — both are platform-level facts this repo cannot assert from
# inside a workflow run. Verifying the AUTHORITATIVE trigger is actually firing is an operator step —
# see docs/ops/REPLIT_SCHEDULED_JOBS.md's "How to verify" section.
#
# COLD-START WARM-UP + BOUNDED RETRY (ledger 2026-09-20-jobs-cron-cold-start-retry) — unchanged by
# this revision; see scripts/ci/post-internal-jobs.sh's header for the full contract. Env knobs the
# script reads (left at their defaults below; only set them here to override):
#   READY_PATH          — the readiness path polled before the first POST (default /api/ready).
#   WARMUP_MAX_SECONDS   — how long to wait for readiness before failing (default 120).
#   POST_RETRIES         — how many times a 404/503 route response is retried (default 3).
# `timeout-minutes` below is sized for the worst case: the warm-up poll timing out plus every posted
# route exhausting its retries.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      bucket:
        description: Cadence bucket to FORCE on manual dispatch (ignores the due-by-clock computation)
        required: true
        default: hourly
        type: choice
        options: [backstops, hourly, four-hourly, six-hourly, daily]

permissions:
  contents: read

env:
  BASE_URL: https://www.traveloure.com

jobs:
  post-due-buckets:
    name: Post every cadence bucket due this run (backup trigger — see header)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Post every due cadence bucket (or the dispatched FORCE_BUCKET)
        env:
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          FORCE_BUCKET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bucket || '' }}
        run: ./scripts/ci/post-internal-jobs.sh --due
