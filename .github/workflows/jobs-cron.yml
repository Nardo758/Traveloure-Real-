              failed=1
            fi
          done
          exit $failed

  four-hourly:
    name: Four-hourly integrity (booking-expiry)
    if: github.event.schedule == '0 */4 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.bucket == 'four-hourly')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
