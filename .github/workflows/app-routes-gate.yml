name: App Route Coverage Gate

# Guards against broken or missing routes reaching production.
#
# Jobs in this workflow:
#
#   setup (build + browser cache warm-up):
#
#     Runs immediately on push/PR. Installs deps, populates the Playwright
#     browser cache, and builds the production bundle. Both outputs are saved
#     via actions/cache so app-routes-smoke can restore them without repeating
#     the work. On a cache hit (same lock-file and source hash) this job
#     completes in under 60 seconds.
#
#   app-routes-smoke (Playwright DOM gate):
#
#     Depends on `setup` so both the browser binaries and the production bundle
#     are guaranteed to be in the cache before this job starts. The job restores
#     them, skips the expensive install/build, seeds CI test users, starts the
#     server, and runs app-routes.spec.ts.
#
# Visits every <Route path="..."> registered in client/src/App.tsx,
# including routes that are NOT listed in nav-config.ts (detail pages,
# onboarding flows, public share pages, role dashboards, etc.).
#
# Dynamic segments (:id, :token, :slug, …) are substituted with canonical
# placeholder values; duplicate resolved URLs are deduplicated.
# Auth-gated routes that redirect to "/" rather than 404ing pass all checks.
#
# Status context (for branch-protection required checks):
#   * app-routes-smoke — safe to mark as a REQUIRED branch-protection check,
#                        independently of navbar-links-smoke.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to avoid redundant gate checks.
concurrency:
  group: app-routes-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # setup: pre-warm Playwright browser cache + production build cache.
  #
  # No PostgreSQL service needed — this job only builds the bundle and
  # installs browser binaries. app-routes-smoke depends on this job and
  # restores both caches, so it never has to re-install browsers or re-build
  # the bundle — even on retries.
  # ─────────────────────────────────────────────────────────────────────────
  setup:
    name: setup (build + browser cache warm-up)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium + system deps)
        # Full --with-deps install only on a cache miss; subsequent runs
        # (including app-routes-smoke) restore the browser binaries from
        # cache and only need install-deps (which is fast, ~10 s).
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Cache production build output
        uses: actions/cache@v4
        id: build-cache
        with:
          path: dist/
          key: build-${{ runner.os }}-${{ hashFiles('client/**', 'server/**', 'shared/**', 'package-lock.json') }}

      - name: Build production bundle
        # Skipped on a cache hit — dist/ is fully restored from the cache
        # entry saved by a previous run with the same source hash.
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # app-routes-smoke: Playwright DOM gate.
  #
  # Depends on `setup` so both the browser binaries and the production bundle
  # are guaranteed to be in the cache before this job starts. The job restores
  # them, skips the expensive install/build, and goes straight to seeding CI
  # users and running the app-route coverage checks.
  # ─────────────────────────────────────────────────────────────────────────
  app-routes-smoke:
    name: app-routes-smoke (Playwright DOM gate)
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Restore Playwright browser cache
        # The setup job already populated this cache entry; this step should
        # always be a hit, making browser availability near-instant.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system deps
        # Browser binaries come from the restored cache; only the OS-level
        # system dependencies (shared libs, fonts, etc.) need to be installed.
        # This is always fast (~10 s) compared to the full --with-deps install.
        run: npx playwright install-deps chromium

      - name: Restore production build cache
        # The setup job built and cached dist/; this restores it so no
        # re-compilation is needed even on job retries.
        uses: actions/cache@v4
        with:
          path: dist/
          key: build-${{ runner.os }}-${{ hashFiles('client/**', 'server/**', 'shared/**', 'package-lock.json') }}

      - name: Set up CI database (migrations, sessions table, test users)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'true'

      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: [REDACTED_STRIPE_TEST_KEY]_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          PORT: 5000
          # Test-only: allow the plain-http localhost session cookie to be set
          # so globalSetup's ci-* logins yield reusable sessions. NEVER in prod.
          SESSION_COOKIE_INSECURE: '1'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1

      - name: App route coverage (all <Route path="..."> entries in App.tsx)
        # Extracts every path registered in client/src/App.tsx at test-collection
        # time — including routes that are NOT listed in nav-config.ts (detail
        # pages, onboarding flows, public share pages, role dashboards, etc.).
        # Dynamic segments (:id, :token, …) are substituted with canonical
        # placeholders; duplicate resolved URLs are deduplicated.
        # Auth-gated routes redirect to "/" rather than rendering NotFound, so
        # they pass the 404 gate and are skipped on the content check.
        run: npx playwright test app-routes --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'
          # Enable globalSetup (auth-state creation) — this workflow seeds the
          # ci-* users above, so login will succeed.
          PW_AUTH_SETUP: '1'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-routes-report
          path: playwright-report/
          retention-days: 14

  report:
    name: report (PR comment)
    runs-on: ubuntu-latest
    needs: [app-routes-smoke]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## App Route Coverage Gate — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl})`,
              '',
              '> Visits every `<Route path="...">` in `client/src/App.tsx`, including routes not in nav-config.ts',
              '> (detail pages, onboarding flows, public share pages, role dashboards, etc.).',
              '> A red gate means at least one route renders the 404 (NotFound) page **or** a blank/empty page with no heading or `<main>` content.',
              allGreen ? '' : '> Fix: ensure every failing path has a matching `<Route>` in `client/src/App.tsx` and that the page component renders real content (at least one h1/h2/h3 or a non-empty `<main>`).',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
