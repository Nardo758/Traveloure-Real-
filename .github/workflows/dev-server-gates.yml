          if-no-files-found: ignore
      - name: Upload cart-redirect Playwright JSON report (the spec-arming gate reads playwright-json*)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-cart-redirect
          path: reports/cart-redirect/json/
          if-no-files-found: ignore
      - name: Upload HTML reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-config-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: report (PR comment)
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [e2e-ai-stub, e2e-live-config]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always() && github.event_name == 'pull_request') }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## Dev-server Gates — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl}) — each former gate is its own named step; the failing step names the gate.`,
              '',
              '> **e2e-ai-stub**: i18n key parity, the provider console (Catalog map, Distribute, ServiceForm steps), the Aug 16 spec-coverage claims and the 2026-09-14 unwired specs, against one locally-built artifact with the AI stub on.',
              '> **e2e-live-config**: the cart redirect static check, Home, the slip rail actions, the Discover surfaces and the cart redirect browser test, against one locally-built artifact with the AI providers configured-but-stubbed.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
