name: ai-cost-attribution-gate

# Ledger `2026-09-17-ai-cost-actor-id` (decision-maker ruling 2026-09-17; migration 310).
# CLAUDE.md LD 44 (f), punchlist D-47, §13, §18 rule 1, §20 and the "Replit deploy-push vs. our
# migrations" CRITICAL block — `ai_cost_tracking` is the table that block names BY NAME as the
# publish casualty.
#
# WHY A JOB OF ITS OWN. The suite writes to `ai_cost_tracking` and asserts EXACT row sets for its
# own actors, and it asserts the table's whole index set. Sharing a database with a job that also
# makes model-shaped calls would make those assertions depend on a neighbour's fixtures.
#
# WHAT IS GREEN HERE AND WHAT IS NOT. A green run means: the writer records a non-uuid actor instead
# of losing the row, the reader attributes all three eras through ONE expression, nothing else
# inserts into the table, and the live shape matches `shared/schema.ts`. It does NOT mean the
# publish-time drizzle push will be clean against PRODUCTION — no CI database can answer that.
# `node scripts/preview-ai-cost-tracking-shape.cjs "<PROD_DATABASE_URL>"` is that instrument, and it
# is run by a human before publishing (docs/RELEASE.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ai-cost-attribution:
    name: ai-cost-attribution (migration 310; ledger 2026-09-17-ai-cost-actor-id)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      SESSION_SECRET: ci-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
      NODE_ENV: test
      JOURNEY_DB_WRITES_OK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # The shape preview's own self-test runs BEFORE the suite (the §18d fixtures-first
      # precedent): it contacts no database and proves only that the script's expectation table has
      # not drifted from the `aiCostTracking` declaration in `shared/schema.ts`. If that drifts, the
      # instrument a human runs against production before publishing is already lying.
      - name: The shape preview agrees with the declaration (--self-test, no DB)
        run: node scripts/preview-ai-cost-tracking-shape.cjs --self-test
      - name: Set up CI database (migrations from EMPTY + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          seed-ci-users: 'false'
      # The same preview against the database the migrations just built from empty: ZERO diff is the
      # only passing answer, and it is what makes the script's production run meaningful.
      - name: The shape preview reports ZERO diff against a DB built from the migrations
        run: node scripts/preview-ai-cost-tracking-shape.cjs "$DATABASE_URL"
      # W1 the row that used to vanish (non-uuid actor ⇒ one row, actor_id set, user_id NULL, with
      # the 22P02 negative beside it); W2 a uuid actor writes both; W3 §13 — no actor ⇒ both NULL;
      # W4 ONE expression attributes the pre-310, uuid and non-uuid eras and no stranger; W5 the
      # static one-writer pin; W6 D-47's three values through the REAL create service for a non-uuid
      # asker; W7 the live column and index set match the declaration and 310 added no index.
      - name: The attribution rails (W1-W7)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/ai-cost-attribution.db.test.ts
      # The migration is also re-run here as a no-op: a second apply must change nothing (the
      # `ADD COLUMN IF NOT EXISTS` posture), and the ledger must report zero new applies.
      - name: Re-running the migrations is a no-op
        run: npx tsx server/migrations/migrate-entry.ts
