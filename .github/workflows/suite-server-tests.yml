name: Suite Server Tests

# server/__tests__ closed as a CLASS (ledger 2026-09-15-orphans-t8-t9-server-tests-class).
# Its own workflow file, not a build.yml job: this job boots the production bundle with
# ALLOW_TEST_ACCOUNTS=1 for the ci-* accounts the suites log in as, and
# `scripts/check-env-allowlist.cjs` predicate (c) forbids that flag anywhere in a
# deploy-targeting workflow file (ledger 2026-09-16-ci-main-red-repairs, the same move
# made for suite-mutation-auth and suite-ai-draft-and-availability).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: suite-server-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite-server-tests:
    name: suite-server-tests (server/__tests__ as a class — DB + app)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      SESSION_SECRET: ci-test-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
      NODE_ENV: test
      JOURNEY_DB_WRITES_OK: '1'
      JOURNEY_BASE_URL: http://127.0.0.1:5000
      BASE_URL: http://127.0.0.1:5000
      # `tier2-security-audit.http.test.ts` THROWS AT IMPORT without this, and
      # without it the mutation-auth-shaped audits skip themselves — the
      # green-but-vacuous shape triage note 3 forbids wiring.
      TIER2_DEV_AUDIT_OK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set up CI database (migrations + sessions table + ci-* accounts)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure
          # 'true' here, unlike the T-4/T-5 jobs: three suites in this directory
          # (booking-eligibility-gates, market-insights, provider-office-location)
          # log in as ci-provider@traveloure.test, which only this seed creates.
          seed-ci-users: 'true'
      - name: Build production bundle
        run: npm run build
      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          EMAIL_FROM: noreply@ci.traveloure.test
          NODE_ENV: production
          ALLOW_TEST_ACCOUNTS: '1'
          PORT: 5000
          SESSION_COOKIE_INSECURE: '1'
          RATE_LIMIT_LOOPBACK_SKIP: '1'
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://127.0.0.1:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then echo "Server ready"; exit 0; fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"; exit 1
      # T-9 — the `server/__tests__` CLASS. Every suite in the directory that
      # can honestly run is named here, in four alphabetical steps so a failure
      # points at a short list rather than at 226 files. The files are NAMED
      # rather than globbed for one reason and it is not style: six of them must
      # NOT run in this job, and `scripts/check-test-files-wired.cjs` cannot
      # follow a shell substitution (`$(ls … | grep -v …)`), so an exclusion
      # expressed that way would make the whole directory read as UNREACHABLE.
      # The six, each with its reason, are listed at the end of this job.
      #
      # NO STEP ORDER IS LOAD-BEARING. The one ordering hazard this lane found —
      # `GET /api/discover/location/:city` is served from an in-process 5-minute
      # cache keyed by city, and `fp1-console-defects`'s B4-b asserts the payload
      # contains rows it has just created — was fixed IN THE SUITE: B4-b now
      # seeds and reads a RUN-UNIQUE city of its own. Do not reintroduce an
      # order dependency here.
      - name: server/__tests__ 1/4 (node:test)
        run: npx tsx --test --test-concurrency=1 --test-force-exit server/__tests__/admin-query-role-changes.test.ts server/__tests__/adopt-stop.db.test.ts server/__tests__/adopt-version-semantics.db.test.ts server/__tests__/advisor-conversation-context.test.ts server/__tests__/affiliate-booking-trip-link.contract.test.ts server/__tests__/affiliate-reconciliation-matching.test.ts server/__tests__/affiliate-reconciliation-token-adoption.test.ts server/__tests__/affiliate-reconciliation-travelpayouts.test.ts server/__tests__/affiliate-subid-attribution.test.ts server/__tests__/ai-draft-eligibility.test.ts server/__tests__/ai-error-sanitizer.test.ts server/__tests__/ai-json-parse.test.ts server/__tests__/ai-rate-limit-coverage.test.ts server/__tests__/audit-log-atomicity.unit.test.ts server/__tests__/authored-item-price-contract.db.test.ts server/__tests__/availability-model.db.test.ts server/__tests__/balance-payer-atomicity.db.test.ts server/__tests__/balance-payer.test.ts server/__tests__/benchmark-facts-denorm.db.test.ts server/__tests__/booking-agent-claim.db.test.ts server/__tests__/booking-agent-confirmed.db.test.ts server/__tests__/booking-ai-price-guard.test.ts server/__tests__/booking-auto-complete.db.test.ts server/__tests__/booking-birth-provenance.db.test.ts server/__tests__/booking-completion-machinery.db.test.ts server/__tests__/booking-confirm-payment-idempotency.test.ts server/__tests__/booking-decline-reason.test.ts server/__tests__/booking-eligibility-gates.db.test.ts server/__tests__/booking-fee-bootstrap-and-split-fallback.db.test.ts server/__tests__/boot-log-ordering.test.ts server/__tests__/build-info.test.ts server/__tests__/bundle-component-linking.db.test.ts server/__tests__/calendar-date-client.test.ts server/__tests__/cart-priceless-listing.http.test.ts server/__tests__/cart-quantity-admission.http.test.ts server/__tests__/cart-trip-handoff.db.test.ts server/__tests__/category-key-repair.db.test.ts server/__tests__/checkout-claim-sweep.db.test.ts server/__tests__/checkout-payment-promotion.db.test.ts server/__tests__/city-case-match.db.test.ts server/__tests__/concierge-admin-signal.test.ts server/__tests__/confirm-honesty.test.ts server/__tests__/console-sigma-kyoto-bench.http.test.ts server/__tests__/console-sigma-lead-confirm-notify.http.test.ts server/__tests__/console-sigma-reorder-divergence.db.test.ts server/__tests__/console-sigma-workspace-machine.http.test.ts server/__tests__/contact-rails.test.ts server/__tests__/contract-stats.test.ts server/__tests__/coordination-fee-refund-guard.test.ts server/__tests__/coordination-ledger-gap-review.test.ts server/__tests__/coordination-refund-credit-release.test.ts server/__tests__/cors-allowlist.test.ts server/__tests__/custom-venues-owner-scope.test.ts server/__tests__/dates-confirmed.db.test.ts server/__tests__/demand-onepager-approval.test.ts server/__tests__/demand-onepager-render.test.ts server/__tests__/demand-onepager.test.ts server/__tests__/demand-rollup.test.ts
