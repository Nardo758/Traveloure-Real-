name: Home Gate

# Ledger `2026-09-07-home-gate` (CLAUDE.md Locked Decision 45 (8); Console & AI Concierge brief,
# register defect D1).
#
# WHY THIS GATE EXISTS. Lane L10 rebuilt Home around the time axis and moved the plan card, the
# routing counts, the expert panels and the message previews OFF the page — and proved all of it
# with PURE tests: the greeting sentence, the relative-day label, the server's row builder. No
# armed browser gate opened `/dashboard` at all, so the page-level assertions the brief asked for
# existed nowhere. A panel left mounted, a section dropped in a merge, or a start tile whose
# handler moved throws nothing, fails no type check, and shows up only for the traveler.
#
# STATED NEGATIVE SPACE (§18d — green means green-within-stated-bounds): the suite does not seed
# dated fixtures (a booking, a balance, an occasion draft), so it asserts that Coming up resolves
# to ONE of its two honest states rather than which rows appear — the row shape is
# `server/services/__tests__/upcoming.test.ts`'s answer. It does not pin the greeting sentence
# (pure) and does not assert the home-city block, which correctly renders for nobody with no
# `users.home_city`. The spec header carries the same list.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-home-gate:
    name: e2e-home-gate (DOM gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Assert the spec exists
        # A renamed or deleted spec makes Playwright report "0 passed" and exit 0, which would let
        # this gate go green with nothing run. `passWithNoTests: false` in playwright.config.ts is
        # the other half; this fails first, with a message that names the file.
        run: |
          if [ ! -f playwright/tests/home-gate.spec.ts ]; then
            echo "::error file=.github/workflows/home-gate.yml::playwright/tests/home-gate.spec.ts is missing — restore it or update this workflow."
            exit 1
          fi
          echo "spec present ✅"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Set up CI database (migrations + sessions table)
        uses: ./.github/actions/ci-db-setup
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/traveloure

      - name: Start dev server (PR artifact — localhost only)
        run: npx tsx server/index.ts &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          # Stub keys: stripe.service.ts throws at import without one, and this suite deliberately
          # never reaches a real charge or a real generation.
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          STRIPE_WEBHOOK_SECRET: whsec_ci_stub_no_real_calls
          XAI_API_KEY: xai-ci-stub-no-real-calls
          ANTHROPIC_API_KEY: sk-ant-ci-stub-no-real-calls
          RESEND_API_KEY: re_ci_stub_no_real_calls
          # Build identity — exposed via GET /api/version so the step below can assert the tested
          # binary is this PR's artifact rather than a stale process.
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: development
          PORT: 5000
          # Each test registers a user, mints a plan and reloads an API-heavy console page from ONE
          # loopback IP; the general /api limiter (100 req/min/IP) would 429 the later tests.
          # Test-only server. NEVER set in production.
          RATE_LIMIT_LOOPBACK_SKIP: '1'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure

      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a tsx || true
          exit 1

      - name: Verify build identity (artifact == PR commit)
        run: |
          VERSION=$(curl -sf http://localhost:5000/api/version)
          echo "Server reports: $VERSION"
          ACTUAL_SHA=$(echo "$VERSION" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))")
          EXPECTED_SHA="${{ github.sha }}"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Build identity mismatch — server SHA=$ACTUAL_SHA expected=$EXPECTED_SHA. Tests would run against the wrong artifact."
            exit 1
          fi
          echo "Build identity confirmed: $ACTUAL_SHA ✅"

      - name: Open Home in a browser and assert what ruling 8 left there
        run: npx playwright test home-gate --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: home-gate-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
