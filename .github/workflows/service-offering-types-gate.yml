name: Service Offering Types Gate

# Guards against migrations silently deactivating or deleting rows in
# service_offering_types and expert_offering_types that power the /earn page.
#
# Root cause history: migrations 038 seeded 47 service_provider rows and
# ~39 expert rows; a later task (fixed by migration 095) deleted/deactivated
# the service_provider rows, causing /earn to show "No offerings published yet."
# silently. The event_planner and expert tracks share the same tables and are
# equally at risk — restore migrations exist for each:
#   • 095_restore_service_provider_offering_types.sql — service_provider rows
#   • 098_restore_event_planner_offering_types.sql    — event_planner rows
#   • 099_restore_expert_offering_types.sql           — trip_planner + local_expert rows
# This gate catches regressions before they ship by:
#
#   1. verify-service-offering-types (HTTP count check, no DB access) —
#      spins up a local server, hits /api/offering-types/services and
#      /api/offering-types/experts, and asserts minimum active row counts
#      for all four /earn tracks:
#        • service_provider  ≥ 30 rows (service_offering_types, non-event categories)
#        • event_planner     ≥  8 rows (service_offering_types, EVENT_CATEGORY_KEYS)
#        • trip_planner      ≥  8 rows (expert_offering_types, planning+coordination tiers)
#        • local_expert      ≥ 15 rows (expert_offering_types, advisory+live_support+specialized tiers)
#      Exits non-zero if any count falls below its threshold.
#
#   2. earn-page-smoke (Playwright DOM gate) —
#      visits /earn with each of the four role query params and asserts the
#      offering catalog has at least one visible card (earn-catalog data-testid).
#      A missing or empty catalog fails the job.
#
# Status contexts (for branch-protection required checks):
#   * verify-service-offering-types — pure HTTP gate; safe to mark REQUIRED.
#   * earn-page-smoke              — DOM gate; safe to mark REQUIRED.
#   * report                       — PR comment; informational only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-service-offering-types:
    name: verify-service-offering-types (HTTP count gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Apply database migrations
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      - name: Create sessions table (connect-pg-simple workaround)
        run: npx tsx scripts/create-sessions-table.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      - name: Start dev server
        run: npx tsx server/index.ts &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: development
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure
      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a tsx || true
          exit 1
      - name: Assert offering counts for all four /earn tracks
        # Hits /api/offering-types/services and /api/offering-types/experts,
        # checks floor counts for service_provider, event_planner, trip_planner,
        # and local_expert. Fails non-zero when any count is below its floor.
        # This is the primary guard against a migration silently breaking /earn.
        run: npx tsx scripts/verify-service-offering-types.ts
        env:
          BASE_URL: http://localhost:5000

  earn-page-smoke:
    name: earn-page-smoke (Playwright DOM gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveloure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Apply database migrations
        run: npx tsx server/migrations/migrate-entry.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      - name: Create sessions table (connect-pg-simple workaround)
        run: npx tsx scripts/create-sessions-table.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
      - name: Cache production build output
        uses: actions/cache@v4
        id: build-cache
        with:
          path: dist/
          key: build-${{ runner.os }}-${{ hashFiles('client/**', 'server/**', 'shared/**', 'package-lock.json') }}

      - name: Build production bundle
        # The smoke gate serves a PRODUCTION build (serveStatic, no Vite):
        # under NODE_ENV=development the Vite dev middleware's HMR WebSocket
        # (ws://…/vite-hmr) 400s against the CI server and trips the spec's
        # "no JS errors" assertion — a false red. In prod mode HMR does not
        # exist, so the whole error class disappears. Startup seeding still
        # runs: it is gated on ENVIRONMENT !== "PROD", not NODE_ENV
        # (server/index.ts), so /api/ready flips true exactly as before.
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build
      - name: Start production server
        run: node dist/index.cjs &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveloure
          SESSION_SECRET: ci-test-secret-not-for-production
          STRIPE_SECRET_KEY: sk_test_ci_stub_no_real_calls
          AMADEUS_API_KEY: amadeus-ci-stub-no-real-calls
          AMADEUS_API_SECRET: amadeus-ci-stub-no-real-calls
          GIT_COMMIT: ${{ github.sha }}
          NODE_ENV: production
          PORT: 5000
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGDATABASE: traveloure
      - name: Wait for server and seeding
        run: |
          for i in $(seq 1 60); do
            result=$(curl -s http://localhost:5000/api/ready || true)
            if echo "$result" | grep -q '"ready":true'; then
              echo "Server ready and seeding complete ✅"; exit 0
            fi
            echo "attempt $i/60: waiting... ($result)"; sleep 5
          done
          echo "::error::Server did not become ready within 5 minutes"
          pgrep -a node || true
          exit 1
      - name: /earn catalog DOM smoke tests (all four tracks)
        # Uses the default playwright.config.ts (testDir: ./playwright/tests).
        # No globalSetup / auth needed — /earn is a public page.
        # Covers: service_provider, event_planner, trip_planner, local_expert.
        run: npx playwright test earn-smoke --project=chromium
        env:
          BASE_URL: http://localhost:5000
          CI: 'true'
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earn-smoke-report
          path: playwright-report/
          retention-days: 14

  report:
    name: report (PR comment)
    runs-on: ubuntu-latest
    needs: [verify-service-offering-types, earn-page-smoke]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Post pass/fail summary to the PR
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const rows = Object.entries(needs).map(([job, d]) => `- ${icon(d.result)} \`${job}\` — ${d.result}`);
            const allGreen = Object.values(needs).every((d) => d.result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `## Service Offering Types Gate — ${allGreen ? 'all green ✅' : 'attention needed ❌'}`,
              '',
              ...rows,
              '',
              `[Run details](${runUrl})`,
              '',
              '> Guards against migrations silently deactivating rows in service_offering_types / expert_offering_types.',
              '> Covers all four /earn tracks: service_provider, event_planner, trip_planner, local_expert.',
              '> A red gate means /earn would show "No offerings published yet." for one or more tracks.',
              allGreen ? '' : '> Fix: re-run the matching restore migration — 095 (service_provider), 098 (event_planner), or 099 (expert tracks) — with ON CONFLICT DO UPDATE SET is_active = true.',
            ].filter(Boolean).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
