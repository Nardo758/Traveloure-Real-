kind = "web"
previewPath = "/traveloure-marketplace/"
title = "Traveloure Marketplace Field Guide"
description = "A focused Traveloure marketplace experience for discovering destinations, ready-made trips, events, and local services with the selected Field Guide design."
version = "1.0.0"
id = "artifacts/traveloure-marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/traveloure-marketplace/" ]
localPort = 23435

[services.development]
run = "pnpm --filter @workspace/traveloure-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/traveloure-marketplace", "run", "build" ]
serve = "static"
publicDir = "artifacts/traveloure-marketplace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23435"
BASE_PATH = "/traveloure-marketplace/"
